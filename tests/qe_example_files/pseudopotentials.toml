# Third-party pseudopotentials read by the QE example tree.
#
# The files are not kept in git. tests/_test_data_cache.py downloads each one
# from `url` into the host-local test-data cache, checks the bytes against
# `sha256` (the upstream file, unmodified), and the test session links it at
# every path of `locations` (relative to this directory) in its mirror of
# tests/qe_example_files. QE reads the pseudopotential named in
# data-file-schema.xml from the save directory, hence the copies there.
#
# Pre-populate the cache with `python -m tests._test_data_cache`.

[[pseudopotential]]
name = "H.coulomb-ae.UPF"
url = "https://pseudopotentials.quantum-espresso.org/upf_files/H.coulomb-ae.UPF"
sha256 = "135c0d8fda51204c41a54e67c929654fd16f87ae447e6f2ab1e79c0479d5ff38"
locations = [
  "H.coulomb-ae.UPF",
  "H-ae_gamma/out/h_gamma.save/H.coulomb-ae.UPF",
  "H-ae_k025/out/h_k025.save/H.coulomb-ae.UPF",
]

