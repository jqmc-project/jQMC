runtime_receipt:
  notes: These comparison-receipt rules apply to explicit receipt-producing contracts. Ordinary-module completion records
    pytest outcomes rather than tracing or reinterpreting comparisons. Scientific tests and explicitly called comparison
    helpers own numerical verdicts, and central tolerance sources remain mandatory.
  missing-receipt: fail-certificate
  unknown-policy: fail-certificate
  wrong-precision-policy: fail-certificate
  inline-tolerance-override: fail-certificate
  skip: fail-certificate
  xfail: fail-certificate
enforcement:
  static:
    command: python scripts/check_no_inline_tolerances.py
    pre_commit_hook: gdd-contracts
  runtime:
    state: required-case-pytest-outcome-completion
    notes: 'The pytest harness emits setup/call/teardown outcomes through gdd.engine.execution_records; a required
      case passes only when every phase passes in its required precision/execution profiles.
      Ordinary-module completion does not reinterpret claims, trace scientific comparisons, or maintain manual case-count pins.
      Explicit analytical-derivative receipts retain their separate completion and comparison validation.'
    required-before-cutover: true
