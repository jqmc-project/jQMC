schema_version: 1
document:
  id: jqmc.verdicts
  version: 1
  lifecycle: cutover
  title: Verdict contract
  purpose: 'The single ledger of what makes a jQMC test count as correct. It declares the five guarantee classes (WHAT KIND
    of correctness a passing test proves), the finite verdict-method catalog (BY WHICH oracle/mechanism a test may claim correctness),
    and the executable pass criteria those methods bind: comparison policies with centrally governed tolerances, and observation
    checklists for non-numerical checks. Every governed guarantee assigns its verdict methods by ID; a witness name or a bare
    pytest assertion is never evidence.'
enforcement_map:
  classes: scripts/check_gdd_derivatives_contract.py
  verdict_methods: scripts/check_gdd_derivatives_contract.py
  evidence_ordering_rules: per-rule
  check_contract: gdd.engine.evidence.ComparisonBinding
  precision_dispositions: gdd.engine.evidence.ObservationBinding
  comparator_semantics: gdd.engine.evidence.observe_allclose
  tolerance_source_contract: scripts/check_no_inline_tolerances.py
  tolerance_registry: gdd.engine.evidence.ComparisonBinding
  comparison_policies: gdd.engine.evidence.ComparisonBinding
  observation_policies: gdd.engine.evidence.ObservationBinding
  runtime_receipt: gdd.engine.evidence.ComparisonReceipt
  enforcement: scripts/check_gdd_test_mapping.py
classes:
- kind: physical
  prefix: PHY
  rank: 1
  question: Does the result satisfy the relevant physical law or invariant?
  proves: 'The physics itself, on the tested cases: symmetry and covariance, conservation laws, limiting behavior, agreement
    with an exactly known or independently established physical reference. This is the strongest class because it is independent
    of every implementation choice.'
  not_proved: Coverage beyond the tested cases; a physical invariant holding on one wavefunction says nothing about another.
  examples:
  - translational/rotational invariance of the local energy
  - hermiticity and known eigenvalues on exactly solvable references
  - correct limiting behavior (cusp conditions, large-distance decay)
  status: Governed PHY guarantees are in the module ledgers (atomic orbitals, Coulomb potential, determinant, Hamiltonians,
    Jastrow factor, wavefunction and others).
- kind: mathematical
  prefix: MATH
  rank: 2
  question: Does the implementation satisfy the defining mathematical identity of the quantity?
  proves: 'That the produced value equals what the mathematics defines, checked against an independent formulation: an analytical
    derivative against the automatic-differentiation oracle of the same forward model, or a reviewed exact identity between
    two estimators.'
  not_proved: That the shared forward model is physically right. Analytical and autodiff derivatives of the same wrong ln(Psi)
    agree perfectly; shared-error risk is arbitrated by higher-rank or independent evidence, never by more agreement.
  examples:
  - analytical derivative == autodiff (MATH-DERIV-LOG-WAVEFUNCTION-001, MATH-DERIV-LOCAL-ENERGY-001)
  - GFMC conventional/load-balanced local-energy derivatives vs the driver-equivalent AD oracle
  - reviewed identities (load-balanced == conventional local energy; potential independence of ln(Psi))
  status: Governed MATH guarantees cover the derivative universe and the atomic-orbital identities.
- kind: numerical
  prefix: NUM
  rank: 3
  question: Is the result stable and meaningful in the supported numerical regime?
  proves: 'Numerical grounding: an independent finite-difference anchor with reviewed stencils and steps, behavior across
    reviewed conditioning regimes such as the cond_2(G) ranges, and that supported precision modes execute with finite, well-shaped
    outputs.'
  not_proved: Full-universe correctness. Finite differences are reviewed sentinels, not a second copy of the whole obligation
    universe, and a mixed-precision smoke check is never a correctness oracle.
  examples:
  - finite difference == autodiff on 52 reviewed sentinel cases (NUM-DERIV-FD-AUTODIFF-001)
  - reviewed cond_2(G) regimes R01-R10 with sigma_min(G) guards
  - mixed-precision route smoke (NUM-DERIV-MIXED-001)
  status: Governed NUM guarantees cover the FD sentinels, mixed-precision routes, and atomic-orbital FD anchors.
- kind: implementation
  prefix: IMPL
  rank: 4
  question: Do independent implementations and production routes agree?
  proves: 'That optimized or alternate routes preserve the already-established contract: Rust == XLA on every required cell,
    debug == production route parity, fast-update == full-recompute equivalence.'
  not_proved: Physical or mathematical correctness. Two backends can agree while sharing the same physical error; parity evidence
    is necessary but is never relabeled as proof of a higher class.
  examples:
  - Rust == XLA analytical parity on all 1019 obligations (IMPL-DERIV-RUST-XLA-001)
  - debug == production route parity (fixed-snapshot shadow oracles)
  - fast-update == full-recompute equivalence (future separate guarantee)
  status: Governed IMPL guarantees cover Rust/XLA parity, debug==production routes, and layout equivalence.
- kind: operational
  prefix: OPS
  rank: 5
  question: Was the required evidence actually selected, executed, and enforced?
  proves: 'Closure: every required obligation is registered by exactly one collected required case, and every registered
    case emits exactly its registered receipts when it runs. This is what makes the other classes trustworthy at scale.'
  not_proved: Anything scientific by itself; an operational certificate over weak obligations is weak. Which CI job runs a
    case is CI configuration, not a guarantee.
  examples:
  - exact derivative closure of the collected cases against the pinned universes (OPS-DERIV-CLOSURE-001)
  status: Governed OPS guarantees cover the derivative evidence-chain closure, the no-autodiff and eager-compile rules of the
    derivatives, evidence-harness isolation, and the static and anti-vacuity guards of the Rust evidence set.
evidence_ordering_rules:
- rule: A guarantee's ID prefix and kind field must agree with this taxonomy.
  enforced_by: scripts/check_gdd_derivatives_contract.py
- rule: Reclassifying a guarantee (for example relabeling implementation parity as mathematical or physical proof) changes
    its ID, which the pinned guarantee vocabulary and reviewed digests turn into an explicit review.
  enforced_by: scripts/check_gdd_derivatives_contract.py
- rule: Shared-error risk between twin formulations is arbitrated by an independent anchor of a different class, encoded as
    the ordered assurance chain finite-difference -> autodiff==analytical -> Rust==XLA.
  enforced_by: scripts/check_gdd_derivatives_contract.py
verdict_methods:
- id: VM-NUM-MIXED-FIDELITY-001
  classes: [numerical]
  oracle: same-production-route-rebuilt-in-full-precision
  comparison_policies: [CMP-MIXED-FULL-FIDELITY-001]
  observation_policies: [OBS-ROUTE-LIVENESS-001]
  allowed-precision-modes: [mixed]
  meaning: >-
    On identical deterministic inputs, a production quantity evaluated from an independently rebuilt mixed-precision
    case stays within its quantity-class error model of the same production route rebuilt and evaluated in full precision.
    Vector-valued quantities are compared once per homogeneous logical block against the block infinity norm, so an
    individually cancelling component cannot tighten the block budget.
  limits: >-
    This is a numerical-fidelity verdict, not an independent mathematical oracle, backend-parity claim, or permission to
    weaken a full-precision correctness comparison. It applies only to registered quantity classes and deterministic inputs;
    Monte Carlo error bars cannot replace the direct comparison.
- id: VM-NUM-FIXED-INPUT-FD-001
  classes: [numerical]
  oracle: independently-displaced-production-forward-finite-difference
  comparison_policies: [CMP-FD-AUTODIFF-FULL-001]
  observation_policies: [OBS-ROUTE-LIVENESS-001]
  meaning: >-
    On declared deterministic full-precision inputs, analytical derivatives or stored derivative moments
    agree with finite differences of the primal quantity using the declared perturbation and stencil.
    Required components, step checks and non-vacuity are specified by each guarantee and enforced by its
    evidence. The existing central tight FD tolerance is unchanged.
  limits: >-
    No mixed FD verdict, statistical acceptance window, absolute physical energy reference or rigorous
    truncation-error bound is claimed. Parameter probes test selected directions of each active block,
    not every parameter component. A fault-control test proves rejection, not another production case.
- id: VM-NUM-ANALYTICAL-FD-001
  classes:
  - numerical
  oracle: independently-displaced-production-forward-finite-difference
  comparison_policies:
  - CMP-FD-AUTODIFF-FULL-001
  observation_policies:
  - OBS-ROUTE-LIVENESS-001
  meaning: Analytical derivatives agree with finite differences of the production forward quantity on fixed full-precision
    inputs. Declared independent perturbations, stencil and two step sizes check numerical convergence. Each required output
    component is finite and distinguishable from zero at the comparison tolerance.
  limits: This checks analytical differentiation, not an autodiff route or the absolute physical correctness of the forward
    quantity. It is limited to the declared deterministic configurations and perturbations. It does not certify mixed finite
    differences or prove a rigorous truncation-error bound. The central tight FD tolerance is reused unchanged; no new numerical
    budget is introduced.
- id: VM-NUM-COMPLEX-ECP-FD-001
  classes:
  - numerical
  oracle: fixed-input-complex-forward-finite-difference
  comparison_policies:
  - CMP-FD-AUTODIFF-FULL-001
  observation_policies:
  - OBS-ROUTE-LIVENESS-001
  meaning: On the declared full-precision ECP configurations and fixed quadrature, independently displaced real parameter
    directions determine complex local-energy and wavefunction derivatives by the declared central Richardson stencil. Both
    real and imaginary components agree with the analytical source. Finite-sample identities and the well-conditioned declared
    LM subspace may use these independently checked inputs.
  limits: This method is limited to the complex-ECP derivative and optimizer sentinels. It does not admit mixed-precision
    finite differences, certify the forward Hamiltonian without its separate absolute reference, or compare different precisions.
    The declared steps, directions and LM conditioning controls are part of the evidence.
- id: VM-MATH-COMPLEX-ECP-CONSUMPTION-001
  classes:
  - mathematical
  - implementation
  oracle: independent-fixed-input-complex-ecp-consumer-algebra
  comparison_policies:
  - CMP-FIXED-SAMPLE-FP64-001
  - CMP-EXACT-VALUES-001
  - CMP-ZONE-ALLCLOSE-STRICT-001
  - CMP-ZONE-ALLCLOSE-MEDIUM-001
  observation_policies:
  - OBS-ROUTE-LIVENESS-001
  meaning: Actual MCMC energy and derivative buffers reach the real-coordinate optimizer unchanged, and generalized-force
    and nonsymmetric LM sample algebra agree with independent reductions of the same specified samples. Exact transfers are
    checked separately from recomputed scientific quantities and fp64 host reductions.
  limits: Scoped to the complex-ECP consumer tests. The fixed-sample fp64 policy is only for host arithmetic on identical
    arrays, never an fp64 reference for mixed scientific computation. No sampling-error band, energy-convergence claim or
    Hermitian averaging of the finite-sample LM Hamiltonian is permitted by this method.
- id: VM-MATH-LM-GENERALIZED-EIGEN-001
  classes:
  - mathematical
  oracle: independent-original-basis-generalized-eigensolve
  comparison_policies:
  - CMP-LM-HOST-FP64-001
  observation_policies: []
  meaning: The host LM update, energy and reference weight agree with a direct generalized Hermitian eigensolve, and satisfy
    its original-basis residual.
  limits: Scoped to the two reviewed well-conditioned real/complex inputs; no cutoff-branch or sampler convergence claim,
    and no mixed-versus-full comparison.
- id: VM-MATH-FIXED-SAMPLE-001
  classes:
  - mathematical
  oracle: independent-finite-sample-statistical-identity
  comparison_policies:
  - CMP-FIXED-SAMPLE-FP64-001
  - CMP-EXACT-VALUES-001
  observation_policies: []
  meaning: The fp64 postprocessor's mean and standard error equal the independent algebraic reference of the same finite input.
    Repeated and scaled samples obey their finite-data identities; sampling-error bands cannot replace direct comparisons.
  limits: This checks arithmetic on specified equal-weight, equal-sized bins. It does not establish sampling convergence,
    independence, a universal inverse-square-root law for raw sample counts, or permission to change another method's tolerance.
- id: VM-MATH-NATIVE-GAUSSIAN-001
  classes:
  - mathematical
  oracle: independent-inverse-function-on-specified-fp64-uniforms
  comparison_policies:
  - CMP-NATIVE-GAUSSIAN-F64-001
  - CMP-EXACT-VALUES-001
  observation_policies: []
  meaning: Every native Gaussian output agrees with an independent inverse-function evaluation for the same specified Threefry
    uniform input; the forward erf relation is also checked pointwise. XLA values must also match the independent reference
    and native values at that same bound. Both global precision modes use fp64 sampler state and the existing central consistency
    symbol pair, not a statistical sampling-error band.
  limits: This is an approximation contract on the declared scalar-function inputs, not a distributional test, an RNG-quality
    proof, a new precision zone, or permission to use this policy for other mathematical or backend verdict methods.
- id: VM-MATH-AD-ORACLE-001
  classes:
  - mathematical
  oracle: xla-autodiff-of-the-same-forward-model
  comparison_policies:
  - CMP-ZONE-ALLCLOSE-STRICT-001
  - CMP-ZONE-ALLCLOSE-MEDIUM-001
  - CMP-DERIV-AUTODIFF-ANALYTICAL-FULL-001
  observation_policies:
  - OBS-ROUTE-LIVENESS-001
  - OBS-GFMC-ROUTE-001
  meaning: The production analytical value equals the automatic derivative of the same forward model, within centrally governed
    tolerances, with the production route and required output leaves witnessed live.
  limits: Both sides differentiate the same forward model, so a wrong model passes; shared-error risk is arbitrated by the
    independent finite-difference anchor, never by more agreement.
- id: VM-MATH-REVIEWED-IDENTITY-001
  classes:
  - mathematical
  oracle: reviewed-exact-identity
  comparison_policies:
  - CMP-EXACT-VALUES-001
  - CMP-RAW-BITS-001
  - CMP-ZONE-ALLCLOSE-STRICT-001
  - CMP-SOURCE-CENTRAL-PAIR-001
  - CMP-ZONE-ATOL-ZERO-RTOL-001
  observation_policies:
  - OBS-ROUTE-LIVENESS-001
  meaning: Two quantities that mathematics requires to be equal (load-balanced vs conventional local energy; ln(Psi) under
    exchanged potential data) are compared directly, with the identity's precondition witnessed.
  limits: An identity constrains the implementation, not the physics; it proves nothing about quantities outside the identity.
- id: VM-MATH-UPF-FIT-CARDINALITY-001
  classes:
  - mathematical
  oracle: reviewed-discrete-count-bound
  comparison_policies:
  - CMP-EXACT-VALUES-001
  observation_policies:
  - OBS-ROUTE-LIVENESS-001
  meaning: The reviewed UPF automatic-fit test bounds the number of selected Gaussian exponents by its explicit minimum and
    maximum.
  limits: Scoped to test_fit_auto_selects_reasonable_n; neither fit accuracy nor a floating-point identity is certified by
    a cardinality bound or finite condition number.
- id: VM-REGIME-CONDITIONED-PROOF-001
  classes:
  - mathematical
  oracle: parent-proof-under-observed-numerical-precondition
  comparison_policies:
  - CMP-ZONE-ALLCLOSE-STRICT-001
  - CMP-ZONE-ALLCLOSE-MEDIUM-001
  - CMP-EXACT-VALUES-001
  observation_policies:
  - OBS-NUMERICAL-REGIME-001
  - OBS-COMPOSITE-CLOSURE-001
  meaning: The mathematical proof is re-executed while a reviewed numerical precondition (for example a target cond_2(G) range
    with a sigma_min(G) guard) is observed in the same pytest node; composite regimes such as R03 additionally validate every
    required child receipt.
  limits: The regime witness proves the precondition was real, not that every other regime behaves; each reviewed regime is
    its own obligation.
- id: VM-NUM-FD-ANCHOR-001
  classes:
  - numerical
  oracle: independent-finite-difference
  comparison_policies:
  - CMP-FD-AUTODIFF-FULL-001
  - CMP-SOURCE-CENTRAL-PAIR-001
  case_comparison_contract:
    guarantee: NUM-DERIV-FD-AUTODIFF-001
    fixture_set: DERIV-FIX-FD-AUTODIFF-001
    node_field: comparison_contract
    enforcement: gdd.engine.fd_comparison_contract
  observation_policies:
  - OBS-FD-ROUTE-001
  meaning: A reviewed finite-difference stencil of the forward quantity, with pinned perturbation, step, and smooth-regime
    witnesses, agrees with automatic differentiation on the same realized input; this anchor is independent of the differentiation
    machinery it checks.
  limits: Sentinels are a reviewed independent set, not a second copy of the whole obligation universe; stencil and step choices
    bound the attainable tightness.
- id: VM-NUM-SMOKE-001
  classes:
  - numerical
  oracle: none-production-execution-only
  comparison_policies: []
  observation_policies:
  - OBS-MIXED-ROUTE-SMOKE-001
  meaning: The production route executes in the declared mode and returns finite, shape- and dtype-correct output on a pinned
    fixture; the active mode and the fp32 compute zone are observed.
  limits: Explicitly never a correctness oracle; numerical agreement is claimed by the full-precision methods, not by smoke.
- id: VM-NUM-REVIEWED-REGRESSION-001
  classes:
  - numerical
  oracle: reviewed-deterministic-regression-target
  comparison_policies:
  - CMP-EXACT-VALUES-001
  - CMP-ZONE-ALLCLOSE-STRICT-001
  - CMP-ZONE-ALLCLOSE-MEDIUM-001
  - CMP-TURBORVB-DECIMAL-001
  - CMP-SOURCE-CENTRAL-PAIR-001
  observation_policies:
  - OBS-ROUTE-LIVENESS-001
  meaning: A deterministic production result remains within a reviewed fixed-input bound or preserves a reviewed regression
    relation. This method is used when the evidence is valuable for numerical stability but lacks the independent provenance
    or sample-level identity needed for a physical or mathematical oracle.
  limits: A historical literal, empirical quality threshold, or aggregate fixed-run cancellation is not promoted to physical
    correctness. The verdict applies only to the declared fixture, precision, and bound.
- id: VM-IMPL-BACKEND-PARITY-001
  classes:
  - implementation
  oracle: independent-backend-same-realized-input
  comparison_policies:
  - CMP-XLA-RUST-STRICT-001
  - CMP-XLA-RUST-MEDIUM-001
  - CMP-XLA-RUST-INDEPENDENT-FP32-001
  - CMP-EXACT-VALUES-001
  - CMP-SOURCE-CENTRAL-PAIR-001
  observation_policies:
  - OBS-ROUTE-LIVENESS-001
  meaning: Rust and XLA receive the same realized Hamiltonian, configuration, masks, and estimator inputs for a concrete cell
    and must agree within the consistency tolerances, for every upstream required cell with zero thinning and zero N/A.
  limits: Two backends can agree while sharing the same physical error; parity is never promoted to mathematical or physical
    proof.
- id: VM-ERROR-DISPOSITION-001
  classes:
  - mathematical
  - physical
  - numerical
  - implementation
  - operational
  oracle: reviewed-refusal-contract
  comparison_policies: []
  observation_policies:
  - OBS-EXPECTED-ERROR-001
  meaning: 'An input outside the supported universe (unknown Jastrow form, unknown non-local move) must be rejected explicitly:
    the expected exception type and message are observed, never a silent wrong number.'
  limits: Proves the boundary is policed, not that supported inputs are correct.
- id: VM-NA-DISPOSITION-001
  classes:
  - mathematical
  oracle: reviewed-non-applicability-rule
  comparison_policies: []
  observation_policies:
  - OBS-REVIEWED-N-A-001
  meaning: A structurally absent quantity (for example a parameterless PW/B-spline radial basis block) is claimed absent under
    a reviewed applicability rule, and the prohibited output is witnessed absent.
  limits: A reviewed N/A is a scoped exclusion, never a way to close a certificate over missing evidence.
- id: VM-OPS-SET-CLOSURE-001
  classes:
  - operational
  oracle: exact-receipt-universe-closure
  comparison_policies: []
  observation_policies: []
  meaning: Required collected cases close from passing pytest outcomes in each required precision and execution profile.
    Explicit derivative receipts additionally close the live required obligation and component sets; missing, extra,
    duplicate or tampered derivative receipts fail certification. Archival totals and digests are not pins.
  limits: Closure is only as strong as the obligations it closes over.
- id: VM-PHY-INVARIANT-001
  classes:
  - physical
  oracle: declared-physical-transformation-of-the-same-input
  comparison_policies:
  - CMP-EXACT-VALUES-001
  - CMP-RAW-BITS-001
  - CMP-ZONE-ALLCLOSE-STRICT-001
  - CMP-DTN-EN-CUSP-CONSTRAINT-001
  - CMP-SOURCE-CENTRAL-PAIR-001
  observation_policies:
  - OBS-ROUTE-LIVENESS-001
  meaning: The quantity computed after a declared physical transformation (lattice translation, Bloch shift, time reversal,
    atom/shell relabeling, basis representation change) equals the declared image of the untransformed quantity, with the
    production route witnessed live. Reviewed negative controls that deliberately break the precondition and must expose the
    violation belong to the same guarantee.
  limits: Invariance is proven only for the tested transformations and inputs; it does not certify other symmetries, other
    inputs, or numerical stability.
- id: VM-MATH-PW-PROJECTION-REFERENCE-001
  classes:
  - mathematical
  oracle: independent-cartesian-gaussian-fourier-integrals-and-rectangular-svd
  comparison_policies:
  - CMP-PW-PROJECTION-FP64-001
  observation_policies:
  - OBS-ROUTE-LIVENESS-001
  meaning: The fp64 converter's nonzero per-band, weighted-mean and maximum residuals equal an independently expressed Fourier
    and SVD reference on the declared committed QE input.
  limits: Both execution modes use the converter's unchanged fp64 IO arithmetic. This does not admit a cross-precision
    scientific oracle or alter any existing verdict method's accepted policies.
- id: VM-MATH-REFERENCE-001
  classes:
  - mathematical
  - numerical
  oracle: independent-reference-implementation-or-known-values
  comparison_policies:
  - CMP-EXACT-VALUES-001
  - CMP-ZONE-ALLCLOSE-STRICT-001
  - CMP-ZONE-ALLCLOSE-MEDIUM-001
  - CMP-SOURCE-CENTRAL-PAIR-001
  observation_policies:
  - OBS-ROUTE-LIVENESS-001
  meaning: The produced value agrees with an independently implemented evaluator, an exactly known function, or an independent
    quadrature of the defining expression, on reviewed inputs. A mathematical guarantee uses it to prove the value itself; a
    numerical guarantee uses it to prove that the value stays correct in a reviewed numerical regime (precision range, far tail
    or rounding bias) against an independent closed-form or lattice-sum reference.
  limits: The reference shares the mathematical definition, not the physics, and coverage is limited to the reviewed reference
    set.
- id: VM-IMPL-GFMC-SAME-INPUT-001
  classes:
  - implementation
  oracle: full-recompute-leaves-at-every-actual-gfmc-n-input
  comparison_policies:
  - CMP-EXACT-VALUES-001
  - CMP-ZONE-ALLCLOSE-STRICT-001
  - CMP-ZONE-ALLCLOSE-MEDIUM-001
  observation_policies:
  - OBS-ROUTE-LIVENESS-001
  meaning: Every observed load-balanced GFMC_n hop and measurement is compared at the same input, preserving its reviewed
    within-mode strict/full and medium/mixed tolerances. CDF selection, key and population handoff are exact; leaves and weighted
    estimators are separately required. The observer must not alter real driver outputs.
  limits: Replacement for the specified GFMC_n trajectory test only. This does not loosen other route-parity
    methods, claim independent derivative formulas, statistical convergence or bit-identical independently evolving trajectories.
- id: VM-IMPL-ROUTE-PARITY-001
  classes:
  - implementation
  oracle: independent-route-or-debug-twin-same-backend
  comparison_policies:
  - CMP-EXACT-VALUES-001
  - CMP-RAW-BITS-001
  - CMP-ZONE-ALLCLOSE-STRICT-001
  - CMP-GFMC-INCREMENTAL-TWIN-001
  - CMP-SOURCE-CENTRAL-PAIR-001
  observation_policies:
  - OBS-ROUTE-LIVENESS-001
  meaning: The production route equals its debug twin or an alternate layout/route of the same backend on identical input
    (public vs debug evaluators, ragged/bucketed folds vs direct sums, one-shot builders vs staged ones).
  limits: Twins share the backend and the model; route parity is never promoted to mathematical or physical proof.
- id: VM-PHY-REFERENCE-001
  classes:
  - physical
  oracle: external-implementation-or-reviewed-physical-values
  comparison_policies:
  - CMP-EXACT-VALUES-001
  - CMP-ZONE-ALLCLOSE-STRICT-001
  - CMP-ZONE-ALLCLOSE-MEDIUM-001
  - CMP-SOURCE-CENTRAL-PAIR-001
  observation_policies:
  - OBS-ROUTE-LIVENESS-001
  meaning: A physical quantity produced by the production route agrees with an external independent implementation (for example
    pymatgen Ewald sums), a literature value (for example a Madelung constant), or reviewed pinned physical values, on reviewed
    inputs.
  limits: Agreement holds only for the reviewed inputs and the external oracle's own accuracy; it does not certify derivatives
    or other observables.
- id: VM-IMPL-TREXIO-STORAGE-001
  classes:
  - implementation
  oracle: raw-trexio-records-and-independent-storage-conversion
  comparison_policies:
  - CMP-EXACT-VALUES-001
  - CMP-TREXIO-STORAGE-FP64-001
  observation_policies:
  - OBS-ROUTE-LIVENESS-001
  meaning: Nuclear/electron, Gaussian basis, ECP and periodic metadata in the loaded objects preserve the independently read
    TREXIO records. Direct copies and integer mappings match exactly. Gaussian contraction normalization is checked against
    the raw records with the existing central Python fp64 pair, on the declared conversion site only.
  limits: Input storage is fp64 in both modes. This is not a full-versus-mixed calculation comparison, an AO evaluation tolerance,
    or a new physical reference. It cannot substitute for existing spin/MO fidelity, independent energy or derivative tests.
- id: VM-NUM-FD-SOURCE-ZONE-FULL-001
  classes:
  - numerical
  oracle: independent-central-finite-difference
  comparison_policies:
  - CMP-ZONE-ALLCLOSE-MEDIUM-001
  observation_policies:
  - OBS-ROUTE-LIVENESS-001
  allowed-precision-modes: [full]
  allowed-comparison-sites:
  - tests/test_jqmc_kernel/test_wave_function.py::TestPeriodicWavefunction.test_evaluate_ln_wavefunction_periodic_log_derivative#comparison-1
  - tests/test_jqmc_kernel/test_wave_function.py::TestPeriodicWavefunction.test_evaluate_ln_wavefunction_periodic_log_derivative#comparison-2
  meaning: The existing up/down electron-coordinate autodiff gradients of ln absolute psi agree with independent central
    finite differences at step 1e-4 Bohr, using the unchanged get_tolerance_min medium budget from ao_eval, jastrow_eval
    and wf_kinetic on the five required periodic basis cases.
  limits: Only these two full-precision source comparisons are admitted. This does not admit other FD sites or mixed
    precision, replace the existing source budget with the generic FD budget, or prove the stencil solely from a receipt.
- id: VM-MATH-SOURCE-SPACING-IDENTITY-001
  classes: [mathematical]
  oracle: reviewed-sentinel-dataflow-identity
  comparison_policies: [CMP-SOURCE-SCALED-SPACING-001]
  observation_policies: [OBS-ROUTE-LIVENESS-001]
  allowed-precision-modes: [full, mixed]
  allowed-comparison-sites:
  - tests/test_rs_kernel/test_mpc_observable.py::test_mpc_correction_production_route_is_blocking#comparison-2
  meaning: Every saved MPC value preserves the injected step-coded native return within the original central multiplier
    times NumPy spacing at the declared case-specific input scale. Both the comparator arguments and statement-entry
    inputs of the spacing formula must agree with the declaration.
  limits: Only the existing sentinel dataflow comparison is admitted. This is neither an independent physical energy
    oracle nor a new general ULP tolerance. The multiplier and zero relative tolerance remain central setting symbols.
- id: VM-MATH-SOURCE-ARRAY-IDENTITY-001
  classes:
  - mathematical
  oracle: reviewed-same-input-state-identity
  comparison_policies:
  - CMP-SOURCE-ARRAY-EQUALITY-001
  observation_policies:
  - OBS-ROUTE-LIVENESS-001
  allowed-precision-modes: [full, mixed]
  allowed-comparison-sites:
  - tests/test_rs_kernel/test_mpc_observable.py::_assert_state_tree_equal#exact-comparison-1
  meaning: Each declared state-array leaf is compared exactly between MPC-on and MPC-off runs at the same input. All
    declared paths and shapes must be observed within each individual case. Empty leaves prove structure only.
  limits: Retains the existing array-equality semantics and suite NaN rejection without adding dtype identity or raw-bit
    equality. This is on/off state preservation, not an independent physical energy reference.
- id: VM-MATH-SOURCE-BUDGET-IDENTITY-001
  classes:
  - mathematical
  oracle: reviewed-identity-with-unchanged-source-budget
  comparison_policies:
  - CMP-XLA-RUST-STRICT-001
  observation_policies:
  - OBS-ROUTE-LIVENESS-001
  allowed-comparison-sites:
  - tests/test_rs_kernel/test_jastrow_dtn.py::TestJ1J2TriclinicParity.test_j1_j2_triclinic_parity#comparison-5
  - tests/test_rs_kernel/test_jastrow_dtn.py::TestJ1J2TriclinicParity.test_j1_j2_triclinic_parity#comparison-6
  meaning: The J2 diagonal contribution is excluded, so including or omitting explicit zero diagonal terms gives the same
    value within each backend. The existing backend-consistency budget is reused without claiming a cross-backend oracle.
  limits: Only the two reviewed triclinic J2 diagonal comparisons are admitted. No policy number, resolver, mode or operand
    changes, and no permission for undeclared sites.
- id: VM-IMPL-REVIEWED-CONTRACT-001
  classes:
  - implementation
  oracle: reviewed-hand-written-expectation
  comparison_policies:
  - CMP-EXACT-VALUES-001
  - CMP-RAW-BITS-001
  - CMP-SOURCE-CENTRAL-PAIR-001
  observation_policies:
  - OBS-ROUTE-LIVENESS-001
  meaning: Implementation behavior with no independent oracle and no second route (parsers, serialization formats, dtype and
    layout contracts, defaults wired to settings) matches a reviewed hand-written expectation.
  limits: The expectation is authored by the same project; this is the weakest verdict method and never substitutes for parity
    or an oracle.
- id: VM-PHY-CONVERGENCE-001
  classes:
  - physical
  oracle: refinement-sequence-of-the-same-physical-quantity
  comparison_policies:
  - CMP-ZONE-ALLCLOSE-STRICT-001
  - CMP-ZONE-ALLCLOSE-MEDIUM-001
  observation_policies:
  - OBS-ROUTE-LIVENESS-001
  meaning: 'A physical quantity converges under refinement of a declared numerical control (cutoff, grid, mesh) and is stable
    across equivalent discretizations, witnessed on a reviewed refinement sequence (convergence of a physical
    quantity is a physical guarantee).'
  limits: Convergence is witnessed only on the reviewed sequence and control range; it does not bound the extrapolation error
    outside it.
check_contract:
  notes: 'Every executable guarantee check names its policy and both operand roles; the binding shapes are defined once by
    the engine types named in enforcement_map. Every required precision mode needs exactly one explicit disposition: a policy
    for full never implicitly applies to mixed, and a policy for mixed never weakens full.'
  field: executable_checks
  cardinality: one-or-more
  witness-label-only: forbidden
  direct-pytest-comparison-as-contract: forbidden
  implicit-comparison-policy: forbidden
precision_dispositions:
  notes: Each required precision mode selects exactly one disposition. A compare or exact disposition names a comparison policy;
    a non-numerical check names an observation policy and observations from the vocabulary below; a reviewed n-a disposition
    names its applicability rule. None of the observation dispositions is a numerical correctness oracle.
  kinds:
  - compare
  - exact
  - non-numerical-check
  - n-a
  unspecified: forbidden
  allowed_observations:
  - finite
  - expected-shape
  - expected-dtype
  - route-executed
  - expected-output-leaves-accounted
  - nonzero
  - expected-error-observed
  - exception-type-matched
  - message-matched
  - applicability-rule-matched
  - prohibited-output-absent
  - propagation-sprime-precondition-observed
  - oracle-route-executed
  - required-components-complete
  - component-receipts-valid
  - numerical-precondition-observed
  - perturbation-is-nonzero
  - plus-and-minus-points-are-distinct
  - autodiff-route-is-live
  - finite-difference-result-is-finite
  - stencil-declared
comparator_semantics:
  source-array-equality:
    formula: actual == reference
    shape: exact
    dtype: record-both
    signed-zero: equal
    nan: forbidden
    infinity: same-sign-and-position
    complex: component-values-equal
    reduction: every-element
    empty: only-explicit-structural-leaves
  decimal-absolute:
    formula: abs(actual-reference) < 1.5 * 10**(-decimal)
    shape: exact
    dtype: record-both
    signed-zero: equal
    nan: forbidden
    infinity: same-sign-and-position-only
    complex: absolute-complex-difference
    reduction: elementwise-all-nonempty
    source: declared-central-decimal-symbol
    inline-digit-count: forbidden
  raw-bits:
    tolerance: forbidden
    shape: exact
    dtype: exact
    signed-zero: distinct
    nan: payload-and-bits-must-match
    complex: compare-component-bits
    reduction: every-element
  exact-values:
    tolerance:
      source-kind: named-symbol-pair
      atol-symbol: jqmc._setting.ATOL_BIT_EXACT
      rtol-symbol: jqmc._setting.RTOL_BIT_EXACT
    formula: abs(actual-reference) <= atol + rtol*abs(reference)
    shape: exact
    dtype: exact
    signed-zero: equal
    nan: forbidden
    infinity: same-sign-and-position-only
    complex: absolute-complex-difference
    reduction: elementwise-all
    reference-operand: reference
  allclose:
    formula: abs(actual-reference) <= atol + rtol*abs(reference)
    shape: exact
    dtype: record-both
    signed-zero: equal
    nan: forbidden
    infinity: same-sign-and-position-only
    complex: absolute-complex-difference
    reduction: elementwise-all
    reference-operand: reference
    inline-atol-or-rtol-literal: forbidden
tolerance_source_contract:
  allowed_source_kinds:
  - named-symbol-pair
  - registered-resolver
  - named-decimal-symbol
  named_decimal_symbol:
    required_fields: [symbol]
    allowed-module: jqmc._setting
  named_symbol_pair:
    required_fields:
    - atol-symbol
    - rtol-symbol
    allowed-module: jqmc._setting
  registered_resolver:
    required_fields:
    - resolver
    - arguments
    allowed-modules:
    - jqmc._precision
    - jqmc._setting
  source-reference-without-resolver-arguments: forbidden
  tolerance-change-classification: guarantee-contract-change
  tolerance-loosening: requires-weakening-review
