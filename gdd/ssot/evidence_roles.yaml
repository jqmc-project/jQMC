schema_version: 1
document:
  id: GDD-EVIDENCE-ROLES-001
  title: Finite intra-node evidence roles
  version: 1
  lifecycle: pre-cutover
  purpose: Classify every assertion in finite reviewed nodes without changing their ownership, source comparisons or budgets.
enforcement_map:
  nodes: not-yet-enforced
nodes:
  ? tests/test_jqmc_kernel/test_wave_function.py::TestPeriodicWavefunction::test_evaluate_ln_wavefunction_periodic_log_derivative
  : guarantee: NUM-WF-FD-ANCHORS-001
    registration_method: VM-NUM-FD-ANCHOR-001
    observations:
      ? tests/test_jqmc_kernel/test_wave_function.py::TestPeriodicWavefunction.test_evaluate_ln_wavefunction_periodic_log_derivative#assert-1
      : kind: shape-or-dtype
        expression: grad_ln_up_np.shape == (n_up, 3)
      ? tests/test_jqmc_kernel/test_wave_function.py::TestPeriodicWavefunction.test_evaluate_ln_wavefunction_periodic_log_derivative#assert-2
      : kind: shape-or-dtype
        expression: grad_ln_dn_np.shape == (n_dn, 3)
      ? tests/test_jqmc_kernel/test_wave_function.py::TestPeriodicWavefunction.test_evaluate_ln_wavefunction_periodic_log_derivative#assert-3
      : kind: finiteness
        expression: np.all(np.isfinite(grad_ln_up_np))
        actual: np.isfinite(grad_ln_up_np)
      ? tests/test_jqmc_kernel/test_wave_function.py::TestPeriodicWavefunction.test_evaluate_ln_wavefunction_periodic_log_derivative#assert-4
      : kind: finiteness
        expression: np.all(np.isfinite(grad_ln_dn_np))
        actual: np.isfinite(grad_ln_dn_np)
      ? tests/test_jqmc_kernel/test_wave_function.py::TestPeriodicWavefunction.test_evaluate_ln_wavefunction_periodic_log_derivative#call-39
      : kind: tolerance-comparison
        expression: np.testing.assert_allclose(grad_ln_up_np, fd_up, atol=atol, rtol=rtol)
        actual: grad_ln_up_np
        reference: fd_up
        tolerance_arguments:
          atol: atol
          rtol: rtol
      ? tests/test_jqmc_kernel/test_wave_function.py::TestPeriodicWavefunction.test_evaluate_ln_wavefunction_periodic_log_derivative#call-40
      : kind: tolerance-comparison
        expression: np.testing.assert_allclose(grad_ln_dn_np, fd_dn, atol=atol, rtol=rtol)
        actual: grad_ln_dn_np
        reference: fd_dn
        tolerance_arguments:
          atol: atol
          rtol: rtol
    roles:
      log-gradient-central-fd:
        method: VM-NUM-FD-SOURCE-ZONE-FULL-001
        meaning: Up/down autodiff gradients agree with the existing independent central FD at step 1e-4 Bohr on each of five periodic basis kinds,
          under the unchanged three-zone medium budget in full precision only.
        observations:
        - tests/test_jqmc_kernel/test_wave_function.py::TestPeriodicWavefunction.test_evaluate_ln_wavefunction_periodic_log_derivative#call-39
        - tests/test_jqmc_kernel/test_wave_function.py::TestPeriodicWavefunction.test_evaluate_ln_wavefunction_periodic_log_derivative#call-40
        checks:
        - fd-up
        - fd-down
        source_only: {}
      gradient-shape-and-finiteness:
        method: VM-IMPL-REVIEWED-CONTRACT-001
        meaning: Both spin blocks have the required coordinate shape and finite values; these assertions alone are not FD agreement.
        observations:
        - tests/test_jqmc_kernel/test_wave_function.py::TestPeriodicWavefunction.test_evaluate_ln_wavefunction_periodic_log_derivative#assert-1
        - tests/test_jqmc_kernel/test_wave_function.py::TestPeriodicWavefunction.test_evaluate_ln_wavefunction_periodic_log_derivative#assert-2
        - tests/test_jqmc_kernel/test_wave_function.py::TestPeriodicWavefunction.test_evaluate_ln_wavefunction_periodic_log_derivative#assert-3
        - tests/test_jqmc_kernel/test_wave_function.py::TestPeriodicWavefunction.test_evaluate_ln_wavefunction_periodic_log_derivative#assert-4
        checks: []
        source_only: {}
