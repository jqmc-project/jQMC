id: IMPL-RS-ECP-001
kind: implementation
name: Rust/XLA parity of ECP kernels
plain_language: The Rust ECP local and non-local kernels reproduce the XLA evaluators, including high angular-momentum channels
  (l >= 5), rotated quadrature meshes (molecular, periodic, complex twist), and the positive control that rotated and identity
  meshes differ. The production molecular ECP chunk also covers paired and unpaired electrons together
  (water cation, four up and three down), with active determinant/J3 w-dot routes and a full-determinant
  XLA non-local reference.
verdict_methods:
- VM-IMPL-BACKEND-PARITY-001
- VM-IMPL-REVIEWED-CONTRACT-001
required_evidence:
- verdict_method: VM-IMPL-BACKEND-PARITY-001
  nodes:
