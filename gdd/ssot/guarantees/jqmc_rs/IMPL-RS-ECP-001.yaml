        site: tests/test_rs_kernel/test_ecp_local.py::test_ecp_local_parts_all_pairs#comparison-1
        comparator: numpy.isclose
        actual:
          role: existing-test-actual
          expression: vr
        reference:
          role: existing-test-reference
          expression: vj
        precision:
          full:
            policy: CMP-XLA-RUST-STRICT-001
            zones:
            - coulomb
          mixed:
            policy: CMP-XLA-RUST-STRICT-001
            zones:
            - coulomb
