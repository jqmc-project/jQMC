id: IMPL-RS-MPC-001
kind: implementation
name: Rust/XLA parity and surface contracts of the MPC observable
plain_language: The Rust MPC correction reproduces the XLA evaluator on the reviewed pairwise fixture axes and table boundaries,
  and the Rust tricubic V_LR interpolator reproduces the XLA one point by point at reduction-order tolerance; the Python
  production surface exposes energy only and the Rust surface value only; the fixture ledger provably covers the reviewed
  axes and keeps the empty spin channel; malformed ABI shapes are rejected and the production route is blocking.
verdict_methods:
- VM-IMPL-BACKEND-PARITY-001
- VM-IMPL-REVIEWED-CONTRACT-001
- VM-ERROR-DISPOSITION-001
required_evidence:
- verdict_method: VM-IMPL-BACKEND-PARITY-001
  nodes:
  - pytest_node: tests/test_rs_kernel/test_mpc_observable.py::test_mpc_v_lr_interpolation_xla_rust_parity
    executable_checks:
      d8-n-342:
        site: tests/test_rs_kernel/test_mpc_observable.py::test_mpc_v_lr_interpolation_xla_rust_parity#comparison-1
        comparator: numpy.testing.assert_allclose
        actual:
          role: source-computed-value
          expression: got
        reference:
          role: source-reference-value
          expression: ref
        precision:
          full:
            policy: CMP-SOURCE-CENTRAL-PAIR-001
            pair: TOL-REDUCTION-ORDER-001
          mixed:
            policy: CMP-SOURCE-CENTRAL-PAIR-001
            pair: TOL-REDUCTION-ORDER-001
  - pytest_node: tests/test_rs_kernel/test_mpc_observable.py::test_mpc_correction_xla_rust_pairwise_fixtures
