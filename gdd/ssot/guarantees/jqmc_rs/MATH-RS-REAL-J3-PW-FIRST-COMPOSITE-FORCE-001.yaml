id: MATH-RS-REAL-J3-PW-FIRST-COMPOSITE-FORCE-001
kind: mathematical
name: Rust real-Gamma HF and Pulay forces of a PW-first composite J3 orbital equal the derivatives of e_L and ln|Psi|
plain_language: 'The native real (Gamma-point) periodic Hellmann-Feynman derivatives (d e_L / dR, d e_L / dr_up,
  d e_L / dr_dn) and Pulay nuclear derivative (d ln|Psi| / dR) of a wave function whose J3 orbital is a pGTO(+)plane-wave
  composite are the derivatives of the continuum local energy and of ln|Psi| whichever child comes first in the
  J3 AO order: the real J3 kinetic-force and J3 value-force kernels must take the pGTO rows of the composite cotangent
  at the offset of the pGTO child, also when the plane-wave child precedes it. On the committed pbc_composite_j123
  cell (QE Li Gamma ccECP, real pGTO(+)PW single determinant, exp J1/J2 and an identity-MO-wrapped composite J3
  with a seeded nonzero j_matrix) in its built (pGTO, PW) J3 order and in the (PW, pGTO) order with the j_matrix
  rows/columns and J1-like column permuted to match, at one seeded electron configuration, the free kernels vmc_grad_e_L_pbc
  and vmc_grad_ln_psi_pbc, the MCMC driver entries grad_e_L_pbc_batch and grad_ln_psi_pbc_batch and the GFMC/LRDMC
  T-move measurement force _gfmc_grad_e_L_ecp_pbc equal reverse-mode AD of the XLA local energy (identity quadrature
  rotation) and of ln|Psi| with every nucleus position leaf displaced together or the electron coordinates displaced,
  in the same precision. Every reference must be finite and distinguishable from zero. This mathematical guarantee
  owns full AD only at strict; paired mixed numerical receipts belong to NUM-RS-REAL-J3-CHILD-ORDER-DERIVATIVE-MIXED-FIDELITY-001.'
verdict_methods: [VM-MATH-AD-ORACLE-001]
required_evidence:
- verdict_method: VM-MATH-AD-ORACLE-001
  nodes:
  - pytest_node: tests/test_rs_kernel/test_vmc_real_j3_pw_first_force_stress.py::test_real_j3_composite_forces_match_ad_in_both_child_orders
    required_precision_modes: [full]
    required_parameter_cases:
    - {order: gto_first}
    - {order: pw_first}
    executable_checks:
      force-vs-ad:
        site: tests/test_rs_kernel/test_vmc_real_j3_pw_first_force_stress.py::test_real_j3_composite_forces_match_ad_in_both_child_orders#comparison-2
        comparator: numpy.testing.assert_allclose
        actual: {role: rust-real-vmc-and-gfmc-hf-and-pulay-force, expression: value}
        reference: {role: same-precision-autodiff-of-local-energy-and-ln-psi, expression: reference}
        precision:
          full:
            policy: CMP-ZONE-ALLCLOSE-STRICT-001
            zones: [ao_eval, ao_grad_lap, mo_eval, mo_grad, mo_lap, det_eval, det_grad_lap, jastrow_eval, jastrow_grad_lap,
              wf_kinetic, ewald, coulomb]
