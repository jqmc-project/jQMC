id: IMPL-RS-TWIST-MCMC-CHUNK-ENERGY-RECOMPUTE-001
kind: implementation
name: Production complex-twist MCMC chunk energies equal an XLA from-scratch local energy at the returned walkers
plain_language: >-
  The committed QE Li k=(1/4,1/4,1/4) ccECP input realized as a complex B-spline determinant with exp
  J1/J2 and an active DTN runs production energy-only MCMC (two walkers, seed 34356, fixed quadrature
  mesh) through the native complex energy chunk on its native random stream, in three production calls of
  six steps. After each call the last stored complex e_L of every walker equals compute_local_energy of
  the same Hamiltonian evaluated from scratch by XLA at the returned walker, Re and Im, within the MCMC
  Rust/XLA driver policy; the walkers move between calls. The complex chunk refuses injected inputs, so
  this replaces a walk twin by a from-scratch recompute on the production walk. The pGTO+PW composite with
  an MO-wrapped J3 is not claimed: once walkers leave the home cell its native and XLA e_L differ.
  Full and mixed are judged separately.
verdict_methods: [VM-IMPL-BACKEND-PARITY-001]
required_evidence:
- verdict_method: VM-IMPL-BACKEND-PARITY-001
  nodes:
  - pytest_node: tests/test_rs_kernel/test_richer_production_drivers.py::test_richer_twist_mcmc_chunk_energies_match_xla_recompute
    required_precision_modes: [full, mixed]
    required_parameter_cases:
    - {pattern: bspline_twist_jdtn}
