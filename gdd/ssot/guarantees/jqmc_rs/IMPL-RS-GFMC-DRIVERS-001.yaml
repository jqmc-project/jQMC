plain_language: The Rust GFMC projection, chain modes, forces, stresses, observables, and complex dlt-move routes reproduce
  the XLA drivers on identical input. Injected NaN states follow the same poisoned-state propagation as XLA instead of being
  silently repaired; this parity statement does not claim fail-fast handling.
