    - {kind: complex}
  - pytest_node: tests/test_jqmc_kernel/test_optimizer_host_rust_mpi.py::test_two_rank_lm_pencil_core_rust_matches_sharded_xla
    required_precision_modes: [full, mixed]
    required_parameter_cases:
    - {fields: real}
    - {fields: complex}
