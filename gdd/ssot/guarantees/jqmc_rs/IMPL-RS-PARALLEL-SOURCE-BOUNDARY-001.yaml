id: IMPL-RS-PARALLEL-SOURCE-BOUNDARY-001
kind: implementation
name: Rust walker parallelism stays at reviewed source boundaries
plain_language: >-
  All jqmc/rs/src/**/*.rs files are scanned as source tokens. Named Rayon entry
  sites and imports remain at the reviewed ordered walker map/collect boundary;
  par-prefixed identifiers fail closed outside that boundary, and global-pool
  setup retains its reviewed configuration-only body instead of dispatching work;
  the two serial native VMC drivers retain their direct GIL-release calls.
  Added parallel calls, source aliases, extra GIL releases, missing expected
  sites and changed ordered collection fail with specific diagnostics.
  Comments, literals and directly cfg(test)-gated items are not production evidence.
  The fixture is repository source plus explicit synthetic Rust source trees,
  not a wavefunction, TREXIO file or electron configuration. No tolerance applies.
  This static inventory does not expand external macros, inspect renamed Cargo
  dependencies, prove per-walker purity or replace numerical thread-count parity.
verdict_methods: [VM-IMPL-REVIEWED-CONTRACT-001]
required_evidence:
- verdict_method: VM-IMPL-REVIEWED-CONTRACT-001
  nodes:
  - pytest_node: tests/test_jqmc_kernel/test_rust_parallel_sites.py::test_rust_production_parallel_source_inventory
  - pytest_node: tests/test_jqmc_kernel/test_rust_parallel_sites.py::test_rust_parallel_inventory_rejects_new_sites_and_aliases
    required_precision_modes: [full, mixed]
    required_parameter_cases:
    - {code: 'fn bad() { (0..n).into_par_iter().map(f).sum::<f64>(); }'}
    - {code: 'fn bad() { values.par_iter().sum::<f64>(); }'}
    - {code: 'fn bad() { values.par_iter_mut().for_each(f); }'}
    - {code: 'fn bad() { values.par_bridge().for_each(f); }'}
    - {code: 'fn bad() { values.par_chunks(2).for_each(f); }'}
    - {code: 'fn bad() { rayon::join(a, b); }'}
    - {code: 'fn bad() { rayon::scope(|s| s.spawn(f)); }'}
    - {code: 'fn bad() { rayon::scope_fifo(|s| s.spawn_fifo(f)); }'}
    - {code: 'fn bad() { rayon::spawn(f); }'}
    - {code: 'use rayon as work; fn bad() { work::join(a, b); }'}
    - {code: 'use rayon::{join as fork, scope as region}; fn bad() { fork(a, b); }'}
    - {code: 'use rayon::{self as work}; fn bad() { work::join(a, b); }'}
    - {code: 'pub use rayon::join as fork;'}
    - {code: 'pub use ::rayon::{self as work, join as fork};'}
    - {code: 'extern crate rayon as work; fn bad() { work::join(a, b); }'}
    - {code: 'use rayon::*; fn bad() { join(a, b); }'}
    - {code: 'fn bad() { let fork = rayon::join; fork(a, b); }'}
    - {code: 'fn bad() { IntoParallelIterator::into_par_iter(values); }'}
    - {code: 'fn bad() { <T as IntoParallelIterator>::into_par_iter(values); }'}
    - {code: 'fn bad() { values.r#par_iter().sum::<f64>(); }'}
    - {code: 'use r#rayon as work; fn bad() { work::join(a, b); }'}
    - {code: 'fn bad() { rayon_core::join(a, b); }'}
    - {code: 'macro_rules! bad { () => { rayon::join(a, b) }; }'}
    - {code: '#[cfg(not(test))] fn bad() { values.par_iter(); }'}
    - {code: '#[cfg(feature = "future")] fn bad() { values.par_iter(); }'}
    - {code: 'mod tests { fn still_production() { values.par_iter(); } }'}
    - {code: '#[cfg(test)] mod tests { fn unit() {} } fn bad() { values.par_iter(); }'}
  - pytest_node: tests/test_jqmc_kernel/test_rust_parallel_sites.py::test_rust_parallel_inventory_ignores_nonproduction_text
    required_precision_modes: [full, mixed]
    required_parameter_cases:
    - {code: "// rayon::join(a, b); values.par_iter();\nfn ordinary() {}"}
    - {code: '/* rayon::scope /* nested */ values.par_iter() */ fn ordinary() {}'}
    - {code: 'fn ordinary() { let text = "rayon::join(a, b) \" par_iter"; }'}
    - {code: 'fn ordinary() { let text = r###"rayon::join("a", b); par_iter"###; }'}
    - {code: 'fn ordinary() { let text = br##"rayon::scope par_bridge"##; }'}
    - {code: "fn ordinary<'a>(x: &'a str) { let a = '}'; let b = '\\''; let c = '\\u{7b}'; }"}
    - {code: '#[cfg(test)] mod tests { use rayon::prelude::*; fn unit() { values.par_iter(); } }'}
    - {code: '#[cfg(test)] #[allow(dead_code)] fn unit() { rayon::join(a, b); }'}
    - {code: 'impl Example { #[cfg(test)] fn unit(&self) { rayon::join(a, b); } }'}
  - pytest_node: tests/test_jqmc_kernel/test_rust_parallel_sites.py::test_rust_parallel_inventory_rejects_extra_gil_release
    required_precision_modes: [full, mixed]
    required_parameter_cases:
    - {filename: gfmc.rs}
    - {filename: walker_batch.rs}
    - {filename: native_driver.rs}
    - {filename: lib.rs}
  - pytest_node: tests/test_jqmc_kernel/test_rust_parallel_sites.py::test_rust_parallel_inventory_pins_ordered_walker_body
    required_precision_modes: [full, mixed]
    required_parameter_cases:
    - {replacement: 'py.allow_threads(|| (0..nw).into_par_iter().map(f).sum())'}
    - {replacement: 'py.allow_threads(|| { rayon::join(a, b); (0..nw).into_par_iter().map(f).collect() })'}
    - {replacement: 'py.allow_threads(|| (0..nw).into_par_iter().map(|w| f(w)).collect())'}
  - pytest_node: tests/test_jqmc_kernel/test_rust_parallel_sites.py::test_rust_parallel_inventory_rejects_second_site_in_allowed_file
  - pytest_node: tests/test_jqmc_kernel/test_rust_parallel_sites.py::test_rust_parallel_inventory_pins_serial_gil_release_body
  - pytest_node: tests/test_jqmc_kernel/test_rust_parallel_sites.py::test_rust_parallel_inventory_requires_expected_sites
  - pytest_node: tests/test_jqmc_kernel/test_rust_parallel_sites.py::test_rust_parallel_inventory_rejects_prelude_dispatch
    required_precision_modes: [full, mixed]
    required_parameter_cases:
    - {method: par_chars}
    - {method: par_bytes}
    - {method: par_lines}
    - {method: par_drain}
    - {method: par_extend}
    - {method: par_array_windows}
    - {method: par_chunk_by}
    - {method: par_future_api}
  - pytest_node: tests/test_jqmc_kernel/test_rust_parallel_sites.py::test_rust_parallel_inventory_rejects_local_pool_dispatch
    required_precision_modes: [full, mixed]
    required_parameter_cases:
    - {method: spawn}
    - {method: install}
    - {method: scope}
    - {method: scope_fifo}
    - {method: broadcast}
