id: MATH-RS-COMPLEX-J3-EXTRA-FIRST-COMPOSITE-FORCE-001
kind: mathematical
name: Rust complex-twist HF forces of a PW-first composite J3 orbital equal the derivatives of the local energy
plain_language: 'The native complex-twist Hellmann-Feynman derivatives (d Re e_L / dR, d Re e_L / dr_up, d Re e_L
  / dr_dn) of a wave function whose J3 orbital is a pGTO(+)plane-wave composite are the derivatives of the continuum
  local energy whichever child comes first in the J3 AO order: the J3 kinetic force kernels must scatter the pGTO
  rows (nuclear axis) and place the plane-wave Hessian / gradlap rows (electron axis) at the offsets of those children,
  also when the plane-wave child precedes the pGTO child. On the committed pgto_pw_twist_j123 cell (QE-projected
  Li ccECP at k = 0.25, complex pGTO(+)PW single determinant, exp J1/J2 and an identity-MO-wrapped composite J3
  with a seeded nonzero j_matrix) in its built (pGTO, PW) J3 order and in the (PW, pGTO) order with the j_matrix
  rows/columns and J1-like column permuted to match, at one seeded electron configuration, the free kernel vmc_grad_e_L_pbc_complex,
  the MCMC driver entry grad_e_L_pbc_complex_batch and the GFMC/LRDMC T-move measurement force _gfmc_grad_e_L_ecp_pbc_complex
  equal reverse-mode AD of the XLA Re local energy (identity quadrature rotation) with every nucleus position leaf
  displaced together or the electron coordinates displaced, in the same precision. Every reference must be finite
  and distinguishable from zero. This mathematical guarantee owns full AD only at strict; paired mixed numerical
  receipts belong to NUM-RS-COMPLEX-J3-CHILD-ORDER-SQUARE-MO-DERIVATIVE-MIXED-FIDELITY-001.'
verdict_methods: [VM-MATH-AD-ORACLE-001]
required_evidence:
- verdict_method: VM-MATH-AD-ORACLE-001
  nodes:
  - pytest_node: tests/test_rs_kernel/test_vmc_complex_j3_pw_first_force.py::test_complex_j3_composite_hf_forces_match_ad_in_both_child_orders
    required_precision_modes: [full]
    required_parameter_cases:
    - {order: gto_first}
    - {order: pw_first}
    executable_checks:
      force-vs-ad:
        site: tests/test_rs_kernel/test_vmc_complex_j3_pw_first_force.py::test_complex_j3_composite_hf_forces_match_ad_in_both_child_orders#comparison-2
        comparator: numpy.testing.assert_allclose
        actual: {role: rust-complex-vmc-and-gfmc-hf-force, expression: value}
        reference: {role: same-precision-autodiff-of-local-energy, expression: reference}
        precision:
          full:
            policy: CMP-ZONE-ALLCLOSE-STRICT-001
            zones: [ao_eval, ao_grad_lap, mo_eval, mo_grad, mo_lap, det_eval, det_grad_lap, jastrow_eval, jastrow_grad_lap,
              wf_kinetic, ewald, coulomb]
