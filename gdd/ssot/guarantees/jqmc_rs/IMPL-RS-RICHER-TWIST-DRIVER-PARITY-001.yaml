id: IMPL-RS-RICHER-TWIST-DRIVER-PARITY-001
kind: implementation
name: Complex-twist B-spline DTN and pGTO+PW J123 production GFMC values preserve same-input parity
plain_language: >-
  Committed QE Li k=(1/4,1/4,1/4) ccECP inputs are realized as a complex B-spline determinant with
  exp J1/J2 and an active DTN, or as a complex pGTO plus PW composite determinant with exp J1/J2
  and an identity-MO-wrapped active J3. One-walker forty-step fixed-mesh GFMC_n and GFMC_t with
  seed 34356 run the native complex projection chunk, carry the complex fast state and engage the
  basis-specific complex candidate and derivative caches and the DTN or J3 derivative cache with
  every named slow-route counter at zero; stored weights, energies, squared energies and the public
  energy are then compared under the existing within-mode backend policy, with final positions and
  keys exact. Values only: complex ECP force and stress are covered separately, and whether J3 built from the
  real part of a complex Bloch orbital is physically periodic is not claimed; this certifies Rust/XLA parity of
  the shared definition. Full and mixed are separate same-mode verdicts.
verdict_methods: [VM-IMPL-BACKEND-PARITY-001]
required_evidence:
- verdict_method: VM-IMPL-BACKEND-PARITY-001
  nodes:
  - pytest_node: tests/test_rs_kernel/test_richer_production_drivers.py::test_richer_twist_gfmc_values_match_xla
    required_precision_modes: [full, mixed]
    required_parameter_cases:
    - {pattern: bspline_twist_jdtn, driver: n}
    - {pattern: bspline_twist_jdtn, driver: t}
    - {pattern: pgto_pw_twist_j123, driver: n}
    - {pattern: pgto_pw_twist_j123, driver: t}
