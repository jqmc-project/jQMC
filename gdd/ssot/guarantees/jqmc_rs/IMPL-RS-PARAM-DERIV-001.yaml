id: IMPL-RS-PARAM-DERIV-001
kind: implementation
name: Rust/XLA parity of parameter derivatives outside the derivative universe
plain_language: The Rust parameter-gradient kernels (ln psi and e_L), ragged-basis derivatives, and the staged ungate families
  reproduce the XLA evaluators; the reviewed derivative-universe closure itself is owned by the derivative ledger.
