id: IMPL-RS-TWIST-GEMINAL-DRIVER-PARITY-001
kind: implementation
name: Native complex MCMC and GFMC routes equal XLA at k != Gamma for AGP, AGPn and SD geminals
plain_language: On the all-electron H4 periodic twist H4_pbc_ae_k025_cart.h5 with J1+J2 and seed 3446, the production
  GFMC_n (2 walkers) and GFMC_t (1 walker) native complex projection intervals, run for six branching steps,
  equal the XLA drivers for a dense complex AO AGP, a four-MO AGPn and an untied SD; PRNG keys are identical and final
  walkers agree at the random-mesh ULP pin before the stored complex e_L, e_L2 and w_L are compared within the periodic
  fast-interval Rust/XLA envelope. The production MCMC per-step native complex sweep (parameter derivatives on), fed
  the XLA proposal normals of the same keys, reproduces the XLA walk byte for byte for these geminals and the
  time-reversal SD; stored e_L and w_L, and for every case including AGPn each optimizer derivative source component,
  agree within the Rust/XLA consistency envelope. Each Rust run is witnessed to execute the native complex route and
  each XLA run no native method. The AGPn MCMC row also retains the complex occupation derivative in the
  optimizer sources, so the optimizer sources are not projected to real. The energy-only native complex
  MCMC chunk refuses injected inputs with an explicit ValueError, so it has no deterministic XLA twin.
verdict_methods:
- VM-IMPL-BACKEND-PARITY-001
- VM-ERROR-DISPOSITION-001
required_evidence:
