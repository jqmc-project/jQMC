id: MATH-RS-INACTIVE-J3-NATIVE-MCMC-TRANSITION-001
kind: mathematical
name: The native real Metropolis sweep and single move with an all-zero-j_matrix J3 equal the J3-free transition
plain_language: >-
  An all-zero j_matrix makes the three-body Jastrow factor identically zero, so every acceptance ratio, and
  therefore the whole transition, of the native real Metropolis bindings _mcmc_sweep and _single_move must be
  exactly the one of the same call with jastrow_three_body_data=None, also when the J3 orbital is an MO over a
  composite of a real pGTO and a complex plane-wave child. On the committed Li Gamma ccECP cell with a real constant
  plane-wave single determinant and an identity-MO-wrapped (pGTO s, plane-wave) composite J3 orbital, for a complex
  plane-wave child with a nonzero G vector, a complex constant (k = 0) child and a real constant child as the
  control, from one fixed electron configuration with fixed injected normals and threefry key, every returned field
  (positions, geminal and inverse, acceptance data, final key) agrees exactly with the J3-free call, whose
  transition moves an electron. Full and mixed are judged separately.
verdict_methods: [VM-MATH-REVIEWED-IDENTITY-001]
required_evidence:
- verdict_method: VM-MATH-REVIEWED-IDENTITY-001
  nodes:
  - pytest_node: tests/test_rs_kernel/test_inactive_j3_explicit_parse.py::test_native_mcmc_transition_inactive_complex_pw_j3_equals_j3_free
    required_precision_modes: [full, mixed]
    required_parameter_cases: [{child: complex_pw_G}, {child: complex_pw_0}, {child: real_pw}]
