id: MATH-RS-COMPLEX-J3-PW-FIRST-COMPOSITE-STRESS-001
kind: mathematical
name: Rust complex-twist HF stress of a PW-first composite J3 orbital equals the strain derivative of the local
  energy
plain_language: 'The native complex-twist Hellmann-Feynman stress (d Re e_L / d eps) of a wave function whose J3
  orbital is a pGTO(+)plane-wave composite is the strain derivative of the continuum local energy whichever child
  comes first in the J3 AO order: the complex J3 kinetic stress kernel must take the pGTO rows of the coefficient
  cotangent and the plane-wave rows of the Laplacian / gradient cotangent at the offsets of those children, also
  when the plane-wave child precedes the pGTO child. On the committed pgto_pw_twist_j123 cell (QE-projected Li ccECP
  at k = 0.25, complex pGTO(+)PW single determinant, exp J1/J2 and an identity-MO-wrapped composite J3 with a seeded
  nonzero j_matrix) in its built (pGTO, PW) J3 order and in the (PW, pGTO) order with the j_matrix rows/columns
  and J1-like column permuted to match, at one seeded electron configuration and the MCMC driver''s default non-local
  mesh with the identity rotation, the free kernel vmc_grad_e_L_eps_pbc_complex, the MCMC driver entry grad_e_L_eps_pbc_complex_batch
  and the GFMC/LRDMC T-move stress _gfmc_stress_ecp_pbc_complex equal reverse-mode strain AD of the XLA Re local
  energy with the cell, nuclei, basis and electrons strained together, in the same precision. The reference must
  be finite and distinguishable from zero. This mathematical guarantee owns full AD only at strict; paired mixed
  numerical receipts belong to NUM-RS-COMPLEX-J3-CHILD-ORDER-SQUARE-MO-DERIVATIVE-MIXED-FIDELITY-001.'
verdict_methods: [VM-MATH-AD-ORACLE-001]
required_evidence:
- verdict_method: VM-MATH-AD-ORACLE-001
  nodes:
  - pytest_node: tests/test_rs_kernel/test_vmc_complex_j3_pw_first_stress.py::test_complex_j3_composite_hf_stress_matches_strain_ad_in_both_child_orders
    required_precision_modes: [full]
    required_parameter_cases:
    - {order: gto_first}
    - {order: pw_first}
    executable_checks:
      hf-stress-vs-strain-ad:
        site: tests/test_rs_kernel/test_vmc_complex_j3_pw_first_stress.py::test_complex_j3_composite_hf_stress_matches_strain_ad_in_both_child_orders#comparison-2
        comparator: numpy.testing.assert_allclose
        actual: {role: rust-complex-vmc-and-gfmc-hf-stress, expression: value}
        reference: {role: same-precision-strain-autodiff-of-re-local-energy, expression: reference}
        precision:
          full:
            policy: CMP-ZONE-ALLCLOSE-STRICT-001
            zones: [ao_eval, ao_grad_lap, mo_eval, mo_grad, mo_lap, det_eval, det_grad_lap, jastrow_eval, jastrow_grad_lap,
              wf_kinetic, ewald, coulomb]
