id: MATH-RS-COMPLEX-PW-FIRST-COMPOSITE-STRESS-001
kind: mathematical
name: Rust complex-twist GFMC stress of a PW-first composite equals the strain derivative of the energy
plain_language: 'The native complex-twist GFMC/LRDMC stress (_gfmc_stress_ecp_pbc_complex) of a complex pGTO(+)plane-wave
  composite basis is the strain derivative of the continuum measurement local energy whichever child comes first
  in the AO order: the kinetic-stress kernel must take the GTO rows of the AO cotangent at the offset of the GTO
  child, also when the plane-wave child precedes it. On the committed pgto_pw_twist_jnone cell (QE-projected Li
  ccECP at k = 0.25, single determinant, no Jastrow) in its built (pGTO, PW) order and in the (PW, pGTO) order with
  the MO coefficient columns permuted to match, at one seeded electron configuration, alat 2.0, tmove and the fixed
  identity twelve-point mesh, all nine stress entries equal reverse-mode strain AD of the XLA measurement energy
  with the cell, nuclei and electrons strained together, in the same precision. Every reference entry must be finite
  and distinguishable from zero. This mathematical guarantee owns full AD only at strict; paired mixed numerical
  receipts belong to NUM-RS-COMPLEX-PW-BSPLINE-FIRST-HF-STRESS-MIXED-FIDELITY-001.'
verdict_methods: [VM-MATH-AD-ORACLE-001]
required_evidence:
- verdict_method: VM-MATH-AD-ORACLE-001
  nodes:
  - pytest_node: tests/test_rs_kernel/test_gfmc_complex_pw_first_stress.py::test_gfmc_complex_composite_stress_matches_strain_ad_in_both_child_orders
    required_precision_modes: [full]
    required_parameter_cases:
    - {order: gto_first}
    - {order: pw_first}
    executable_checks:
      stress-vs-strain-ad:
        site: tests/test_rs_kernel/test_gfmc_complex_pw_first_stress.py::test_gfmc_complex_composite_stress_matches_strain_ad_in_both_child_orders#comparison-2
        comparator: numpy.testing.assert_allclose
        actual: {role: rust-complex-gfmc-stress, expression: actual}
        reference: {role: same-precision-strain-autodiff-of-measurement-energy, expression: reference}
        precision:
          full:
            policy: CMP-ZONE-ALLCLOSE-STRICT-001
            zones: [ao_eval, ao_grad_lap, det_eval, wf_kinetic, ewald, coulomb]
