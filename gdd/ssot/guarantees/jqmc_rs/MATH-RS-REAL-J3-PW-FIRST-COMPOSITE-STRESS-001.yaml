id: MATH-RS-REAL-J3-PW-FIRST-COMPOSITE-STRESS-001
kind: mathematical
name: Rust real-Gamma VMC Pulay and HF stress of a PW-first composite J3 orbital equal the strain derivatives of
  ln|Psi| and e_L
plain_language: 'The native real (Gamma-point) periodic VMC Pulay stress (vmc_grad_ln_psi_eps_pbc) and Hellmann-Feynman
  stress (vmc_grad_e_L_eps_pbc) of a wave function whose J3 orbital is a pGTO(+)plane-wave composite are the strain
  derivatives of ln|Psi| and of the continuum local energy whichever child comes first in the J3 AO order: the real
  J3 kinetic-stress and J3 value-strain kernels must stack and offset the pGTO and plane-wave rows in the order
  of the children, also when the plane-wave child precedes the pGTO child. On the committed pbc_composite_j123 cell
  (QE Li Gamma ccECP, real pGTO(+)PW single determinant, exp J1/J2 and an identity-MO-wrapped composite J3 with
  a seeded nonzero j_matrix) in its built (pGTO, PW) J3 order and in the (PW, pGTO) order with the j_matrix rows/columns
  and J1-like column permuted to match, at one seeded electron configuration and the MCMC driver''s default non-local
  mesh with the identity rotation, the free kernels and the MCMC driver entries grad_ln_psi_eps_pbc_batch and grad_e_L_eps_pbc_batch
  equal reverse-mode strain AD of ln|Psi| and of e_L with the cell, nuclei and electrons strained together, in the
  same precision. Every reference must be finite and distinguishable from zero. This mathematical guarantee
  owns full AD only at strict; paired mixed numerical receipts belong to NUM-RS-REAL-J3-CHILD-ORDER-DERIVATIVE-MIXED-FIDELITY-001.'
verdict_methods: [VM-MATH-AD-ORACLE-001]
required_evidence:
- verdict_method: VM-MATH-AD-ORACLE-001
  nodes:
  - pytest_node: tests/test_rs_kernel/test_vmc_real_j3_pw_first_force_stress.py::test_real_j3_composite_stress_matches_strain_ad_in_both_child_orders
    required_precision_modes: [full]
    required_parameter_cases:
    - {order: gto_first}
    - {order: pw_first}
    executable_checks:
      stress-vs-strain-ad:
        site: tests/test_rs_kernel/test_vmc_real_j3_pw_first_force_stress.py::test_real_j3_composite_stress_matches_strain_ad_in_both_child_orders#comparison-2
        comparator: numpy.testing.assert_allclose
        actual: {role: rust-real-vmc-pulay-and-hf-stress, expression: value}
        reference: {role: same-precision-strain-autodiff-of-ln-psi-and-local-energy, expression: reference}
        precision:
          full:
            policy: CMP-ZONE-ALLCLOSE-STRICT-001
            zones: [ao_eval, ao_grad_lap, mo_eval, mo_grad, mo_lap, det_eval, det_grad_lap, jastrow_eval, jastrow_grad_lap,
              wf_kinetic, ewald, coulomb]
