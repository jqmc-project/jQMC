id: IMPL-RS-WAVEFUNCTION-KERNELS-001
kind: implementation
name: Rust/XLA parity of wavefunction kernels
plain_language: The Rust Jastrow, ln(det), and kinetic kernels reproduce the XLA evaluators, including the J3 channels,
  the Jastrow form token, and composite AOs with core electrons. The native FAST energy chunk of a raw-AO molecular J3
  contracts its chunk-carried J3 derivative table in both precision modes (in mixed precision in fp64, with the summed
  Jastrow gradient and Laplacian rounded to the fp32 jastrow_grad_lap zone, as the GFMC kinetic does); its endpoint
  energy equals the XLA local energy rebuilt from scratch at the returned walkers. The native FAST energy chunk of a
  real-Gamma periodic MO-pGTO ccECP geminal (spherical and Cartesian lithium cells, J1+J2) carries the sweep's
  determinant state across steps in both precision modes (in mixed precision the zone-local fp32 ao_eval sweep values)
  and hands it to the FAST kinetic and the ECP non-local; its endpoint energy equals the XLA local energy rebuilt from
  scratch at the returned walkers.
verdict_methods:
- VM-IMPL-BACKEND-PARITY-001
required_evidence:
- verdict_method: VM-IMPL-BACKEND-PARITY-001
  nodes:
  - pytest_node: tests/test_rs_kernel/test_chain_modes.py::test_molecular_mo_j3_chunk_energy_matches_xla_at_returned_walkers
    required_precision_modes: [full, mixed]
    required_parameter_cases: [{}]
    executable_checks:
      rectangular-mo-j3-endpoint-energy:
        site: tests/test_rs_kernel/test_chain_modes.py::_assert_value_parity#comparison-1
        comparator: numpy.testing.assert_allclose
        actual: {role: native-real-molecular-chunk-energy, expression: rust_value}
        reference: {role: xla-from-scratch-energy-at-native-endpoint, expression: xla_value}
        precision:
          full: {policy: CMP-XLA-RUST-MEDIUM-001, zones: [ao_eval, jastrow_eval, det_eval, coulomb, wf_kinetic, swct]}
          mixed: {policy: CMP-XLA-RUST-MEDIUM-001, zones: [ao_eval, jastrow_eval, det_eval, coulomb, wf_kinetic, swct]}
  - pytest_node: tests/test_rs_kernel/test_chain_modes.py::test_molecular_raw_ao_j3_chunk_energy_matches_xla_at_returned_walkers
