id: IMPL-RS-DRIVER-ECP-HIGH-L-001
kind: implementation
name: Deterministic Rust/XLA MCMC and GFMC driver values with a live non-local l >= 1 ECP channel
plain_language: >-
  On the committed Cl2 ccECP, whose non-local s and p coefficients are non-zero on both atoms, with J1+J2:
  the production MCMC driver with Rust on and off (XLA normals and meshes injected into the native chunk,
  two walkers, force and SWCT on) keeps accepted moves and keys exactly and final walkers within the fp64
  walker pin, and its stored w_L, e_L, HF and Pulay force and public energy and force agree at the medium
  XLA-Rust tier, e_L^2 at its squared-observable image. GFMC_t and GFMC_n with one walker, random mesh,
  T-move and DLT-move keep keys exactly and walkers within the fp64 pin, and stored w_L, e_L, e_L^2 and
  public energy agree at the same tier. With position derivatives and SWCT on, GFMC_t and GFMC_n with T-move
  and DLT-move also agree in the stored HF and Pulay forces and the public force, every stored force finite on
  both backends. At every final walker the l >= 1 non-local contribution exceeds the e_L envelope. A native
  e_L scaled by 1 + 10 rtol must fail. The stored native MCMC e_L of the last step equals kinetic + bare
  Coulomb + local ECP + a non-local reference built from the raw ECP arrays (terms selected from ang_moms and
  max_ang_mom_plus_1, scipy Legendre, full determinant and Jastrow ratios, nearest-nucleus convention) at
  each final walker and the rotation of its final key, and in every GFMC row the production non-local ECP
  energy at the native final walker equals that reference, with the l >= 1 part of the reference outside
  the envelope; a non-local term selection shared by both backends therefore cannot hide a dropped p
  channel. Full and mixed are judged separately.
verdict_methods: [VM-IMPL-BACKEND-PARITY-001]
required_evidence:
- verdict_method: VM-IMPL-BACKEND-PARITY-001
