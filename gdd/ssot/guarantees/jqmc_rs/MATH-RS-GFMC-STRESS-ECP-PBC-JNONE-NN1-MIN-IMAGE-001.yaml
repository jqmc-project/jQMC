id: MATH-RS-GFMC-STRESS-ECP-PBC-JNONE-NN1-MIN-IMAGE-001
kind: mathematical
name: The LRDMC periodic ECP stress without Jastrow selects the minimum-image nearest ECP nucleus (NN = 1)
plain_language: >-
  stress_pbc.rs grad_v_ecp_nonlocal_strain_gfmc, reached by jqmc_rs._gfmc_stress_ecp_pbc_jnone
  (gfmc_forces::gfmc_stress_ecp_pbc_jnone_route, the jnone branch of the LRDMC periodic stress), ranks the ECP nuclei of its
  NN = 1 filter by the minimum-image distance in nearest_set; LRDMC walkers drift whole lattice vectors out of the home cell. On
  the committed lithium cell (Li bcc, two ECP nuclei, real Gamma, SD without Jastrow), one up and one down electron, the
  home-cell copy Xw puts each electron within about 1 bohr of a home-cell nucleus and X = Xw + lattice vectors (four shift
  pairs) puts each electron next to an image of that nucleus; the brute-force image search of
  tests/_ecp_min_image_reference.py shows that the minimum-image nearest nucleus at X is the one at Xw and that the raw
  Cartesian distance ranks the other nucleus first for every electron (input validity). The stress at X equals the stress at Xw
  (lattice-translation invariance of the HF stress for a real-Gamma wavefunction), compared in the max norm scaled by the
  largest entry as in the periodic GFMC stress tests. Full and mixed are judged separately, each at the existing zone
  tolerances of its own policy (no mixed-vs-full comparison).
verdict_methods: [VM-MATH-REFERENCE-001]
required_evidence:
- verdict_method: VM-MATH-REFERENCE-001
  nodes:
  - pytest_node: tests/test_rs_kernel/test_gfmc_stress_ecp_pbc_jnone_nn1_min_image.py::test_gfmc_stress_ecp_pbc_jnone_nn1_selects_min_image_nearest_nucleus
    required_precision_modes: [full, mixed]
    required_parameter_cases: [{shift: shift0}, {shift: shift1}, {shift: shift2}, {shift: shift3}]
