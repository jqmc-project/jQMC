    required_precision_modes: [full, mixed]
    required_parameter_cases: [{with_jastrow: false}, {with_jastrow: true}]
  - pytest_node: tests/test_rs_kernel/test_pbc_screened_derivatives.py::test_pbc_stress_matches_fd_of_screened_e_L
    required_precision_modes: [full, mixed]
    required_parameter_cases: [{with_jastrow: false}, {with_jastrow: true}]
