id: IMPL-RS-FAST-CUT-AO-DERIVATIVE-SCREEN-ABS-BOUND-1E-12-001
kind: implementation
name: FAST-mode Rust AO derivative screens drop only derivatives below 1e-12 in absolute AO units
plain_language: >-
  The screened FAST-mode Rust AO gradient and Laplacian kernels (compute_aos_grad_lap_fast_cut,
  compute_aos_single_value_grad_lap_fast_cut_into, compute_aos_single_value_grad_lap_fast_cut_folded_into) may zero a
  shell's derivative rows for a far point only where every gradient component and the Laplacian of every AO of that
  shell is below FAST_AO_SCREEN_ABS_BOUND = 1e-12 (jqmc._setting) in absolute AO units, normalization and contraction
  coefficients included. This tightens the 1e-9 class of the derivative screen,
  because a per-AO 1e-9 bound is amplified in the FAST local energy of spatially extended inputs. On the
  committed ccECP inputs water_ccecp_ccpvqz.h5 (spherical) and CuBr_ecp_ccpvtz_cart.h5 (Cartesian), at seeded points
  around every nucleus with pz_min r^2 from 5 to 80 for every distinct shell exponent (some exact derivatives lie
  between 1e-12 and exp(-20.72)), and for one accepted Cartesian AO at the origin with powers (82, 0, 0), exponent 1
  and contraction coefficient 2e-12 at points on and next to the x axis with r^2 from 10 to 110 (its derivatives are
  below 1e-12 at r^2 = 20.72 and above it farther out), every derivative a kernel drops is at most 1e-12 in magnitude
  and every derivative it keeps equals the exact XLA compute_AOs_grad and compute_AOs_laplacian, or the independent
  closed form of c N x^82 exp(-r^2) for the l = 82 AO, within the strict XLA-Rust consistency tolerance of the
  ao_grad_lap zone; the kernels are reached through the test-only binding compute_AOs_grad_lap_fast_cut. Full and
  mixed are each required.
verdict_methods: [VM-IMPL-BACKEND-PARITY-001]
required_evidence:
- verdict_method: VM-IMPL-BACKEND-PARITY-001
  nodes:
  - pytest_node: tests/test_rs_kernel/test_fast_cut_derivative_screen_abs_bound.py::test_fast_derivative_screens_drop_only_terms_below_absolute_bound
    required_precision_modes: [full, mixed]
    required_parameter_cases:
    - {trexio_file: water_ccecp_ccpvqz.h5, kind: sphe}
    - {trexio_file: CuBr_ecp_ccpvtz_cart.h5, kind: cart}
    executable_checks:
      fast-cut-ao-derivatives-abs-bound-vs-exact-xla:
        site: tests/test_rs_kernel/test_fast_cut_derivative_screen_abs_bound.py::test_fast_derivative_screens_drop_only_terms_below_absolute_bound#comparison-1
        comparator: numpy.testing.assert_allclose
        actual: {role: rust-fast-cut-ao-grad-lap, expression: "val[kept]"}
        reference: {role: exact-xla-ao-grad-lap, expression: "ref[kept]"}
        precision:
          full: {policy: CMP-XLA-RUST-STRICT-001, zones: [ao_grad_lap]}
          mixed: {policy: CMP-XLA-RUST-STRICT-001, zones: [ao_grad_lap]}
  - pytest_node: tests/test_rs_kernel/test_fast_cut_derivative_screen_abs_bound.py::test_fast_derivative_screens_absolute_bound_for_high_angular_momentum
    required_precision_modes: [full, mixed]
    required_parameter_cases: [{}]
    executable_checks:
      fast-cut-ao-derivatives-abs-bound-high-l-vs-closed-form:
        site: tests/test_rs_kernel/test_fast_cut_derivative_screen_abs_bound.py::test_fast_derivative_screens_absolute_bound_for_high_angular_momentum#comparison-1
        comparator: numpy.testing.assert_allclose
        actual: {role: rust-fast-cut-ao-grad-lap, expression: "val[kept]"}
        reference: {role: independent-closed-form-ao-grad-lap, expression: "ref[kept]"}
        precision:
          full: {policy: CMP-XLA-RUST-STRICT-001, zones: [ao_grad_lap]}
          mixed: {policy: CMP-XLA-RUST-STRICT-001, zones: [ao_grad_lap]}
