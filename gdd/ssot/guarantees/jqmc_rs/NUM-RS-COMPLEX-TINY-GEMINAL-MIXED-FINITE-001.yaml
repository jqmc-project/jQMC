id: NUM-RS-COMPLEX-TINY-GEMINAL-MIXED-FINITE-001
kind: numerical
name: The mixed native complex routes stay finite for a geminal below sqrt(tiny)
plain_language: >-
  Mixed precision. On the inputs of MATH-RS-COMPLEX-TINY-GEMINAL-SCALE-INVARIANCE-001 (MO coefficients x
  1e-85), each case is rebuilt and evaluated under the mixed and under the full policy (tests/_precision_fidelity.py);
  every mixed output of the native complex local-energy parts, the energy chunk (with its inverse), MCMC.run, GFMC_n
  and the free LRDMC / ECP force / strain / GFMC HF routes is finite, and the mixed energy chunk and the epsilon_AS = 0
  MCMC chain make exactly the accept decisions of the full ones. This is a smoke and decision check, never a
  correctness oracle; scale invariance is claimed in full precision only.
verdict_methods: [VM-NUM-SMOKE-001]
required_evidence:
- verdict_method: VM-NUM-SMOKE-001
  nodes:
  - pytest_node: tests/test_rs_kernel/test_complex_tiny_geminal_native.py::test_native_complex_local_energy_parts_are_finite_and_scale_invariant_for_a_tiny_geminal
    required_precision_modes: [mixed]
    required_parameter_cases: [{witness: li_k025_ccecp}, {witness: h4_k025_ae}]
  - pytest_node: tests/test_rs_kernel/test_complex_tiny_geminal_native.py::test_native_complex_energy_chunk_is_finite_and_scale_invariant_for_a_tiny_geminal
    required_precision_modes: [mixed]
    required_parameter_cases: [{witness: li_k025_ccecp}, {witness: h4_k025_ae}]
  - pytest_node: tests/test_rs_kernel/test_complex_tiny_geminal_native.py::test_native_complex_public_drivers_have_finite_scale_invariant_e_L_for_a_tiny_geminal
    required_precision_modes: [mixed]
    required_parameter_cases: [{driver: mcmc_default}, {driver: mcmc_eps0}, {driver: gfmc_n}]
  - pytest_node: tests/test_rs_kernel/test_complex_tiny_geminal_native.py::test_native_complex_gfmc_force_stress_routes_are_finite_and_scale_invariant_for_a_tiny_geminal
    required_precision_modes: [mixed]
    required_parameter_cases: [{route: lrdmc_ecp_reference}, {route: lrdmc_ecp_fast}, {route: lrdmc_kinetic_reference}, {route: lrdmc_kinetic_fast}, {route: ecp_force}, {route: ecp_strain}, {route: gfmc_hf_force_stress}]
