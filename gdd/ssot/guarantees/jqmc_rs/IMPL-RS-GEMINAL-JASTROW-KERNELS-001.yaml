kind: implementation
name: Rust/XLA parity of geminal and Jastrow kernel families
plain_language: The Rust AGPn, determinant streaming, AS regularization, open-shell single-spin, J3 and Jastrow ratio, DTN,
  far-cutoff, high-angular-momentum cartesian GTO, and nearest-atom kernels reproduce the XLA evaluators; malformed Python-side
  extraction fails loudly. In the FAST native energy chunk only (the MCMC sweep J1/J2 ratio under ao_cutoff and the ECP
  non-local mesh J1/J2 ratios under cutoff, both on only with native_rng), a periodic fp64 J1/J2 ratio is evaluated by the
  J12FastPeriodic twin, which replaces libm sin_cos with fastmath::sincos and retains the cancellation-safe exponential
  radial form. Its smooth periodic distance agrees with the libm smooth_dist within ATOL_FASTMATH_PERIODIC_SMOOTH_DIST
  and its single-move and ECP-mesh ratios agree with the exact routines within RTOL_FASTMATH_PERIODIC_J12_RATIO
  (jqmc._setting), for exp and pade J1 and J2, both spins and the coalescence branch. The native evidence covers small
  positive exponential J1 and J2 parameters independently in Full and Mixed, with ordinary-parameter controls.
  Molecular J1/J2, the fp32 jastrow_ratio policy and every bit-exact or
  per-step route keep the libm routine unchanged.
verdict_methods:
- VM-IMPL-BACKEND-PARITY-001
- VM-IMPL-REVIEWED-CONTRACT-001
- VM-ERROR-DISPOSITION-001
