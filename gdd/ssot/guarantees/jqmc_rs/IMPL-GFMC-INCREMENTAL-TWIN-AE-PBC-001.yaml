id: IMPL-GFMC-INCREMENTAL-TWIN-AE-PBC-001
kind: implementation
name: Incremental interval potential equals the full-recompute twin per sub-step (Rust GFMC_n, periodic all-electron)
plain_language: 'On the periodic all-electron fixture H4_pbc_ae_cart.h5 (where the carried state holds the discretized
  electron-ion rows that the ECP twin cells never build), the native GFMC_n interval run for nsub = 1 .. 12 sub-steps from
  one key reproduces the debug_full_recompute route at every nsub: the walker is byte-identical, w_L, V_diag and e_L agree
  at the tight absolute twin pin, and the applied-update counter equals nsub on the incremental route and zero on the twin.
  The walk starts with same-spin pairs across the exchange node next to protons, and on at least one returned configuration
  an electron that has moved has its discretized row selected into V_diag (sign-flipped kinetic elements and ei_disc above
  ZV, evaluated with the XLA kernels), so the carried ei_disc channel is consumed.'
verdict_methods:
- VM-IMPL-ROUTE-PARITY-001
required_evidence:
- verdict_method: VM-IMPL-ROUTE-PARITY-001
  nodes:
  - pytest_node: tests/test_rs_kernel/test_gfmc_incremental_twin_ae_pbc.py::test_rust_ae_pbc_gfmc_n_interval_matches_full_recompute_per_substep
    executable_checks:
      incremental-components:
        site: tests/test_rs_kernel/test_gfmc_incremental_twin_ae_pbc.py::test_rust_ae_pbc_gfmc_n_interval_matches_full_recompute_per_substep#comparison-1
