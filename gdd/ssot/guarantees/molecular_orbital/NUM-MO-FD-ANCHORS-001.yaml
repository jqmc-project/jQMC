id: NUM-MO-FD-ANCHORS-001
kind: numerical
name: Module-level finite-difference anchors for molecular orbitals
plain_language: Autodiff MO gradients and Laplacians agree with independent finite differences on the core evaluators; the
  periodic sentinels are owned by the derivative ledger. The config_A cases of both nodes place every electron so far from
  the nuclei that every AO underflows to exactly zero; they establish only finite output on underflow, not derivative agreement.
