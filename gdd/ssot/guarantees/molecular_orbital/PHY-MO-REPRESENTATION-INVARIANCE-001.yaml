id: PHY-MO-REPRESENTATION-INVARIANCE-001
kind: physical
name: Basis-representation invariance of molecular orbitals
plain_language: 'Physics does not depend on the basis representation: spherical/cartesian round trips preserve the MOs,
  the projection is invariant to cartesian AO normalization, and complex Bloch round trips preserve the twist.'
