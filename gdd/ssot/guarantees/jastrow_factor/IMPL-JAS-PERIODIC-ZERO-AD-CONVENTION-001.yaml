id: IMPL-JAS-PERIODIC-ZERO-AD-CONVENTION-001
kind: implementation
name: Periodic coincidence keeps numerical masks and finite outer autodiff
plain_language: >-
  Exact coincidence is not a differentiable physical cusp. The reviewed
  numerical extension sets the smooth distance and its selected AD tangents
  to zero at the origin and lattice images. The Cartesian self-pair mask
  makes J2 gradient/Laplacian and their coordinate and cell outer derivatives
  exactly zero. A nonzero lattice-vector displacement retains the existing
  EPS_safe_distance clamp rather than claiming zero analytic Laplacian;
  its pair fields and coordinate/cell outer derivatives must be finite.
  Explicit cubic and integer-triclinic cells, exp/Pade self-pairs and a Pade
  image pair use no files, random sampling, determinant or cond(G) selection.
  This is a numerical convention/finiteness check, never a mathematical
  oracle for physical derivatives at coalescence or a replacement for the
  independent nonzero periodic-law and cusp-response tests.
verdict_methods: [VM-IMPL-REVIEWED-CONTRACT-001]
required_evidence:
- verdict_method: VM-IMPL-REVIEWED-CONTRACT-001
  nodes:
  - pytest_node: tests/test_jqmc_kernel/test_jastrow_skew_zero_response.py::test_periodic_j2_masked_zero_outer_ad
    required_precision_modes: [full, mixed]
    required_parameter_cases:
    - {form: exp, cell_kind: cubic}
    - {form: exp, cell_kind: dyadic-triclinic}
    - {form: pade, cell_kind: cubic}
    - {form: pade, cell_kind: dyadic-triclinic}
    executable_checks:
      actual-fields:
