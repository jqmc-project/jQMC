id: PHY-JAS-LATTICE-TRANSLATION-001
kind: physical
name: Lattice-shift invariance of the fused DTN drift mesh
plain_language: 'Shifting one electron by a whole lattice vector leaves the DTN value delta and drift field unchanged: the
  min-image reduction satisfies this by construction, so any leak of raw coordinates into an assembled quantity breaks it
  -- a property gate that catches representation-mixing bugs (the F1 class) without foreknowledge of the failure mode.'
verdict_methods:
- VM-PHY-INVARIANT-001
required_evidence:
- verdict_method: VM-PHY-INVARIANT-001
  nodes:
  - pytest_node: tests/test_jqmc_kernel/test_jastrow_dtn.py::TestDTNDriftMeshDense::test_drift_mesh_lattice_shift_invariance
    executable_checks:
      comparison-1:
        site: tests/test_jqmc_kernel/test_jastrow_dtn.py::TestDTNDriftMeshDense.test_drift_mesh_lattice_shift_invariance#comparison-1
        comparator: numpy.testing.assert_allclose
        actual:
          role: existing-test-actual
          expression: outs[1][0]
        reference:
          role: existing-test-reference
          expression: outs[0][0]
        precision:
          full:
            policy: CMP-ZONE-ALLCLOSE-STRICT-001
            zones:
            - jastrow_grad_lap
          mixed:
            policy: CMP-ZONE-ALLCLOSE-STRICT-001
            zones:
            - jastrow_grad_lap
      comparison-2:
        site: tests/test_jqmc_kernel/test_jastrow_dtn.py::TestDTNDriftMeshDense.test_drift_mesh_lattice_shift_invariance#comparison-2
