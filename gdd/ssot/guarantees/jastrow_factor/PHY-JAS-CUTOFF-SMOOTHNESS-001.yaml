id: PHY-JAS-CUTOFF-SMOOTHNESS-001
kind: physical
name: Cutoff smoothness and seam behavior of the DTN Jastrow
plain_language: DTN channels vanish smoothly at their cutoffs (C4 edge smoothness, two derivatives vanishing at the fold
  seam) and minimum-image paths agree inside the supported ball; the reviewed negative control exposes the gradient jump
  when the cutoff is unsafe, and unsafe constructions are rejected.
verdict_methods:
- VM-PHY-INVARIANT-001
- VM-ERROR-DISPOSITION-001
required_evidence:
- verdict_method: VM-PHY-INVARIANT-001
  nodes:
  - pytest_node: tests/test_jqmc_kernel/test_jastrow_dtn.py::TestDTNConstraints::test_dtn_cutoff_edge_smoothness_C4
  - pytest_node: tests/test_jqmc_kernel/test_dtn_cutoff_primal_reference.py::test_original_cutoff_fixture_is_outside_support
    required_precision_modes: [full, mixed]
    required_parameter_cases: [{}]
    executable_checks:
      original-policy-outside-support:
        site: tests/test_jqmc_kernel/test_dtn_cutoff_primal_reference.py::test_original_cutoff_fixture_is_outside_support#exact-comparison-1
        comparator: numpy.testing.assert_array_equal
        actual: {role: original-fixture-policy-field, expression: got}
        reference: {role: exact-outside-support-zero, expression: np.zeros_like(got)}
        iterations: {variable: field, required_values: [value, grad-up, grad-down, lap-up, lap-down]}
        precision:
          full: {policy: CMP-EXACT-VALUES-001}
          mixed: {policy: CMP-EXACT-VALUES-001}
      independent-primal-outside-support:
        site: tests/test_jqmc_kernel/test_dtn_cutoff_primal_reference.py::test_original_cutoff_fixture_is_outside_support#exact-comparison-2
        comparator: numpy.testing.assert_array_equal
