id: MATH-JAS-DERIVATIVE-CONSISTENCY-001
kind: mathematical
name: Derivative consistency of the Jastrow factor
plain_language: Analytical gradients and Laplacians of J1, J2, J3 (AO and MO basis), the combined Jastrow, and the DTN family
  equal the autodiff oracle, including the f-atom kernel and the scalar-distance derivatives.
verdict_methods:
- VM-MATH-AD-ORACLE-001
required_evidence:
- verdict_method: VM-MATH-AD-ORACLE-001
  nodes:
  - pytest_node: tests/test_jqmc_kernel/test_jastrow.py::TestJastrowPBCAnalytic::test_j1_pbc_analytic_vs_auto
    required_parameter_cases:
    - {jb_type: exp, triclinic: false}
    - {jb_type: pade, triclinic: false}
    - {jb_type: exp, triclinic: true}
    - {jb_type: pade, triclinic: true}
    required_precision_modes: [full]
    executable_checks:
      spin-derivatives:
        site: tests/test_jqmc_kernel/test_jastrow.py::TestJastrowPBCAnalytic.test_j1_pbc_analytic_vs_auto#comparison-2
        comparator: numpy.testing.assert_allclose
        actual: {role: analytical-j1-spin-derivatives, expression: np.asarray(got)}
        reference: {role: autodiff-j1-spin-derivatives, expression: np.asarray(ref)}
        iterations:
          variable: component
          required_values: [gradient-up, gradient-down, laplacian-up, laplacian-down]
        precision:
          full: {policy: CMP-ZONE-ALLCLOSE-STRICT-001, zones: [jastrow_grad_lap]}
