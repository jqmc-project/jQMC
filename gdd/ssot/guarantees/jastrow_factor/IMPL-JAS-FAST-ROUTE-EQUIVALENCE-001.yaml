id: IMPL-JAS-FAST-ROUTE-EQUIVALENCE-001
kind: implementation
name: Fast DTN routes equal the straightforward recompute
plain_language: 'Every accelerated DTN f-channel route returns what the straightforward recompute returns: the fused one-shot
  mesh equals per-config evaluation (including the oblique-cell shift crossing, the exact-once double-count positive control,
  spin-channel asymmetry, u-only pairs outside the f lists, and the pinned flattening order); the drift mesh equals the
  streamed oracle across PBC image crossings and through the production wiring; and the incremental rank-one grad/Laplacian
  advance equals a freshly built full state across drift accumulation, cutoff crossings, PBC image crossings, edge cases,
  and the walker axis under vmap, within the strict pair of its jastrow_grad_lap_carry zone (fp64 in both modes) and with
  the carried state stored in that zone. A stream that cannot take the fast route says so loudly rather than degrading silently.
  The routes are dense one-shot kernels (there is no neighbour-list route), so the claim is fast-vs-recompute, not
  sparse-vs-dense.'
verdict_methods:
- VM-IMPL-ROUTE-PARITY-001
- VM-ERROR-DISPOSITION-001
required_evidence:
- verdict_method: VM-IMPL-ROUTE-PARITY-001
  nodes:
  - pytest_node: tests/test_jqmc_kernel/test_jastrow_dtn.py::TestDTNGeometryMeshWeighted::test_weighted_geometry_matches_dense_oracle
