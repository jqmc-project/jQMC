        site: tests/test_jqmc_kernel/test_jastrow_dtn.py::TestDTNGeometryMeshWeighted.test_weighted_geometry_matches_dense_oracle#comparison-1
        comparator: numpy.testing.assert_allclose
        actual:
          role: existing-test-actual
          expression: np.asarray(got_R)
        reference:
          role: existing-test-reference
          expression: ref_R
        precision:
          full:
            policy: CMP-ZONE-ALLCLOSE-STRICT-001
            zones:
            - jastrow_grad_lap
          mixed:
