  The original numerical tolerances and all baseline comparisons remain.
verdict_methods: [VM-IMPL-REVIEWED-CONTRACT-001]
required_evidence:
- verdict_method: VM-IMPL-REVIEWED-CONTRACT-001
  nodes:
  - pytest_node: tests/test_jqmc_kernel/test_jastrow_translated_geometry.py::test_translated_j1_contract_rejects_coordinate_precast
    required_precision_modes: [full, mixed]
