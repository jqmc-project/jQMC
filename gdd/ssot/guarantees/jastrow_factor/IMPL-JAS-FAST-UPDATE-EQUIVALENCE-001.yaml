id: IMPL-JAS-FAST-UPDATE-EQUIVALENCE-001
kind: implementation
name: Fast-update equivalence of the Jastrow factor
plain_language: Rank-1 and split-spin ratio updates, sweeps, the streaming DTN ratio state with reinitialization, and the
  ragged nonuniform MO layout all equal the full recomputation.
verdict_methods:
- VM-IMPL-REVIEWED-CONTRACT-001
- VM-IMPL-ROUTE-PARITY-001
required_evidence:
- verdict_method: VM-IMPL-ROUTE-PARITY-001
  nodes:
  - pytest_node: tests/test_jqmc_kernel/test_jastrow.py::TestStreamingJastrowState::TestStreamingJ1::test_streaming_J1_state_against_full_molecular
    required_precision_modes:
    - full
    - mixed
    required_parameter_cases:
    - n_up: 5
      n_dn: 4
      j1b_type: exp
    - n_up: 5
      n_dn: 4
      j1b_type: pade
    - n_up: 1
      n_dn: 0
      j1b_type: exp
    - n_up: 1
      n_dn: 0
      j1b_type: pade
    - n_up: 3
      n_dn: 3
      j1b_type: exp
    - n_up: 3
      n_dn: 3
      j1b_type: pade
    executable_checks:
      gradient-up:
        site: tests/test_jqmc_kernel/test_jastrow.py::TestStreamingJastrowState.TestStreamingJ1.test_streaming_J1_state_against_full_molecular#comparison-1
        comparator: numpy.testing.assert_allclose
        actual:
          role: carried-streaming-gradient-up
          expression: np.asarray(state.grad_J1_up)
        reference:
          role: fresh-analytic-recompute
          expression: np.asarray(g_up_full)
        precision:
          full:
            policy: CMP-ZONE-ALLCLOSE-STRICT-001
            zones:
            - jastrow_grad_lap
          mixed:
            policy: CMP-ZONE-ALLCLOSE-STRICT-001
            zones:
            - jastrow_grad_lap
      gradient-down:
        site: tests/test_jqmc_kernel/test_jastrow.py::TestStreamingJastrowState.TestStreamingJ1.test_streaming_J1_state_against_full_molecular#comparison-2
        comparator: numpy.testing.assert_allclose
        actual:
          role: carried-streaming-gradient-down
          expression: np.asarray(state.grad_J1_dn)
        reference:
          role: fresh-analytic-recompute
          expression: np.asarray(g_dn_full)
        precision:
          full:
            policy: CMP-ZONE-ALLCLOSE-STRICT-001
            zones:
            - jastrow_grad_lap
          mixed:
            policy: CMP-ZONE-ALLCLOSE-STRICT-001
            zones:
            - jastrow_grad_lap
        empty_cases:
        - selector:
            n_up: 1
            n_dn: 0
          shape:
          - 0
          - 3
      laplacian-up:
        site: tests/test_jqmc_kernel/test_jastrow.py::TestStreamingJastrowState.TestStreamingJ1.test_streaming_J1_state_against_full_molecular#comparison-3
