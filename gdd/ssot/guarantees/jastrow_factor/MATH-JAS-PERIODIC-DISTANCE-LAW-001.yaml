id: MATH-JAS-PERIODIC-DISTANCE-LAW-001
kind: mathematical
name: Conventional periodic J1 and J2 follow the full cell metric
plain_language: >-
  With row-vector cell C, fractional displacement s=x inv(C), Gram G=C C.T,
  h=sin(pi s) cos(pi s) and z=sin(pi s)^2, the periodic distance squared is
  (||h C||^2 + sum_i G_ii z_i^2)/pi^2. Conventional exp/Pade J1/J2 values,
  coordinate gradients and Laplacians, and all nine affine-strain components
  must agree with a test-only independent positive double-angle expression.
  Lattice translations preserve values. Orthogonal-cell values retain the
  old sine law, but their shear derivatives follow the full law, not a
  diagonal-metric shortcut. Eight selected synthetic parameter sets cover
  cubic, tetragonal, orthorhombic, rotated orthogonal, monoclinic, triclinic
  and a fixed strongly skewed nonsingular cell, both radial forms, both
  Jastrow terms, either occupied single spin and the three J2 spin sectors.
  Each test uses three fixed finite displacements, no file, RNG, determinant
  or cond(G) screen. Both precision modes retain their own active zones and
  existing strict element-wise tolerance. No FD, statistical acceptance or
  mixed-versus-full comparison is used. Molecular and DTN distance laws and
  the conventional spin-independent J2 radial coefficient are unchanged.
  These component tests do not by themselves certify native parity, cached
  ratios, higher force derivatives, arbitrary ill-conditioned cells, or
  invariance under arbitrary integer changes of lattice basis.
  Nonzero near-cusp coordinate and cell responses additionally match an
  independent quartic local series, while exactly representable nonzero
  near-image fields and outer responses obey lattice translation. The
  translation identity is not a substitute for the independent reference.
  At exact coincidence the distance is not Cartesian differentiable;
  the declared zero-tangent/self-pair-mask convention is checked separately
  by IMPL-JAS-PERIODIC-ZERO-AD-CONVENTION-001, not as a physical derivative.
verdict_methods: [VM-MATH-REFERENCE-001, VM-MATH-REVIEWED-IDENTITY-001]
