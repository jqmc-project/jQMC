    - {part: j1, form: exp, cell_kind: cubic, spin_sector: up}
    - {part: j1, form: pade, cell_kind: tetragonal, spin_sector: down}
    - {part: j2, form: exp, cell_kind: orthorhombic, spin_sector: up-down}
    - {part: j2, form: pade, cell_kind: rotated-orthogonal, spin_sector: up-up}
    - {part: j1, form: exp, cell_kind: monoclinic, spin_sector: up}
    - {part: j2, form: pade, cell_kind: monoclinic, spin_sector: down-down}
    - {part: j1, form: pade, cell_kind: triclinic, spin_sector: down}
    - {part: j2, form: exp, cell_kind: strong-skew, spin_sector: up-down}
    executable_checks:
      value:
        site: tests/test_jqmc_kernel/test_jastrow_skew_geometry.py::test_periodic_jastrow_positive_law_values_and_derivatives#comparison-1
        comparator: numpy.testing.assert_allclose
        actual: {role: production-jastrow-value, expression: actual_value}
        reference: {role: independent-positive-periodic-law-value, expression: reference_value}
        iterations: {variable: sample_label, required_values: ['0', '1', '2']}
