id: PHY-JAS-CUSP-CONDITIONS-001
kind: physical
name: Cusp conditions of the DTN Jastrow
plain_language: 'The DTN Jastrow always satisfies the physical cusp conditions: parallel and antiparallel electron-electron
  cusps, the per-species electron-nucleus condition, and cuspless f channels at both coalescence points. ECP records, not
  a charge heuristic or global option, select the electron-nucleus slope: a pseudized species is smooth (dchi/dr at 0+ equals
  zero), while an all-electron species has dchi/dr at 0+ equal to -Z_eff. Coverage includes all-electron, ECP, mixed AE/ECP,
  and zero-core H-ccECP where Z_eff equals the bare Z, and a jqmc-tool trexio convert-to file of the H2 all-electron
  cc-pVDZ input written with explicit valid molecular cutoffs (--dtn-Lu 3.0 --dtn-Lchi 2.5 --dtn-Lf 2.0), which stores
  them as given and keeps the antiparallel e-e cusp +1/2 and the e-n cusp -1, measured as the jump of the production XLA
  gradient across each coalescence point. A species mixing elements is refused, and legacy serialized data
  with apply_en_cusp=False is hard-rejected because its unconstrained chi kink creates a raw local-energy -chi''(0)/r divergence.'
verdict_methods:
- VM-PHY-INVARIANT-001
- VM-ERROR-DISPOSITION-001
required_evidence:
- verdict_method: VM-PHY-INVARIANT-001
  nodes:
  - pytest_node: tests/test_jqmc_kernel/test_jastrow_dtn.py::TestDTNConstraints::test_dtn_ee_cusp_antiparallel
  - pytest_node: tests/test_jqmc_kernel/test_jastrow_dtn.py::TestDTNConstraints::test_dtn_ee_cusp_parallel
  - pytest_node: tests/test_jqmc_kernel/test_jastrow_dtn.py::TestDTNConstraints::test_dtn_en_cusp_AE
