  - pytest_node: tests/test_jqmc_kernel/test_qe_lsda.py::TestRunQE2JQMCLSDA::test_lsda_conversion_end_to_end
  - pytest_node: tests/test_jqmc_kernel/test_pw_pgto_projection.py::TestPWPGTOProjection::test_qe2jqmc_ecutwfc_auto_end_to_end
  - pytest_node: tests/test_jqmc_kernel/test_qe_auto_cutoff_range.py::test_auto_cutoff_represents_a_band_requiring_more_than_30_ry
