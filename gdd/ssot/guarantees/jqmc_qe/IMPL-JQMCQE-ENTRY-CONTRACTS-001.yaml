id: IMPL-JQMCQE-ENTRY-CONTRACTS-001
kind: implementation
name: run_qe2jqmc entry-point contracts
plain_language: The TOML-driven QE conversion completes end to end (LSDA, fixed-cutoff with exponent optimization, and automatic
  ecutwfc selection), rejects wrong kinds, and raises when the automatic target is unreachable. Automatic pgto+pw selection
  probes at most eight geometric trials from the 7.5 Ry entry to 40 Ry, clipped by the QE cutoff; below 30 Ry QE
  input its entry remains one quarter of the QE cutoff. Actual projection must represent a Bloch band needing more than 30
  Ry, preserve first-success stopping, and respect lower QE cutoffs without changing the residual target or condition policy.
  An automatic derived-floor exponent attempt with an infeasible tail ceiling or spread is rejected without losing seed projections
  or other cutoff trials; if none reaches the unchanged target, the normal unreachable-target RuntimeError is retained. Other
  optimizer ValueErrors propagate, as do infeasible bounds at an explicit user floor or numeric cutoff.
verdict_methods:
- VM-IMPL-REVIEWED-CONTRACT-001
- VM-ERROR-DISPOSITION-001
required_evidence:
- verdict_method: VM-IMPL-REVIEWED-CONTRACT-001
  nodes:
