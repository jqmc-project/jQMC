id: NUM-MPC-OPEN-SHELL-DENSITY-001
kind: numerical
name: Open-shell MPC density includes every occupied orbital, checked against an independent occupied-orbital reference
plain_language: >-
  For an open-shell geminal (N_up != N_dn), the MPC trial density is the density of every occupied orbital,
  sum_{up} |psi_i|^2 + sum_{dn} |psi_j|^2, including the up orbitals that the unpaired lambda block occupies. For the
  open-shell fixture (the diag(5,6,7) Bohr box in its orthorhombic and integer-shear basis representations, cutoff
  1.3 Ha, explicit 16^3 grid; three up and one down electron in four orthonormal orbitals) written as an SD, an AGP
  and an AGPn whose unpaired columns carry two of the up electrons, through dense complex MOs at the fixture twist,
  dense real MOs at Gamma and implicit-identity cubic B-spline MOs at Gamma: the dense-MO natural-orbital occupations
  sum to three (up) and one (down); and the production V_LR table nodes, their lookup at table nodes with whole-cell
  offsets and the canonical MPC e-e energy of the four electrons on table nodes agree with an independent reference
  (NumPy occupied-orbital density on the table nodes, box-face quadrature kernel, exact orthorhombic minimum image)
  within the fixture regression bound ATOL_MPC_OPEN_SHELL_FIXTURE_REGRESSION (rtol zero), each precision mode
  against its own reference. The bound is a regression bound for this fixture only, not a first-principles accuracy
  bound for other cells, densities or grids.
verdict_methods:
- VM-NUM-REVIEWED-REGRESSION-001
required_evidence:
- verdict_method: VM-NUM-REVIEWED-REGRESSION-001
  nodes:
  - pytest_node: tests/test_jqmc_kernel/test_mpc_independent_reference.py::test_open_shell_mpc_density_matches_occupied_orbital_reference
    required_precision_modes: [full, mixed]
    required_parameter_cases:
    - {case_name: sd-mo-twist, basis_name: orthorhombic}
    - {case_name: sd-mo-twist, basis_name: sheared-basis}
    - {case_name: agp-mo-twist, basis_name: orthorhombic}
    - {case_name: agp-mo-twist, basis_name: sheared-basis}
    - {case_name: agpn-mo-twist, basis_name: orthorhombic}
    - {case_name: agpn-mo-twist, basis_name: sheared-basis}
    - {case_name: sd-mo-gamma, basis_name: orthorhombic}
    - {case_name: sd-mo-gamma, basis_name: sheared-basis}
    - {case_name: agp-mo-gamma, basis_name: orthorhombic}
    - {case_name: agp-mo-gamma, basis_name: sheared-basis}
    - {case_name: agpn-mo-gamma, basis_name: orthorhombic}
    - {case_name: agpn-mo-gamma, basis_name: sheared-basis}
    - {case_name: sd-identity-gamma, basis_name: orthorhombic}
