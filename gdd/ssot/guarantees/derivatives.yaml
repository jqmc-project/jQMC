  naming_policy:
    rule: descriptive-names-are-primary
    statement: Obligation families use the production quantity tokens ln_Psi, e_L, e_L_t, and e_L_n directly; no separate
      machine-only family code exists. Human-facing guarantee names and ledger headings must describe the differentiated quantity
      or algorithm directly.
  derivative_families:
    log_wavefunction_derivatives:
      name: Analytical derivatives of log(Psi)
      family: ln_Psi
      consumers:
      - VMC
      - MCMC
      - GFMC
      - LRDMC
      quantity: continuous-ln-Psi
      public_entries:
      - jqmc.derivatives.compute_grad_ln_Psi
      implementation_entries:
      - jqmc.derivatives.assemble.compute_grad_ln_Psi
      axes:
      - c
      - r
      - R
      - eps
    local_energy_derivatives:
      name: Analytical derivatives of the local energy
      family: e_L
      consumers:
      - VMC
      - MCMC
      - GFMC
      - LRDMC
      quantity: continuous-local-energy
      public_entries:
      - jqmc.derivatives.compute_grad_e_L
      implementation_entries:
      - jqmc.derivatives.assemble.compute_grad_e_L
      axes:
      - c
      - r
      - R
      - eps
    conventional_algorithm_local_energy_derivatives:
      name: GFMC/LRDMC conventional-algorithm local-energy derivatives
      family: e_L_t
      consumers:
      - GFMC
      - LRDMC
      quantity: conventional-algorithm-local-energy
      public_entries:
      - jqmc.derivatives.gfmc.grad_e_L_t_wrt_positions
      - jqmc.derivatives.gfmc.grad_e_L_t_wrt_positions_and_strain
      - jqmc.derivatives.gfmc.grad_e_L_t_wrt_strain
      implementation_entries:
      - jqmc.derivatives.gfmc.grad_e_L_wrt_positions
      - jqmc.derivatives.gfmc.grad_e_L_wrt_strain
      axes:
      - positions
      - strain
    load_balanced_algorithm_local_energy_derivatives:
      name: GFMC/LRDMC load-balanced-algorithm local-energy derivatives
      family: e_L_n
      consumers:
      - GFMC
      - LRDMC
      quantity: load-balanced-algorithm-local-energy
      public_entries:
      - jqmc.derivatives.gfmc.grad_e_L_n_wrt_positions
      - jqmc.derivatives.gfmc.grad_e_L_n_wrt_positions_and_strain
      - jqmc.derivatives.gfmc.grad_e_L_n_wrt_strain
      implementation_entries:
