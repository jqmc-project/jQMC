          Ne*Nv separately rebuilt mesh geminals. The derivative is a cancellation of O(sum |V_nl|) = O(10^2) terms down
          to O(1e-3), so fp32 AO round-off in the mixed lane gives an AD noise floor of 1e-4 to 5e-4 that depends on the
          XLA CPU fp32 codegen. The reference differentiates the same energy with mesh ratios formed from the
          base inverse by the determinant lemma. Tolerance policy and precision lanes are unchanged.
