    stored_token_eps:
      dispatch_by_boundary:
        molecular:
          semantic_axis: molecular-affine
          definition: simultaneous-affine-deformation-of-electron-and-nuclear-coordinates
          physical_stress_observable: false
          rust_xla_parity_required: true
        periodic:
          semantic_axis: cell-strain
