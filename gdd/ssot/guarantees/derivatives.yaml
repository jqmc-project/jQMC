common_contract:
  shared_contracts:
    concrete_input_binding: gdd/ssot/fixtures/input_bindings.yaml
    electron_configuration_binding: gdd/ssot/fixtures/electron_configurations.yaml
    executable_comparison_policy: gdd/ssot/verdicts.yaml
    per_obligation_binding_required: true
    per_precision_check_policy_required: true
  allowed_outcomes:
  - value
  - n-a
  - error
  proof_kinds:
  - direct-ad
  - identity
  required_witnesses:
    construction:
      operation: derivatives.fixture_builder.v1
      requirement: Every value, n-a, and error obligation must have a constructible committed or independently specified input.
        Missing builders are fixture debt.
    semantic_case_signature:
      operation: derivatives.case_signature.v1
      requirement: The constructed Hamiltonian, wave function, requested derivative target, precision, and route must match
        the concrete required cell. Fixture names and parameter labels are not sufficient.
    activation:
      operation: derivatives.activation_witness.v1
      requirement: The relevant output leaf, numerical regime, component, or refusal path must be demonstrably live without
        requiring nonzero values where physics defines a structural zero.
  comparison_policy:
    full_precision:
      contract: gdd/ssot/verdicts.yaml
      requirement: explicit-policy-id-and-case-specific-tolerance-binding
      implicit_default: forbidden
    mixed_precision:
      contract: gdd/ssot/verdicts.yaml
      requirement: explicit-comparison-or-non-numerical-disposition
      analytical_correctness:
        semantic-input-construction: mixed
        reference: xla-autodiff-same-precision
        reference-operation: derivatives.reference.same-precision-xla-autodiff.v1
        policy-id: CMP-ZONE-ALLCLOSE-MEDIUM-001
        reference-precision: same-as-production
      supplemental_smoke:
        observation-policy: OBS-MIXED-ROUTE-SMOKE-001
        numerical-correctness-oracle: false
  unexpected_results:
    skip: fail-certificate
    xfail: fail-certificate
    zero_collection: fail-certificate
    missing_receipt: fail-certificate
    unavailable_fixture: fail-certificate
