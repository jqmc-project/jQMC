        notes: The full-recompute non-local ECP energy forms each mesh Jastrow ratio as exp(J(r'_g) - J(r)) from two
          whole compute_Jastrow_part values rounded in the mixed-lane fp32 jastrow_eval zone. On Cl2 ccECP
          with a DTN Jastrow its own same-precision AD force is 1.7e-2 (dtn) and 5.0e-2 (j123ao_dtn) off fp64, while the
          production force is 1.2e-2 / 1.4e-2 off. The reference differentiates the same energy with the mesh ratios of
          the production one-move ratio forward (Jastrow ratio in the fp64 jastrow_ratio zone, determinant lemma
          b_g^T G^-1) and takes G^-1 from the fused value/gradient/Laplacian orbital table
          (determinant._geminal_for_grads_lap), the G that the kinetic term of the same energy inverts; it is 4.7e-4 /
