schema_version: 1
document:
  id: jqmc.derivatives
  version: 1
  lifecycle: cutover
  title: Analytical derivative guarantees
  description: GDD declaration for analytical derivatives of log(Psi), the local energy, and the conventional and load-balanced
    GFMC/LRDMC algorithms, together with mixed-precision execution, Rust parity, and mechanical completion. Concrete obligations
    are generated by registered Python operations; they are not copied into this YAML by hand.
  human_ledger:
    path: gdd/ssot/guarantees/README.md
    generator: scripts/render_gdd_derivatives_ledger.py
    editing: generated-do-not-edit
enforcement_map:
  ledger_extensions: scripts/check_gdd_test_mapping.py
  module_evidence: scripts/check_gdd_test_mapping.py
  enforcement: scripts/check_gdd_derivatives_contract.py
  operation_ids: gdd.engine.operations
  baseline: scripts/check_gdd_derivatives_contract.py
  domain: scripts/check_gdd_derivatives_contract.py
  common_contract: scripts/check_gdd_derivatives_contract.py
  existing_test_integration: scripts/check_gdd_derivatives_contract.py
  assurance_chain: scripts/check_gdd_derivatives_contract.py
  fixture_sets: scripts/check_gdd_derivatives_contract.py
  guarantees: scripts/check_gdd_derivatives_contract.py

ledger_extensions:
- derivatives
symbol_contract:
  status: governed
  default_guarantee_refs:
  - OPS-DERIV-CLOSURE-001
  overrides:
    jqmc.derivatives.orbital_tiling.tiled_field_vjp:
    - MATH-TILING-PHYSICAL-VGL-VJP-001
    jqmc.derivatives.compute_grad_ln_Psi:
    - MATH-DERIV-LOG-WAVEFUNCTION-001
    jqmc.derivatives.compute_grad_e_L:
    - MATH-DERIV-LOCAL-ENERGY-001
    jqmc.derivatives.assemble.compute_grad_ln_Psi:
    - MATH-DERIV-LOG-WAVEFUNCTION-001
    jqmc.derivatives.assemble.compute_grad_e_L:
    - MATH-DERIV-LOCAL-ENERGY-001
  critical_private_symbols: []
enforcement:
  static:
    command: python scripts/check_gdd_derivatives_contract.py
    pre_commit_hook: gdd-contracts
  runtime:
    pytest_node: tests/test_jqmc_kernel/test_gdd_derivatives_contract.py
    collection_closure: scripts/check_gdd_required_cases.py
    in_test_self_check: gdd/engine/derivative_registry.py
operation_ids:
  required_cases: derivatives.required_cases.v1
  registered_pytest_cases: derivatives.registered_pytest_cases.v1
  fd_autodiff_fixture_cases: derivatives.fd_autodiff_fixture_cases.v1
  fd_autodiff_registered_cases: derivatives.fd_autodiff_registered_cases.v1
  fd_autodiff_completion: derivatives.fd_autodiff_completion.v1
  continuous_fixture_matrix: derivatives.continuous_fixture_matrix.v1
  gfmc_fixture_matrix: derivatives.gfmc_fixture_matrix.v1
  production_inventory: derivatives.production_inventory.v1
  production_entry_discovery: derivatives.production_entry_discovery.v1
  fixture_builder: derivatives.fixture_builder.v1
  case_signature: derivatives.case_signature.v1
  activation_witness: derivatives.activation_witness.v1
  analytical_completion: derivatives.analytical_completion.v1
  rust_required_cases: derivatives.rust_required_cases.v1
  rust_registered_cases: derivatives.rust_registered_cases.v1
  rust_completion: derivatives.rust_completion.v1
  mixed_route_cases: derivatives.mixed_route_cases.v1
  runtime_case_receipt: derivatives.runtime_case_receipt.v1
baseline:
  purpose: Record the derivative system and its integration paths. Requirement expansion lives in the GDD engine, and
    gdd/engine/operations.py resolves the requirement-side operation IDs. Counts and snapshot digests below are archival
    descriptions, not pins; completion compares exact live required case and component sets. The remaining
    test-side paths are evidence bindings, not requirement authorities.
  required_manifest:
    path: gdd/engine/derivative_requirements.py
    symbol: REQUIRED_CASES
    snapshot:
      algorithm: sha256
      value: 7c0ec7bfcc22d2b50dcc8ed3f2ee5875cacb17df3b6c9c91b5b1a0be4ae21ebe
    obligations:
      total: 979
      required_precision:
      - full
      - mixed
      by_family:
        ln_Psi: 377
        e_L: 378
        e_L_t: 135
        e_L_n: 89
  registered_evidence:
    path: tests/test_jqmc_kernel/analytic_coverage_registration.py
    symbol: NUMERICAL_CASES
    expected_total: 979
  reviewed_matrices:
    continuous:
      operation: derivatives.continuous_fixture_matrix.v1
      algorithm: sha256
      value: 96397978efbb1c3ad288a94346f4c3358cc2f2e7c7a00af95d35b39733c3b735
    gfmc:
      operation: derivatives.gfmc_fixture_matrix.v1
      algorithm: sha256
      value: 2bdd5dbe8d3942bb4d0f37077f546b0a33f9ee60d368dd2d1f55c13006131f7d
  static_completion_gate:
    path: tests/test_jqmc_kernel/test_analytic_coverage_completion_gate.py
  generated_ledger:
    generator: tests/test_jqmc_kernel/gen_coverage_readme.py
  rust_manifest:
    path: tests/test_rs_kernel/analytic_coverage_manifest.py
    upstream_snapshot:
      algorithm: sha256
      value: 7c0ec7bfcc22d2b50dcc8ed3f2ee5875cacb17df3b6c9c91b5b1a0be4ae21ebe
    required_obligations: 979
    explicit_not_applicable: 0
  rust_completion_gate:
    path: tests/test_rs_kernel/test_analytic_coverage_completion_gate.py
