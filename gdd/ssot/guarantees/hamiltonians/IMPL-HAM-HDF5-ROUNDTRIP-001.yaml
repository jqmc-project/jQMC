        site: tests/test_jqmc_kernel/test_hamiltonian.py::TestHamiltonianHDF5PBC.test_hamiltonian_data_save_and_load_hdf5_roundtrip_pbc_dummy#comparison-5
        comparator: numpy.testing.assert_allclose
        actual:
          role: existing-test-actual
          expression: psi_after
        reference:
          role: existing-test-reference
          expression: psi_before
        precision:
          full:
            policy: CMP-ZONE-ALLCLOSE-STRICT-001
            zones:
            - ao_eval
            - jastrow_eval
            - wf_kinetic
          mixed:
            policy: CMP-ZONE-ALLCLOSE-STRICT-001
            zones:
            - ao_eval
            - jastrow_eval
            - wf_kinetic
  - pytest_node: tests/test_jqmc_kernel/test_hamiltonian.py::TestHamiltonianHDF5Compat::test_hamiltonian_data_load_hdf5_without_version_metadata
  - pytest_node: tests/test_jqmc_kernel/test_hamiltonian.py::TestHamiltonianHDF5Compat::test_hamiltonian_data_load_hdf5_backfills_jastrow_two_body_structure_data_in_pbc
