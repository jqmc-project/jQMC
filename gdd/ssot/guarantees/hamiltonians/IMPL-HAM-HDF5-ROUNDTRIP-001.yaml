  - pytest_node: tests/test_jqmc_kernel/test_hamiltonian.py::TestHamiltonianHDF5PBC::test_hamiltonian_data_roundtrip_pbc_j3_via_uncontracted_aos
  - pytest_node: tests/test_jqmc_kernel/test_hamiltonian.py::TestHamiltonianHDF5PBC::test_hamiltonian_data_save_and_load_hdf5_roundtrip_pbc_dummy
    executable_checks:
