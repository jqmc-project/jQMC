id: IMPL-HAM-HDF5-ROUNDTRIP-001
kind: implementation
name: HDF5 persistence round trip of Hamiltonian data
plain_language: 'Saving and reloading Hamiltonian data through HDF5 reproduces the directly built object
  (route parity, direct vs through-disk), including PBC systems, complex SD, backward-compatible backfills, and unversioned files with explicit occupied orbital providers; malformed or inconsistent files are rejected explicitly.'
verdict_methods:
- VM-IMPL-ROUTE-PARITY-001
- VM-IMPL-REVIEWED-CONTRACT-001
- VM-ERROR-DISPOSITION-001
required_evidence:
- verdict_method: VM-IMPL-ROUTE-PARITY-001
  nodes:
  - pytest_node: tests/test_jqmc_kernel/test_hamiltonian.py::TestHamiltonianHDF5::test_hamiltonian_hdf5_roundtrip_accepts_independent_complex_sd
  - pytest_node: tests/test_jqmc_kernel/test_hamiltonian.py::TestHamiltonianHDF5::test_hamiltonian_hdf5
  - pytest_node: tests/test_jqmc_kernel/test_hamiltonian.py::TestHamiltonianHDF5PBC::test_hamiltonian_data_save_and_load_hdf5_roundtrip_pbc_silicon
