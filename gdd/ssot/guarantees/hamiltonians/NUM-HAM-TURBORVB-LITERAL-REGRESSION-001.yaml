id: NUM-HAM-TURBORVB-LITERAL-REGRESSION-001
kind: numerical
name: Historical TurboRVB-labelled literal regressions
plain_language: Wavefunction ratios, kinetic energies, and potentials on fixed AE/ECP configurations remain within the committed
  historical TurboRVB-labelled literal bounds. The historical ECP literals explicitly use Nv=6, NN=1, and an identity rotation,
  so they do not claim agreement for the current Nv=12 production default. All seven fixed-input cases were independently
  revalidated with external TurboRVB; tests/trexio_example_files/turborvb_reference_provenance.json records the actual
  library and executable hashes, commands, raw results, input hashes, coordinates, and historical ECP serialization recipe.
  The original producing binary and execution date remain unknown. These rows remain fixed-input numerical regression
  sentinels, not a general physical-accuracy guarantee or a full/mixed cross-comparison.
verdict_methods:
- VM-NUM-REVIEWED-REGRESSION-001
required_evidence:
- verdict_method: VM-NUM-REVIEWED-REGRESSION-001
  nodes:
