id: IMPL-AO-BUILD-CONTRACTS-001
kind: implementation
name: AO builder and layout contracts
plain_language: Overlap matrices honor bucket and composite layouts with a converged primitive-pair cutoff, composite/pGTO/PW
  views expose the declared molecular counts, B-spline identity MOs return the bands, per-atom image kernels keep exactly
  the per-atom image sets, the complex AO leaf keeps its MRO predicate, phase promotion, image-expansion dispatch, schema
  version, and k-point field, and dtype mismatches are hard errors.
verdict_methods:
- VM-IMPL-REVIEWED-CONTRACT-001
- VM-ERROR-DISPOSITION-001
