id: PHY-AO-LATTICE-PERIODICITY-001
kind: physical
name: Crystal symmetries of periodic atomic orbitals
plain_language: 'Periodic atomic orbitals satisfy their defining crystal symmetries: value invariance under lattice translation
  at Gamma, the Bloch phase at nonzero k, time-reversal pairing between k and -k, a Hermitian overlap, and continuity across
  cell faces, edges, and corners.'
verdict_methods:
- VM-PHY-INVARIANT-001
required_evidence:
- verdict_method: VM-PHY-INVARIANT-001
  nodes:
  - pytest_node: tests/test_jqmc_kernel/test_atomic_orbital.py::TestPWLeaf::test_pw_periodicity_under_lattice_translation
    executable_checks:
      d8-n-075:
        site: tests/test_jqmc_kernel/test_atomic_orbital.py::TestPWLeaf.test_pw_periodicity_under_lattice_translation#comparison-1
        comparator: numpy.testing.assert_allclose
        actual:
          role: source-computed-value
          expression: v0
        reference:
          role: source-reference-value
          expression: v1
        precision:
          full:
            policy: CMP-SOURCE-CENTRAL-PAIR-001
            pair: TOL-D8-FLOOR-MEDIUM-R-BIT-EXACT-001
          mixed:
            policy: CMP-SOURCE-CENTRAL-PAIR-001
            pair: TOL-D8-FLOOR-MEDIUM-R-BIT-EXACT-001
