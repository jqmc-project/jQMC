id: PHY-AO-FAR-CELL-BLOCH-001
kind: physical
name: Bloch law and lattice periodicity of periodic AO leaves far from the home cell
plain_language: >-
  An unwrapped walker can drift far from the home cell, so the translation laws of the periodic AO leaves
  must hold independently of the size of the lattice translation. On the XLA backend every complex pGTO
  (Cartesian and spherical), plane-wave and B-spline leaf at k_frac = (0.25, -0.1, 0.4) satisfies
  chi(r + n.cell) = exp(2 pi i k_frac.n) chi(r) for n = (101, -37, 63) and (10001, -7003, 4005) on five
  cubic and skewed cells, and the real Gamma plane-wave and real B-spline leaves are invariant under
  n = (101, -37, 63) and (10001, -7003, 4005) (up to about 1e5 bohr). The expected phase is written from
  k_frac and the integer n (in the dedicated far-cell check, in exact rational arithmetic reduced modulo 1).
  The real Gamma plane-wave values at r + n.cell, for n up to (1000001, -700003, 400005) (about 7e6 bohr),
  equal the direct numpy cos(G.r) / sin(G.r) of the home-cell point r. Each mode is judged with its own zone
  policy; in mixed precision this requires the Bloch phase (and the real plane-wave fractional coordinate)
  to be reduced in fp64 before the fp32 cast. Full and mixed are judged separately.
verdict_methods: [VM-PHY-INVARIANT-001]
required_evidence:
- verdict_method: VM-PHY-INVARIANT-001
