id: IMPL-AO-LAYOUT-EQUIVALENCE-001
kind: implementation
name: Layout and assembly-route equivalence of atomic-orbital evaluation
plain_language: 'Optimized layouts and assembly routes change nothing: ragged/bucketed per-atom folds equal the direct sum,
  periodic reshape order is value-preserving, composite dispatch flattens correctly, and one-shot builders equal their staged
  twins bit-for-bit where declared.'
verdict_methods:
- VM-IMPL-ROUTE-PARITY-001
required_evidence:
- verdict_method: VM-IMPL-ROUTE-PARITY-001
