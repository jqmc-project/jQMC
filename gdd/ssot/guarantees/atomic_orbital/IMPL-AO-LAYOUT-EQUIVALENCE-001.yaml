      d8-n-093:
        site: tests/test_jqmc_kernel/test_atomic_orbital.py::TestPerAtomRaggedLayout.test_ragged_fold_matches_direct_sum_jax#comparison-1
        comparator: numpy.testing.assert_allclose
        actual:
          role: source-computed-value
          expression: out
        reference:
          role: source-reference-value
          expression: direct
        precision:
          full:
            policy: CMP-SOURCE-CENTRAL-PAIR-001
            pair: TOL-BIT-EXACT-001
          mixed:
            policy: CMP-SOURCE-CENTRAL-PAIR-001
            pair: TOL-BIT-EXACT-001
      d8-n-094:
        site: tests/test_jqmc_kernel/test_atomic_orbital.py::TestPerAtomRaggedLayout.test_ragged_fold_matches_direct_sum_jax#comparison-2
