id: MATH-AO-DERIVATIVE-CONSISTENCY-001
kind: mathematical
name: Derivative consistency of atomic-orbital evaluators
plain_language: Analytical gradients and Laplacians of every atomic-orbital family equal the autodiff oracle of the same
  evaluator; fused value/grad/Laplacian outputs equal their separate evaluations; cell and basis-parameter derivatives match
  JVP; and the complex leaves reduce exactly to the real leaves at the Gamma point.
verdict_methods:
- VM-MATH-AD-ORACLE-001
- VM-MATH-REVIEWED-IDENTITY-001
required_evidence:
- verdict_method: VM-MATH-AD-ORACLE-001
  nodes:
  - pytest_node: tests/test_jqmc_kernel/test_atomic_orbital.py::TestComputeAOsGradLaplacian::test_AOs_grad_analytic_vs_auto_molecular
    required_precision_modes: [full]
    required_parameter_cases: [{ao_kind: cart}, {ao_kind: sphe}]
    executable_checks:
      gradient-components:
        site: tests/test_jqmc_kernel/test_atomic_orbital.py::TestComputeAOsGradLaplacian.test_AOs_grad_analytic_vs_auto_molecular#comparison-2
        comparator: numpy.testing.assert_allclose
        actual: {role: analytical-ao-gradient-component, expression: an}
        reference: {role: autodiff-ao-gradient-component, expression: au}
        precision:
          full: {policy: CMP-ZONE-ALLCLOSE-STRICT-001, zones: [ao_eval, ao_grad_lap]}
  - pytest_node: tests/test_jqmc_kernel/test_atomic_orbital.py::TestComputeAOsGradLaplacian::test_AOs_grad_analytic_vs_auto_periodic
    required_precision_modes: [full]
    required_parameter_cases: [{ao_kind: cart}, {ao_kind: sphe}, {ao_kind: pw}, {ao_kind: bspline}]
    executable_checks:
      gradient-components:
        site: tests/test_jqmc_kernel/test_atomic_orbital.py::TestComputeAOsGradLaplacian.test_AOs_grad_analytic_vs_auto_periodic#comparison-2
        comparator: numpy.testing.assert_allclose
        actual: {role: analytical-ao-gradient-component, expression: an}
        reference: {role: autodiff-ao-gradient-component, expression: au}
