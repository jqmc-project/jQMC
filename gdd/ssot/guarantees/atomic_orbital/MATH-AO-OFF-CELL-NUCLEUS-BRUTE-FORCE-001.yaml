id: MATH-AO-OFF-CELL-NUCLEUS-BRUTE-FORCE-001
kind: mathematical
name: Periodic pGTO values and overlap with nuclei outside the home cell against brute-force lattice sums
plain_language: >-
  On a cubic, a triclinic and a hexagonal cell, with the two nuclei passed to production unwrapped at
  fractional placements just outside a lower and an upper face (-0.1 and 1.1), exactly on a corner and an
  upper face (0 and 1), and more than one cell away (-1.1 and 2.15), periodic Cartesian and spherical pGTO
  values equal the brute-force lattice sum of the open-boundary AO kernel at Gamma and k = (0.25, -0.1, 0.4)
  (ao_eval strict plus AO_IMAGE_TRUNCATION_ATOL), with the brute-force image sum reduced in the zone dtype of
  the compared quantity (ao_eval for values, ao_grad_lap for Laplacians), and
  the periodic Cartesian overlap equals the brute-force whole-space overlap sum (det_eval strict). A nucleus
  on the cell corner displaced by -1e-3, -5e-5, 0, 5e-5 and 1e-3 Bohr along a, with the pGTO leaf and its
  image layout rebuilt at every step, gives AO values (production truncation) and AO Laplacians (ao_grad_lap
  strict, leaf built at the tighter truncation AO_IMAGE_TRUNCATION_ATOL**2 because the production bound is
  stated for values) equal to the brute-force sum at every step, so the kept image set does not jump at the
  face; this face crossing runs on the cubic, the triclinic and the primitive FCC cell. The per-atom image
  indices for atoms at -0.1, 1.1, -1e-12 / 1.0 and -1.1 / 2.15 fractional equal an independent active-set
  enumeration for the unwrapped atom. Choosing the AO image set for the wrapped nucleus, or ignoring the cells
  of the two overlap centres, must fail with its own message. Full and mixed are judged separately.
verdict_methods: [VM-MATH-REFERENCE-001]
required_evidence:
- verdict_method: VM-MATH-REFERENCE-001
