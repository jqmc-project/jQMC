id: MATH-AO-REFERENCE-AGREEMENT-001
kind: mathematical
name: Reference agreement and structural identities of AO data
plain_language: Plane-wave and B-spline evaluators reproduce independent references and known functions; overlap matrices
  match independent quadrature; storage transformations round-trip exactly; and unsupported constructions are rejected explicitly
  instead of returning silent wrong numbers. The mixed complex pGTO+plane-wave Gram is the CONJUGATED form int conj(chi_mu)
  chi_nu, pinned by Gram properties the unconjugated bilinear form lacks, namely a real positive diagonal equal to int |chi|^2
  and a positive-definite spectrum. The pure-PW composite short-circuits before the quadrature and a Gamma pGTO leaf is
  real, so dropping the conjugation was invisible and the final hermitization hid what remained.
verdict_methods:
- VM-MATH-REFERENCE-001
- VM-MATH-REVIEWED-IDENTITY-001
- VM-ERROR-DISPOSITION-001
required_evidence:
- verdict_method: VM-MATH-REFERENCE-001
