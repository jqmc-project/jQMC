id: MATH-AO-PERIODIC-BASIS-UPDATE-001
kind: mathematical
name: Periodic basis updates preserve physical shell parameters and finite accepted wavefunctions
plain_language: A periodic Cartesian or real-spherical GTO basis preserves the canonical home radial parameter identity
  and its angular-component sharing across every lattice image. The normalized s/p reference cases have one independent
  exponent and contraction coefficient per physical shell primitive. Optimization
  keeps the physical alpha/c coordinates and derivatives. A concrete exponent update must be finite and strictly
  positive, and a coefficient update must be finite. Invalid raw arrays and complete optimizer candidates are rejected
  before accepted model state changes. Accepted exponent or coefficient changes rebuild the image envelope at the
  original truncation tolerance before publication. Direct AO and MO-wrapped nonzero J3 bases exercise matrix-only/exponent-only/coefficient-only/combined
  flags. The independent closed-form normalized s/p Gaussian lattice sum with nonzero contraction coefficients over
  [-6,6]^3 and explicit electron pairs provides the physical value and analytic alpha/c derivatives; XLA AD and
  native radial scatter reductions agree under the existing active-precision mathematical-reference tolerance. The sampler evaluates a candidate log wavefunction
  on actual current walkers before publication and rejects non-finite values collectively across sampler and twist
  ranks before Hamiltonian/revision mutation. A real two-rank optimizer witness and typed communicator negative
  controls enforce rank-uniform rejection. No J3 optimization flag is disabled according to determinant tiling.
  Full and mixed are evaluated separately.
verdict_methods:
- VM-MATH-REFERENCE-001
- VM-ERROR-DISPOSITION-001
