id: NUM-JASTROW-SWCT-DERIVATIVE-MIXED-FIDELITY-001
kind: numerical
name: Jastrow electron derivatives and SWCT divergence retain full analytical fidelity
plain_language: >-
  For the deterministic molecular/periodic J1, J2, AO/MO J3 and combined-Jastrow
  cases and the triclinic SWCT case, each homogeneous electron-coordinate gradient,
  Laplacian or divergence block from the analytical production route in mixed
  precision agrees with the identical route independently rebuilt from the same
  source in full precision at the central parameter_derivative infinity-norm budget.
  Host-materialized blocks must be finite, and a mixed-only perturbation beyond
  the budget must be rejected without modifying the full reference. The independent
  mathematical AD checks retain their existing strict full-precision comparisons.
  Value/debug, finite-difference, parity and invariant checks are unchanged.
verdict_methods: [VM-NUM-MIXED-FIDELITY-001]
required_evidence:
- verdict_method: VM-NUM-MIXED-FIDELITY-001
  nodes:
  - pytest_node: tests/test_jqmc_kernel/test_jastrow.py::TestJastrowPBCAnalytic::test_j1_pbc_analytic_vs_auto
    required_precision_modes: [mixed]
    required_parameter_cases: [{jb_type: exp, triclinic: false}, {jb_type: pade, triclinic: false}, {jb_type: exp, triclinic: true}, {jb_type: pade, triclinic: true}]
    executable_checks:
      mixed-production-vs-full-production:
        site: tests/test_jqmc_kernel/test_jastrow.py::TestJastrowPBCAnalytic.test_j1_pbc_analytic_vs_auto#helper-inequality-1
        comparator: python.inequality
        actual: {role: mixed-analytical-electron-derivative-block, expression: mixed_block}
        reference: {role: full-analytical-electron-derivative-block, expression: full_block}
        precision:
          mixed: {policy: CMP-MIXED-FULL-FIDELITY-001, quantity_class: parameter_derivative}
  - pytest_node: tests/test_jqmc_kernel/test_jastrow.py::TestJastrowPBCAnalytic::test_j2_pbc_analytic_vs_auto
