id: NUM-PUBLIC-REMAINDER-DERIVATIVES-MIXED-FIDELITY-001
kind: numerical
name: Remaining public derivative APIs retain Mixed Full-production fidelity
plain_language: All forty original cases preserve their physical fixtures, seeds, flags, full output fields and
  branch domains. Mixed compares independently loaded same-backend analytical models from one Full-constructed physical
  Hamiltonian and fixed coordinates, separately for each homogeneous quantity/axis/parameter field, under the unchanged
  central parameter_derivative maximum-deviation budget. Joint MO/basis retains its same-policy joint-versus-isolated
  block comparisons and requested-block nonzero controls; DTN retains its alpha/beta/gamma field set; twist/ECP,
  radial and all-electron cases preserve their original topology, block flags and fixture variants. Nonempty finite
  equal shapes and excess-budget rejection remain. Full strict AD and original Full algebra/parity checks retain
  explicit Full-only executable comparisons in MATH-DERIVAPI-CONSISTENCY-001. No new budget, seed, conditioning
  exclusion, skip, production route or numerical algorithm is introduced.
verdict_methods:
- VM-NUM-MIXED-FIDELITY-001
required_evidence:
- verdict_method: VM-NUM-MIXED-FIDELITY-001
  nodes:
  - pytest_node: tests/test_jqmc_kernel/test_jqmc_derivatives.py::test_joint_mo_basis_gradients_match_single_block_and_analytic
    required_precision_modes:
    - mixed
    required_parameter_cases:
