id: NUM-AO-DERIVATIVE-MIXED-FIDELITY-001
kind: numerical
name: AO analytical derivatives retain full-route fidelity in mixed precision
plain_language: 'Molecular and periodic atomic-orbital gradients, Laplacians and directional cell/radial-parameter
  derivatives (including at and near nuclei) produced by the analytical route in mixed precision stay within the
  registered orbital-derivative fidelity budget of the same analytical route built and evaluated independently in
  full precision. Each homogeneous gradient component or Laplacian is judged by its block infinity norm. Full precision
  retains the separate analytical-versus-AD correctness oracle. Every mixed case also injects one out-of-budget
  change and requires the fidelity gate to reject it without modifying the full reference. The standalone spherical
  radial-parameter cases also retain their original selected-block activation predicate in both evaluator callbacks:
  the strict AO tolerance is captured under the mixed entry policy and some derivative component must exceed that
  atol. The AO-by-point shape is required independently from the physical case. Full AD and all other non-AD controls
  remain unchanged.'
verdict_methods: [VM-NUM-MIXED-FIDELITY-001]
required_evidence:
- verdict_method: VM-NUM-MIXED-FIDELITY-001
  nodes:
  - pytest_node: tests/test_jqmc_kernel/test_atomic_orbital.py::TestComputeAOsGradLaplacian::test_AOs_grad_analytic_vs_auto_molecular
    required_precision_modes: [mixed]
    required_parameter_cases:
    - {ao_kind: cart}
    - {ao_kind: sphe}
    executable_checks:
      mixed-production-vs-full-production:
        site: tests/test_jqmc_kernel/test_atomic_orbital.py::TestComputeAOsGradLaplacian.test_AOs_grad_analytic_vs_auto_molecular#helper-inequality-1
        comparator: python.inequality
        actual: {role: mixed-analytical-orbital-derivative-block, expression: mixed_block}
        reference: {role: full-analytical-orbital-derivative-block, expression: full_block}
        precision:
          mixed: {policy: CMP-MIXED-FULL-FIDELITY-001, quantity_class: orbital_derivative}
  - pytest_node: tests/test_jqmc_kernel/test_atomic_orbital.py::TestComputeAOsGradLaplacian::test_AOs_grad_analytic_vs_auto_periodic
