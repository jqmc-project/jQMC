name: Analytical derivatives of the local energy
kind: mathematical
family: e_L
plain_language: The production analytical derivative of the local energy must agree with XLA automatic differentiation in
  the same precision lane for wavefunction parameters, electron positions, ion positions, and strain. The conditioned R02
