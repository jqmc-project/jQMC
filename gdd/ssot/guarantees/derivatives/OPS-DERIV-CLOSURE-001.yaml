  - pytest_node: tests/test_jqmc_kernel/test_analytic_coverage_completion_gate.py::test_mixed_precision_keeps_production_smoke_in_addition_to_autograd_oracles
  - pytest_node: tests/test_jqmc_kernel/test_analytic_coverage_completion_gate.py::test_production_entry_inventory_matches_discovery
  - pytest_node: tests/test_jqmc_kernel/test_analytic_coverage_completion_gate.py::test_production_verification_inventory_is_well_formed
  - pytest_node: tests/test_jqmc_kernel/test_analytic_coverage_completion_gate.py::test_required_analytical_derivative_families_are_finished
  - pytest_node: tests/test_jqmc_kernel/test_analytic_coverage_completion_gate.py::test_required_case_ids_are_unique
  - pytest_node: tests/test_jqmc_kernel/test_analytic_coverage_completion_gate.py::test_gfmc_matrix_retains_independently_required_parameter_sets
