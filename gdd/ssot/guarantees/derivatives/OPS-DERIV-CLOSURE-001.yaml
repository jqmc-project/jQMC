id: OPS-DERIV-CLOSURE-001
verdict_methods:
- VM-OPS-SET-CLOSURE-001
name: Complete derivative evidence chain
kind: operational
plain_language: The derivative evidence chain is closed only when every required finite-difference, XLA analytical,
  mixed-precision, and Rust parity obligation is registered by exactly one collected required test case, and every such
  case emits exactly its registered receipts when it runs.
statement: Derivative completion holds only when the reviewed requirements and actual evidence registrations are one-to-one,
  every required fixture and witness is available, and required precision and proof metadata agree. Statically, the
  node-level registry derives each collected case's receipt keys from its definition and real callspec values with the
  tests' own id helpers; per lane their union over the actual collection must equal the exact universe, whose sha256 is
  pinned (Rust R03/R09 derived from their leaves, Rust obligations equal to XLA), and every key must belong to exactly one
  collected required case; a static checker pins the registry 1:1 to the tests' recorder call sites. At runtime every
  registered case, at teardown, must have emitted exactly its registered receipts, once each, each passing record, FD and
  route validation, or the case fails. Which CI job runs a case is CI configuration, not part of this guarantee.
scope:
  analytical_obligations: 979
  rust_required_obligations: 979
  rust_explicit_na_obligations: 0
  required_guarantees:
  - NUM-DERIV-FD-AUTODIFF-001
  - MATH-DERIV-LOG-WAVEFUNCTION-001
  - MATH-DERIV-LOCAL-ENERGY-001
  - MATH-DERIV-CONVENTIONAL-ALGORITHM-001
  - MATH-DERIV-LOAD-BALANCED-ALGORITHM-001
  - NUM-DERIV-MIXED-001
  - IMPL-DERIV-RUST-XLA-001
