id: MATH-DERIV-CONVENTIONAL-ALGORITHM-001
verdict_methods:
- VM-MATH-AD-ORACLE-001
- VM-MATH-REVIEWED-IDENTITY-001
- VM-REGIME-CONDITIONED-PROOF-001
- VM-ERROR-DISPOSITION-001
name: GFMC/LRDMC conventional-algorithm continuum-measurement derivatives
kind: mathematical
family: e_L_t
plain_language: At novar=0, forces and strain derivatives used by the conventional GFMC/LRDMC algorithm are derivatives
  of the continuum measurement local energy, not of the clipped lattice propagation energy. They must agree with the same-precision
  driver-equivalent XLA automatic-differentiation oracle; the conditioned one-nucleus R02 nuclear component instead uses
  translation invariance while every electron component remains checked against AD.
statement: For every required conventional-algorithm GFMC/LRDMC continuum-measurement local-energy derivative obligation
  at novar=0, the production analytical positions or strain output matches the standalone driver-equivalent JAX automatic-differentiation
  oracle. Propagation clipping, lattice mesh terms, and propagation S-prime are excluded from the differentiated estimator;
  required output liveness, numerical regimes, and refusal behavior remain part of the contract.
scope:
  universe: derivatives.required_cases.v1
  fixture_set: DERIV-FIX-AUTODIFF-ANALYTICAL-001
  family_selector: e_L_t
  expected_obligations: 135
  axes:
  - positions
  - strain
