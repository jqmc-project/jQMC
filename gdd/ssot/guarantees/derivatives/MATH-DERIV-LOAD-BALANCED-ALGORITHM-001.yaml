id: MATH-DERIV-LOAD-BALANCED-ALGORITHM-001
verdict_methods:
- VM-MATH-AD-ORACLE-001
- VM-MATH-REVIEWED-IDENTITY-001
- VM-REGIME-CONDITIONED-PROOF-001
- VM-ERROR-DISPOSITION-001
name: GFMC/LRDMC load-balanced-algorithm continuum-measurement derivatives
kind: mathematical
family: e_L_n
plain_language: At novar=0, forces and strain derivatives used by the load-balanced GFMC/LRDMC algorithm are derivatives
  of the continuum measurement local energy, not of the clipped lattice propagation energy, and must agree with same-precision
  XLA automatic differentiation or the reviewed equality with the conventional-algorithm measurement local energy. The conditioned
  one-nucleus R02 nuclear component uses translation invariance while every electron component remains checked against AD.
statement: For every required load-balanced-algorithm GFMC/LRDMC continuum-measurement local-energy derivative obligation
  at novar=0, the production analytical positions or strain output matches a direct JAX automatic-differentiation oracle
  or the reviewed load-balanced measurement local energy equals the conventional-algorithm measurement local energy identity.
  Propagation clipping, lattice mesh terms, and propagation S-prime are excluded from the differentiated estimator; required
  output liveness, numerical regimes, and refusal behavior remain part of the contract.
