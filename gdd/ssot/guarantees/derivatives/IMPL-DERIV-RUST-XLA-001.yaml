id: IMPL-DERIV-RUST-XLA-001
verdict_methods:
- VM-IMPL-BACKEND-PARITY-001
name: Rust and XLA analytical derivative parity
kind: implementation
plain_language: Rust must implement and match XLA for every one of the 979 XLA analytical derivative obligations. Molecular-affine
  and periodic cell-strain are distinct semantic axes, but both require parity. A missing Rust implementation is a failure.
statement: Every XLA analytical derivative obligation requires one blocking Rust production implementation and parity registration.
  The required Rust set is exactly the XLA universe and is never derived from the implementations currently present in Rust.
  The molecular-affine capability is not a physical stress observable, but that semantic distinction does not weaken implementation
  parity.
