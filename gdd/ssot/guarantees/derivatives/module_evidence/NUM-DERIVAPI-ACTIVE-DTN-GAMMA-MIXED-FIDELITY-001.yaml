id: NUM-DERIVAPI-ACTIVE-DTN-GAMMA-MIXED-FIDELITY-001
kind: numerical
name: Active DTN gamma derivatives preserve independently rebuilt Full analytical fidelity
plain_language: All eight original periodic AE cells and both ln_Psi/e_L quantities use the same fixed PCG64(42)
  candidate configurations 0 and 9. Each walker compares its Mixed analytical gamma block with an independently
  reconstructed Full analytical block at the unchanged central parameter_derivative infinity-norm budget. Policy-dependent
  QE projection caches are cleared before each independent build; both calls use their actual running geminal inverse
  and the full c-axis mask. Gamma-dependent DTN forward arithmetic and AD are float32 in Mixed while the analytical
  parameter derivative is float64; this is not an AO-only precision distinction. All original 27-image active-pair,
  cond_2(G)<700, nonempty, shape, finite and zero-block rejection controls remain. The original same-policy AD block
  is retained only as the reference for the zero-block rejection, at the captured entry-Mixed six-zone medium band
  in both builds. Full retains the original strict mathematical AD test. No input, case, threshold, central budget
  or scientific scope is reduced.
