id: MATH-DERIVAPI-CONSISTENCY-001
kind: mathematical
name: Public derivatives API equals the autodiff oracle
plain_language: 'Every derivative reached through the public flags interface with analytic=True equals the autodiff
  oracle in the precision modes declared for each required evidence node below: forces, stresses, ECP and DTN
  axes, twists, basis optimization, exotic and composite bases, plus JVP-anchored cell derivatives and the
  pinv-referenced resolver. The separate OPS-DERIV-NO-AUTODIFF-001 guarantee owns strict dispatch and the prohibition
  on silent _auto fallback. The one-body and two-body Jastrow parameter gradients are checked in both functional
  forms (exp and pade) on molecular and periodic fixtures. Nodes declaring Full mathematical evidence retain
  their original strict Full comparisons and complete parameter cases; their separately registered numerical
  guarantees require Mixed analytical fidelity to independently constructed Full production. Nodes declaring
  both Full and Mixed mathematical evidence retain both. The molecular public/bridge/legacy-driver nodes retain
  Full mathematical AD and separately require Mixed numerical fidelity under
  NUM-MOLECULAR-PUBLIC-BRIDGE-DRIVER-MIXED-FIDELITY-001. Exact per-node modes, comparison policies, cases and
  references remain defined by the required evidence below and the corresponding numerical guarantees.'
required_evidence:
