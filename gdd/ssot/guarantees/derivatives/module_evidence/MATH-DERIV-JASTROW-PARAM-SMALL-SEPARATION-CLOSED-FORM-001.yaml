    - {geometry: molecular, form: pade, point_count: 1}
    - {geometry: molecular, form: pade, point_count: 12}
    - {geometry: molecular, form: exp, point_count: 1}
    - {geometry: molecular, form: exp, point_count: 12}
    - {geometry: cubic_10bohr, form: pade, point_count: 1}
    - {geometry: cubic_10bohr, form: pade, point_count: 12}
    - {geometry: cubic_10bohr, form: exp, point_count: 1}
    - {geometry: cubic_10bohr, form: exp, point_count: 12}
    executable_checks:
      closed-value-difference:
        site: tests/test_jqmc_kernel/test_jastrow_param_derivative_small_separation.py::test_j2_mesh_difference_switch_drift_and_autodiff_match_closed_form#comparison-1
        comparator: numpy.testing.assert_allclose
        actual: {role: production-one-move-value-quotient, expression: value_quotients}
        reference: {role: decimal-closed-form-value-quotient, expression: closed_values}
        iterations: {variable: scenario, required_values: [tiny, switch]}
        precision:
          full: {policy: CMP-ZONE-ALLCLOSE-STRICT-001, zones: [jastrow_eval]}
          mixed: {policy: CMP-ZONE-ALLCLOSE-STRICT-001, zones: [jastrow_eval]}
      closed-moved-drift:
        site: tests/test_jqmc_kernel/test_jastrow_param_derivative_small_separation.py::test_j2_mesh_difference_switch_drift_and_autodiff_match_closed_form#comparison-2
        comparator: numpy.testing.assert_allclose
        actual: {role: production-moved-drift, expression: moved_drift}
        reference: {role: closed-form-moved-drift, expression: closed_moved_drift}
        iterations: {variable: scenario, required_values: [tiny, switch]}
        precision:
          full: {policy: CMP-ZONE-ALLCLOSE-STRICT-001, zones: [jastrow_grad_lap]}
          mixed: {policy: CMP-ZONE-ALLCLOSE-STRICT-001, zones: [jastrow_grad_lap]}
      closed-spectator-drift:
        site: tests/test_jqmc_kernel/test_jastrow_param_derivative_small_separation.py::test_j2_mesh_difference_switch_drift_and_autodiff_match_closed_form#comparison-3
        comparator: numpy.testing.assert_allclose
        actual: {role: production-spectator-drift, expression: spectator_drift}
        reference: {role: closed-form-spectator-drift, expression: closed_spectator_drift}
        iterations: {variable: scenario, required_values: [tiny, switch]}
        precision:
          full: {policy: CMP-ZONE-ALLCLOSE-STRICT-001, zones: [jastrow_grad_lap]}
          mixed: {policy: CMP-ZONE-ALLCLOSE-STRICT-001, zones: [jastrow_grad_lap]}
      closed-position-jacobian:
        site: tests/test_jqmc_kernel/test_jastrow_param_derivative_small_separation.py::test_j2_mesh_difference_switch_drift_and_autodiff_match_closed_form#comparison-4
        comparator: numpy.testing.assert_allclose
