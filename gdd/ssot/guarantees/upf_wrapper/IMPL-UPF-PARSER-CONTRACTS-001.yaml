id: IMPL-UPF-PARSER-CONTRACTS-001
kind: implementation
name: UPF parsing and basis-initialization contracts
plain_language: UPF v1 text, UPF v2 XML, and gaussinfo sections parse as reviewed; the exponent-init strategy caches, extends
  the basis by default, and honors the shell cap; the hard-coded all-electron hydrogen basis keeps its exact contract; malformed
  input, missing elements, missing sections, and non-hydrogen requests are hard errors.
