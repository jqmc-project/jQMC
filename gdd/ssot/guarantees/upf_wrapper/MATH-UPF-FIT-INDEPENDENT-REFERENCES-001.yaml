  - pytest_node: tests/test_jqmc_kernel/test_upf_wrapper.py::TestUPFWrapper::test_gaussian_radial_overlap_cond_matches_quadrature
  - pytest_node: tests/test_jqmc_kernel/test_upf_wrapper.py::TestUPFWrapper::test_upf_exponent_init_li_fit_quality_and_default_extension
