id: IMPL-UPF-FIT-LSQ-FAILURE-001
kind: implementation
name: An unsuccessful PSWFC least-squares fit is never used
plain_language: fit_pswfc_channel raises PSWFCFitError, carrying the least_squares status, evaluation count and message,
  whenever least_squares does not report success, including the max_nfev limit. The unconverged exponents are never
  turned into a PrimitiveShell.
