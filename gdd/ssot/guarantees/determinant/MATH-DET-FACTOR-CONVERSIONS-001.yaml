id: MATH-DET-FACTOR-CONVERSIONS-001
kind: mathematical
name: Geminal factor conversions and projections
plain_language: 'AO/MO geminal conversions and projections are exact: closed- and open-shell projections, complex bilinear
  round trips, SVD absorption preserving the dense geminal spectrum, and rank-truncation preconditions; out-of-universe
  conversions are rejected explicitly.'
verdict_methods:
- VM-MATH-REVIEWED-IDENTITY-001
- VM-ERROR-DISPOSITION-001
required_evidence:
