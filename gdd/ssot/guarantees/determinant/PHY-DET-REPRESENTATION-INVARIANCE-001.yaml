        site: tests/test_jqmc_kernel/test_determinant.py::TestGeminalAOBasisTransforms.test_geminal_sphe_to_cart_AOs_data#comparison-2
        comparator: numpy.testing.assert_allclose
        actual:
          role: existing-test-actual
          expression: np.asarray(sph)
        reference:
