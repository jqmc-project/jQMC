  - pytest_node: tests/test_jqmc_kernel/test_determinant.py::TestSDData::test_SD_data_cartesian_spherical_conversion_preserves_direct_sd
  - pytest_node: tests/test_jqmc_kernel/test_determinant.py::TestSDData::test_SD_data_complex_bloch_conversion_preserves_direct_sd
  - pytest_node: tests/test_jqmc_kernel/test_determinant.py::TestSDData::test_SD_data_complex_bloch_conversion_time_reversal_false
  - pytest_node: tests/test_jqmc_kernel/test_determinant.py::TestGeminalAOBasisTransforms::test_geminal_sphe_to_cart_AOs_data
