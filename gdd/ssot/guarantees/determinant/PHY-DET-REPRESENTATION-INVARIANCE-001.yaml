id: PHY-DET-REPRESENTATION-INVARIANCE-001
kind: physical
name: Basis-representation invariance of the geminal
plain_language: 'Physics does not depend on the basis representation: spherical/cartesian transforms of the geminal in AO
  and MO representation preserve the wavefunction.'
verdict_methods:
- VM-PHY-INVARIANT-001
required_evidence:
- verdict_method: VM-PHY-INVARIANT-001
