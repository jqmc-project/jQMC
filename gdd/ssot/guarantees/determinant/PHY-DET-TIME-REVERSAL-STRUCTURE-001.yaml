        precision:
          full:
            policy: CMP-SOURCE-CENTRAL-PAIR-001
            pair: TOL-D8-PYTHON-FP64-TIGHT-R-PYTHON-FP64-LOOSE-001
          mixed:
            policy: CMP-SOURCE-CENTRAL-PAIR-001
            pair: TOL-D8-PYTHON-FP64-TIGHT-R-PYTHON-FP64-LOOSE-001
