id: IMPL-DET-FAST-UPDATE-EQUIVALENCE-001
kind: implementation
name: Fast-update equivalence of determinant evaluation
plain_language: 'Every optimized determinant route equals the full recomputation: fast grads/Laplacian vs the fast debug
  twin, row/column updates, rank-1 ratio updates, the fast ln(det) forward/backward path, direct AO streaming-state checks
  without inverse amplification, and the shared production Sherman-Morrison helper over a 150-hop inverse chain against
  a fresh SVD of the same cached AO state in the declared well-conditioned domain.'
verdict_methods:
- VM-IMPL-ROUTE-PARITY-001
required_evidence:
- verdict_method: VM-IMPL-ROUTE-PARITY-001
  nodes:
  - pytest_node: tests/test_jqmc_kernel/test_determinant.py::TestDeterminantFastUpdate::test_compute_grads_and_laplacian_ln_Det_fast_vs_fast_debug
    required_parameter_cases:
    - {trexio_file: H_ae_ccpvdz_cart.h5}
    - {trexio_file: Li_ae_ccpvdz_cart.h5}
    - {trexio_file: H2_ecp_ccpvtz.h5}
    required_precision_modes: [full, mixed]
    executable_checks:
      gradient-up:
        site: tests/test_jqmc_kernel/test_determinant.py::TestDeterminantFastUpdate.test_compute_grads_and_laplacian_ln_Det_fast_vs_fast_debug#comparison-1
        comparator: numpy.testing.assert_allclose
        actual: {role: fast-ln-det-gradient-up, expression: grad_up_fast}
        reference: {role: debug-ln-det-gradient-up, expression: grad_up_debug}
        precision:
          full: {policy: CMP-ZONE-ALLCLOSE-STRICT-001, zones: [ao_eval, det_grad_lap]}
          mixed: {policy: CMP-ZONE-ALLCLOSE-STRICT-001, zones: [ao_eval, det_grad_lap]}
      gradient-down:
        site: tests/test_jqmc_kernel/test_determinant.py::TestDeterminantFastUpdate.test_compute_grads_and_laplacian_ln_Det_fast_vs_fast_debug#comparison-2
        comparator: numpy.testing.assert_allclose
        actual: {role: fast-ln-det-gradient-down, expression: grad_dn_fast}
        reference: {role: debug-ln-det-gradient-down, expression: grad_dn_debug}
        empty_cases:
        - {selector: {trexio_file: H_ae_ccpvdz_cart.h5}, shape: [0, 3]}
        precision:
          full: {policy: CMP-ZONE-ALLCLOSE-STRICT-001, zones: [ao_eval, det_grad_lap]}
          mixed: {policy: CMP-ZONE-ALLCLOSE-STRICT-001, zones: [ao_eval, det_grad_lap]}
      laplacian-up:
        site: tests/test_jqmc_kernel/test_determinant.py::TestDeterminantFastUpdate.test_compute_grads_and_laplacian_ln_Det_fast_vs_fast_debug#comparison-3
        comparator: numpy.testing.assert_allclose
        actual: {role: fast-ln-det-laplacian-up, expression: lap_up_fast}
        reference: {role: debug-ln-det-laplacian-up, expression: lap_up_debug}
        precision:
          full: {policy: CMP-ZONE-ALLCLOSE-STRICT-001, zones: [ao_eval, det_grad_lap]}
          mixed: {policy: CMP-ZONE-ALLCLOSE-STRICT-001, zones: [ao_eval, det_grad_lap]}
      laplacian-down:
        site: tests/test_jqmc_kernel/test_determinant.py::TestDeterminantFastUpdate.test_compute_grads_and_laplacian_ln_Det_fast_vs_fast_debug#comparison-4
