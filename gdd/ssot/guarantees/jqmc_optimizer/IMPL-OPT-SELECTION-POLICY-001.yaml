id: IMPL-OPT-SELECTION-POLICY-001
kind: implementation
name: Coordinate selection and fallback policy
plain_language: Coordinate budgets, scope selection by root consensus, warm-start fingerprints, subfloor freezing with atomic
  complex pairs, LM energy gates, and the ASR fallback follow the reviewed policy, and reduced routes never build the full
  coordinate pencil; cross-term and negative-metric violations are rejected.
verdict_methods:
- VM-IMPL-REVIEWED-CONTRACT-001
- VM-ERROR-DISPOSITION-001
