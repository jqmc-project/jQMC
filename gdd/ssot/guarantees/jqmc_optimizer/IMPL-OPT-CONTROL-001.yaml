id: IMPL-OPT-CONTROL-001
kind: implementation
name: Optimizer control-flow contracts
plain_language: The device reduction route follows from the communicators (a world-spanning sampler uses the device
  collectives, a multi-rank twist sampler the host-staged MPI CG, and the removed use_device_collectives option raises
  TypeError), the twist driver forwards the device-optimizer request unchanged, and world-atomic step acceptance,
  zero-step no-ops, non-finite energy handling and batch lifecycle follow the reviewed control contract; the progress
  guard raises instead of retrying.
verdict_methods:
- VM-IMPL-REVIEWED-CONTRACT-001
- VM-ERROR-DISPOSITION-001
