id: IMPL-OPT-BASIS-BLOCKS-001
kind: implementation
name: AO-basis variational block contracts
plain_language: Basis exponents and coefficients are numpy-stored, propagate correctly into J3 and geminal properties and
  updates, and the basis blocks are per shell without symmetrization.
verdict_methods:
- VM-IMPL-REVIEWED-CONTRACT-001
required_evidence:
- verdict_method: VM-IMPL-REVIEWED-CONTRACT-001
  nodes:
  - pytest_node: tests/test_jqmc_kernel/test_ao_basis_optimization.py::TestAOBasisOptimizationMisc::test_exponents_coefficients_storage_is_numpy
  - pytest_node: tests/test_jqmc_kernel/test_basis_update_storage.py::test_basis_update_preserves_raw_fp64_storage
    required_precision_modes: [full, mixed]
    required_parameter_cases:
    - {filename: H2_ae_ccpvdz_cart.h5, parameter: exp, owner: ao}
    - {filename: H2_ae_ccpvdz_sphe.h5, parameter: exp, owner: ao}
    - {filename: H2_ae_ccpvdz_cart.h5, parameter: coeff, owner: ao}
    - {filename: H2_ae_ccpvdz_sphe.h5, parameter: coeff, owner: ao}
    - {filename: H2_ae_ccpvdz_cart.h5, parameter: exp, owner: geminal}
    - {filename: H2_ae_ccpvdz_sphe.h5, parameter: exp, owner: geminal}
    - {filename: H2_ae_ccpvdz_cart.h5, parameter: coeff, owner: geminal}
    - {filename: H2_ae_ccpvdz_sphe.h5, parameter: coeff, owner: geminal}
    - {filename: H2_ae_ccpvdz_cart.h5, parameter: exp, owner: j3}
    - {filename: H2_ae_ccpvdz_sphe.h5, parameter: exp, owner: j3}
    - {filename: H2_ae_ccpvdz_cart.h5, parameter: coeff, owner: j3}
    - {filename: H2_ae_ccpvdz_sphe.h5, parameter: coeff, owner: j3}
    executable_checks:
      raw-storage-dtypes:
        site: tests/test_jqmc_kernel/test_basis_update_storage.py::_check_raw_storage#exact-comparison-1
        comparator: numpy.testing.assert_array_equal
        actual: {role: raw-model-array-kind-and-width, expression: actual_dtypes}
        reference: {role: numpy-fp64-model-storage, expression: expected_dtypes}
        precision:
          full: {policy: CMP-EXACT-VALUES-001}
          mixed: {policy: CMP-EXACT-VALUES-001}
      exact-publication:
        site: tests/test_jqmc_kernel/test_basis_update_storage.py::_check_raw_storage#exact-comparison-2
        comparator: numpy.testing.assert_array_equal
        actual: {role: raw-published-basis-parameters, expression: actual_values}
        reference: {role: supplied-optimizer-basis-parameters, expression: expected_values}
        precision:
          full: {policy: CMP-EXACT-VALUES-001}
          mixed: {policy: CMP-EXACT-VALUES-001}
  - pytest_node: tests/test_jqmc_kernel/test_basis_update_storage.py::test_basis_storage_contract_rejects_lossy_delegation
    required_precision_modes: [full, mixed]
    required_parameter_cases:
    - {parameter: exp, owner: ao}
    - {parameter: coeff, owner: ao}
    - {parameter: exp, owner: geminal}
    - {parameter: coeff, owner: geminal}
    - {parameter: exp, owner: j3}
    - {parameter: coeff, owner: j3}
  - pytest_node: tests/test_jqmc_kernel/test_ao_basis_optimization.py::TestAOBasisOptimizationMisc::test_j3_ao_properties_with_ao_data
  - pytest_node: tests/test_jqmc_kernel/test_ao_basis_optimization.py::TestAOBasisOptimizationMisc::test_j3_ao_properties_with_mo_data
  - pytest_node: tests/test_jqmc_kernel/test_ao_basis_optimization.py::TestAOBasisOptimizationMisc::test_j3_with_updated_ao_exponents
