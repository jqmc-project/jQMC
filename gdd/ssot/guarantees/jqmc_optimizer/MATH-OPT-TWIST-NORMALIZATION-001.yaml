id: MATH-OPT-TWIST-NORMALIZATION-001
kind: mathematical
name: Separately normalized fixed-weight twist optimization
plain_language: Shared force and SR geometry differentiate the fixed-weight sum of independently normalized twist energies.
  Constant per-twist Hamiltonians give zero force and zero SR/LM/aSR updates despite different log-derivative means. Nonconstant
  diagonal Hamiltonians match an independent normalized-objective derivative, including unequal or zero BZ weights and unequal
  sample multiplicities. Twist normalization gauges and independent energy origins do not change updates. Shared force errors
  combine within-twist jackknives in weighted quadrature.
verdict_methods:
- VM-MATH-REVIEWED-IDENTITY-001
- VM-MATH-REFERENCE-001
required_evidence:
- verdict_method: VM-MATH-REVIEWED-IDENTITY-001
  nodes:
