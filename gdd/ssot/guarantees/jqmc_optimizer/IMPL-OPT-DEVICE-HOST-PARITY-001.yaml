id: IMPL-OPT-DEVICE-HOST-PARITY-001
kind: implementation
name: JAX-native/host optimizer code-path parity
plain_language: 'On identical inputs, the JAX-native SR/LM implementation routes agree with the NumPy/SciPy/mpi4py host
  implementation routes within the existing comparison contracts: wide and tall, direct and CG, streaming and staged,
  single and multi rank. The guarantee applies to the backend actually exercised by the evidence;
  it does not certify execution on GPU hardware.'
verdict_methods:
- VM-IMPL-ROUTE-PARITY-001
required_evidence:
- verdict_method: VM-IMPL-ROUTE-PARITY-001
