id: IMPL-TILING-NATIVE-LRDMC-001
kind: implementation
name: Native tiled LRDMC projection measurements and sector restart
plain_language: >-
  Actual Rust LRDMC-n and LRDMC-t projection batches execute with force and
  stress enabled for PW, B-spline, Cartesian and spherical pGTO, and both
  PW+pGTO composite variants. Finite J1/J2 and independent supercell J3 with
  cross-cell M, and finite DTN, are separate required families. Restricted
  and independent-spin committed QE/TREXIO ECP sources cover Gamma, general
  supertwist and a nonuniform two-sector twist ensemble. Cartesian composite
  fixtures explicitly add a nonzero PW child after TREXIO conversion.
  HDF5 checkpoint continuation preserves walker coordinates, RNG, energy,
  weights and force/stress histories, as well as logical shared payloads.
  At identical configurations the continuum T-move measurement energy and
  every atomic and raw strain derivative agree with ordinary explicit
  supercell orbitals. XLA analytical derivatives agree with autograd, and
  Rust analytical derivatives agree with XLA, including Pulay terms. Sector
  and weighted aggregate comparisons are required. Native method counters,
  actual force/stress flags and evaluator guards reject silent XLA fallback.
  Both precisions are required. This contract uses single-rank Ewald,
  T-move and no SWCT; it does not certify statistical convergence or every
  independent LRDMC algorithm option.
verdict_methods: [VM-IMPL-BACKEND-PARITY-001]
contract_authority: cutover
cutover_requirement: blocking
