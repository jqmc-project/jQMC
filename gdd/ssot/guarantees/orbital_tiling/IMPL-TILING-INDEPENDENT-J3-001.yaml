id: IMPL-TILING-INDEPENDENT-J3-001
kind: implementation
name: Independent supercell J3 is admitted, sampled, converted and selected on the command line with tiled determinants
plain_language: >-
  With a frozen tiled determinant, independent AO and MO supercell J3 providers admit both basis-optimization flags at
  the gradient-mask, block-publication and MCMC parameter-selection boundaries; this admission contract does not certify
  basis-update or persistence correctness. Single-rank XLA MCMC with a nonzero supercell J3 performs a J3-only SR update
  and resumes its RNG streams from the checkpoint. The QE tiling converter, on synthetic source and UPF seeds, assembles
  common Slater k blocks and a separate UPF-seeded supercell J3 basis for each J3 choice. The CLI and workflow pass one
  quoted matrix of three diagonal or nine row-major integers to the converter as one option value, and malformed
  matrices fail before converter work starts. Native drivers, MPI restart, J3 basis optimization and twist averaging
  are not certified here.
verdict_methods: [VM-IMPL-REVIEWED-CONTRACT-001, VM-ERROR-DISPOSITION-001]
contract_authority: cutover
cutover_requirement: blocking
required_evidence:
- verdict_method: VM-IMPL-REVIEWED-CONTRACT-001
  nodes:
  - pytest_node: tests/test_jqmc_kernel/test_orbital_tiling_j3.py::test_tiled_j3_basis_flags_are_admitted
    required_precision_modes: [full, mixed]
    required_parameter_cases:
    - {flag: opt_J3_basis_exp, mo: false}
    - {flag: opt_J3_basis_coeff, mo: false}
    - {flag: opt_J3_basis_exp, mo: true}
    - {flag: opt_J3_basis_coeff, mo: true}
  - pytest_node: tests/test_jqmc_kernel/test_orbital_tiling_j3.py::test_j3_tiled_mcmc_checkpoint_continuation
    required_precision_modes: [full, mixed]
    required_parameter_cases: [{}]
  - pytest_node: tests/test_jqmc_kernel/test_orbital_tiling_j3.py::test_qe_tiling_converter_uses_independent_supercell_j3
    required_precision_modes: [full, mixed]
    required_parameter_cases: [{choice: none}, {choice: ao-small}, {choice: ao-full}]
  - pytest_node: tests/test_jqmc_kernel/test_orbital_tiling_j3.py::test_cli_tiling_matrix_is_one_argument
    required_precision_modes: [full, mixed]
    required_parameter_cases: [{matrix: "3 3 3"}, {matrix: "2 1 1 1 1 1 3 2 1"}]
- verdict_method: VM-ERROR-DISPOSITION-001
  nodes:
  - pytest_node: tests/test_jqmc_kernel/test_orbital_tiling_j3.py::test_cli_tiling_rejects_malformed_matrix
    required_precision_modes: [full, mixed]
    required_parameter_cases: [{matrix: "2 2"}, {matrix: "2.5 1 1"}, {matrix: "0 1 1"}]
