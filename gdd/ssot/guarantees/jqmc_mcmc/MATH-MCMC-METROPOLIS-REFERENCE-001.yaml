id: MATH-MCMC-METROPOLIS-REFERENCE-001
kind: mathematical
name: Fixed-input Metropolis probabilities and carried states
plain_language: >-
  Four consecutive actual XLA Metropolis moves must match independent
  full-recomputed determinant/J2 weights, SVD-based AS factors and nuclear
  image enumeration for forward/reverse proposal densities. Require both
  spins on molecular H2 AE, water ECP and non-Gamma Li ECP, plus the empty-down
  H AE kernel. Two additional Li inputs must cross a periodic cell face.
  PCG64 seed 2025 supplies one normal*0.5 configuration, without cond(G)
  screening or reselection; the face inputs set the moved electron's first
  fractional coordinate to -0.01. J2 exp parameter is 0.5. Fixed normal
  draws have magnitude 0.4, signs +,-,+,+ and axes 0,1,2,0; H begins outward.
  Uniform draws alternate 0.2/0.8; require both starting draws and AS 0/1.
  Compare probabilities, positions, saved G and its carried inverse at
  same-mode det_eval/wf_eval strict tolerances. The independent full-pair
  J2 formula uses the active jastrow_ratio zone, not jastrow_eval totals
  or a different precision configuration. Decisions and observer-on/off
  state values must be exact. Dropping proposal, Jastrow, AS or conjugation
  factors must fail after a passing baseline. This is deterministic
  fixed-input composition and finite-chain state accuracy, not a
  statistical distribution test or arbitrary-condition stability proof.
verdict_methods: [VM-MATH-REFERENCE-001]
required_evidence:
- verdict_method: VM-MATH-REFERENCE-001
  nodes:
  - pytest_node: tests/test_jqmc_kernel/test_mcmc_acceptance_reference.py::test_xla_acceptance_and_carried_state_match_full_recompute
    required_precision_modes: [full, mixed]
    required_parameter_cases:
    - {filename: H2_ae_ccpvdz_cart.h5, spin: up, normal: 0.4, cell_face: false, epsilon: 0.0, draw: 0.2}
    - {filename: H2_ae_ccpvdz_cart.h5, spin: down, normal: 0.4, cell_face: false, epsilon: 0.0, draw: 0.2}
    - {filename: water_ccecp_ccpvqz.h5, spin: up, normal: 0.4, cell_face: false, epsilon: 0.0, draw: 0.2}
    - {filename: water_ccecp_ccpvqz.h5, spin: down, normal: 0.4, cell_face: false, epsilon: 0.0, draw: 0.2}
    - {filename: lithium_k025.h5, spin: up, normal: 0.4, cell_face: false, epsilon: 0.0, draw: 0.2}
    - {filename: lithium_k025.h5, spin: down, normal: 0.4, cell_face: false, epsilon: 0.0, draw: 0.2}
    - {filename: H_ae_ccpvdz_cart.h5, spin: up, normal: -0.4, cell_face: false, epsilon: 0.0, draw: 0.2}
    - {filename: lithium_k025.h5, spin: up, normal: 0.4, cell_face: true, epsilon: 0.0, draw: 0.2}
    - {filename: lithium_k025.h5, spin: down, normal: 0.4, cell_face: true, epsilon: 0.0, draw: 0.2}
    - {filename: H2_ae_ccpvdz_cart.h5, spin: up, normal: 0.4, cell_face: false, epsilon: 1.0, draw: 0.2}
    - {filename: H2_ae_ccpvdz_cart.h5, spin: down, normal: 0.4, cell_face: false, epsilon: 1.0, draw: 0.2}
    - {filename: water_ccecp_ccpvqz.h5, spin: up, normal: 0.4, cell_face: false, epsilon: 1.0, draw: 0.2}
    - {filename: water_ccecp_ccpvqz.h5, spin: down, normal: 0.4, cell_face: false, epsilon: 1.0, draw: 0.2}
