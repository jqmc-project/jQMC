id: IMPL-MCMC-LU-FIRST-SEED-REFRESH-INVERSE-001
kind: implementation
name: The guarded LU walker-batch seed/refresh inverse equals the equilibrated pseudo-inverse where LU is unsafe
plain_language: >-
  On every backend the walker batch of seed and carried-inverse refresh inverses (jqmc_mcmc._geminal_pinv_batched, used by
  the MCMC seed and refresh and the GFMC_t / GFMC_n projection seeds) is the LU inverse of the
  power-of-two-equilibrated geminal. A walker keeps it when it is finite and its scale-free probe residual
  max|A (Y P) - P| on the equilibrated matrix is at most GEMINAL_LU_GUARD_RESIDUAL_THRESHOLD; any other walker
  gets the equilibrated SVD pseudo-inverse. On the committed all-electron UHF N geminal with
  one regular walker and two far-electron graded walkers, every walker keeps the LU inverse, equal to the
  per-walker pseudo-inverse at the det_eval strict pair, and the rank-1 ratios of a 0.3 bohr inward move of the
  first up and first down electron equal the fresh determinant ratios at the det_ratio strict pair. A walker with
  an exactly zero row or column, a duplicated row or column, a linearly dependent row, a rank N-2 product, a
  near-duplicate row, an all-zero matrix or a subnormal row gets the pseudo-inverse bit for bit, the output is
  finite, and the healthy walkers of the same batch keep their LU inverse bit for bit (real and complex
  geminals). With the pseudo-inverse equilibration exponents clipped to GEMINAL_EQUILIBRATION_MAX_EXPONENT (the LU
  keeps the full range) the inverse of a geminal with a far up and a far down electron (one row and one column of
  order 1e-200) or a subnormal row is finite with G X G = G at the det_eval strict relative tolerance. Invertible
  row-graded geminals with condition numbers up to 1e10 keep the LU inverse, and a walker with one row of order
  1e-200 keeps the exact LU inverse (its inverse column of order 1e200 is representable). Full and mixed are
  judged separately.
verdict_methods:
