id: IMPL-MCMC-DEBUG-PRODUCTION-001
kind: implementation
name: Debug/production parity of the MCMC driver
plain_language: The production MCMC driver equals the _MCMC_debug oracle on w_L, e_L, e_L^2, force, and stress estimators,
  and the LM and stress assembly kernels equal their debug twins. Mixed XLA MCMC additionally has an end-to-end stochastic-trajectory
  witness on an explicitly screened well-conditioned 2x2 open-shell determinant with J1+J2+J3; final walkers, PRNG state,
  acceptance decisions, weights, and local-energy observables are compared.
verdict_methods:
- VM-IMPL-ROUTE-PARITY-001
required_evidence:
- verdict_method: VM-IMPL-ROUTE-PARITY-001
  nodes:
  - pytest_node: tests/test_jqmc_kernel/test_jqmc_mcmc.py::TestMCMCDriver::test_jqmc_mcmc
