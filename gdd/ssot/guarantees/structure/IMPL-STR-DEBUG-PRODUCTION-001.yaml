id: IMPL-STR-DEBUG-PRODUCTION-001
kind: implementation
name: Debug/production route parity of structure utilities
plain_language: The MIC and image-list production routes equal their debug twins, numpy and JAX paths agree, and the nearest-index
  helper equals the minimum-distance search.
verdict_methods:
- VM-IMPL-ROUTE-PARITY-001
required_evidence:
- verdict_method: VM-IMPL-ROUTE-PARITY-001
  nodes:
  - pytest_node: tests/test_jqmc_kernel/test_structure.py::TestStructureMIC::test_general_mic_production_vs_debug
    required_precision_modes:
    - full
    - mixed
    required_parameter_cases:
    - cell_name: cubic_10bohr
    - cell_name: primitive_fcc_si
    - cell_name: triclinic_skewed
    executable_checks:
      comparison-1:
        site: tests/test_jqmc_kernel/test_structure.py::TestStructureMIC.test_general_mic_production_vs_debug#comparison-1
        comparator: numpy.testing.assert_allclose
        actual:
          role: production-minimum-image
          expression: got
        reference:
          role: numpy-image-loop
          expression: ref
        precision:
          full:
            policy: CMP-ZONE-ALLCLOSE-STRICT-001
            zones:
            - local_energy
          mixed:
            policy: CMP-ZONE-ALLCLOSE-STRICT-001
            zones:
            - local_energy
