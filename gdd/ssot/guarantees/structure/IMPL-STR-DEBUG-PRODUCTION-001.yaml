  - pytest_node: tests/test_jqmc_kernel/test_structure.py::TestStructureBasics::test_np_jnp_consistency_non_pbc
    executable_checks:
      comparison-1:
        site: tests/test_jqmc_kernel/test_structure.py::TestStructureBasics.test_np_jnp_consistency_non_pbc#comparison-1
        comparator: numpy.testing.assert_allclose
        actual:
          role: numpy-structure-position
          expression: structure._positions_cart_np
        reference:
          role: jax-same-molecular-geometry
          expression: np.asarray(structure._positions_cart_jnp)
        precision:
          full:
            policy: CMP-ZONE-ALLCLOSE-STRICT-001
            zones:
            - local_energy
          mixed:
            policy: CMP-ZONE-ALLCLOSE-STRICT-001
            zones:
            - local_energy
