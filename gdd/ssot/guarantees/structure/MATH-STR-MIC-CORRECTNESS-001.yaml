id: MATH-STR-MIC-CORRECTNESS-001
kind: mathematical
name: Minimum-image convention correctness
plain_language: 'The shared MIC equals brute-force enumeration (mathematical), the orthorhombic general path
  equals the parallelepiped wrap, the parallelepiped helper is provably distinct from Wigner-Seitz on oblique cells, distance
  derivatives away from seams are the Euclidean closed form, and the face probe resolves the expected one-sided gradient
  jump as the reviewed negative control.'
verdict_methods:
- VM-MATH-REFERENCE-001
- VM-MATH-REVIEWED-IDENTITY-001
required_evidence:
- verdict_method: VM-MATH-REFERENCE-001
