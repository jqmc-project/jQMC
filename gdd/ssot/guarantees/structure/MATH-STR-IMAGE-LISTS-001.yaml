      diffuse-s:
        site: tests/test_jqmc_kernel/test_structure.py::TestStructureImageList.test_primitive_image_list_grows_with_higher_L#exact-comparison-3
        comparator: numpy.testing.assert_array_equal
        actual:
          role: complete-production-image-set
          expression: sorted_indices(images_l0_diff)
        reference:
          role: independent-active-set-enumeration
          expression: independent_image_indices(cell, 0.05, 0, ATOL_PYTHON_FP64_LOOSE) @ np.asarray(cell)
        precision:
          full:
            policy: CMP-EXACT-VALUES-001
          mixed:
            policy: CMP-EXACT-VALUES-001
      diffuse-p:
        site: tests/test_jqmc_kernel/test_structure.py::TestStructureImageList.test_primitive_image_list_grows_with_higher_L#exact-comparison-4
        comparator: numpy.testing.assert_array_equal
        actual:
          role: complete-production-image-set
          expression: sorted_indices(images_l1_diff)
        reference:
          role: independent-active-set-enumeration
