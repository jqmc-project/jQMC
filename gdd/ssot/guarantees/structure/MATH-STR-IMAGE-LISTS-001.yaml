id: MATH-STR-IMAGE-LISTS-001
kind: mathematical
name: Image-list structure
plain_language: Primitive image lists contain the origin image, grow monotonically with diffuse exponents and higher angular
  momentum, return int64 indices, and the per-atom lists keep exactly the locality-consistent subsets (center, corner, face,
  diffuse recovery).
verdict_methods:
- VM-MATH-REVIEWED-IDENTITY-001
required_evidence:
- verdict_method: VM-MATH-REVIEWED-IDENTITY-001
  nodes:
  - pytest_node: tests/test_jqmc_kernel/test_structure.py::TestStructureImageList::test_primitive_image_list_contains_T0
    required_precision_modes:
    - full
    - mixed
    required_parameter_cases:
    - cell_name: cubic_10bohr
    - cell_name: primitive_fcc_si
    - cell_name: triclinic_skewed
    executable_checks:
      origin-membership:
        site: tests/test_jqmc_kernel/test_structure.py::TestStructureImageList.test_primitive_image_list_contains_T0#exact-comparison-1
        comparator: numpy.testing.assert_array_equal
        actual:
          role: nearest-production-image
          expression: origin
        reference:
          role: origin-image
          expression: expected_origin
        precision:
          full:
            policy: CMP-EXACT-VALUES-001
          mixed:
            policy: CMP-EXACT-VALUES-001
  - pytest_node: tests/test_jqmc_kernel/test_structure.py::TestStructureImageList::test_primitive_image_list_grows_with_diffuse_exponent
    executable_checks:
      compact:
        site: tests/test_jqmc_kernel/test_structure.py::TestStructureImageList.test_primitive_image_list_grows_with_diffuse_exponent#exact-comparison-1
        comparator: numpy.testing.assert_array_equal
        actual:
          role: complete-production-image-set
          expression: sorted_indices(images_compact)
        reference:
          role: independent-active-set-enumeration
          expression: independent_image_indices(cell, 5.0, 0, AO_IMAGE_TRUNCATION_ATOL) @ np.asarray(cell)
        precision:
          full:
            policy: CMP-EXACT-VALUES-001
          mixed:
            policy: CMP-EXACT-VALUES-001
      diffuse:
        site: tests/test_jqmc_kernel/test_structure.py::TestStructureImageList.test_primitive_image_list_grows_with_diffuse_exponent#exact-comparison-2
        comparator: numpy.testing.assert_array_equal
        actual:
          role: complete-production-image-set
          expression: sorted_indices(images_diffuse)
        reference:
          role: independent-active-set-enumeration
          expression: independent_image_indices(cell, 0.1, 0, AO_IMAGE_TRUNCATION_ATOL) @ np.asarray(cell)
        precision:
          full:
            policy: CMP-EXACT-VALUES-001
          mixed:
            policy: CMP-EXACT-VALUES-001
  - pytest_node: tests/test_jqmc_kernel/test_structure.py::TestStructureImageList::test_primitive_image_list_grows_with_higher_L
    executable_checks:
      moderate-s:
        site: tests/test_jqmc_kernel/test_structure.py::TestStructureImageList.test_primitive_image_list_grows_with_higher_L#exact-comparison-1
        comparator: numpy.testing.assert_array_equal
        actual:
          role: complete-production-image-set
          expression: sorted_indices(images_l0_mod)
        reference:
          role: independent-active-set-enumeration
          expression: independent_image_indices(cell, 1.0, 0, AO_IMAGE_TRUNCATION_ATOL) @ np.asarray(cell)
        precision:
          full:
            policy: CMP-EXACT-VALUES-001
          mixed:
            policy: CMP-EXACT-VALUES-001
      moderate-p:
        site: tests/test_jqmc_kernel/test_structure.py::TestStructureImageList.test_primitive_image_list_grows_with_higher_L#exact-comparison-2
        comparator: numpy.testing.assert_array_equal
