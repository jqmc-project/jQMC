id: IMPL-OPTK-DEVICE-STREAMING-SR-CONTIGUOUS-001
kind: implementation
name: Contiguous device streaming SR equals the dense route and is reproducible
plain_language: >-
  The device streaming SR (compute_device_sr_real_target) centers every bounded sample block but the last in place
  into one contiguous coordinate-by-sample matrix (prepare_local_device_sr_samples_into) and keeps the last block as a
  tail. The in-place block writer equals the per-block preparation; the temporary-free chunked wide and tall CG
  operators on a contiguous head plus a tail equal the direct solves on the same pieces for real and complex samples;
  the streaming wide and tall SR solutions equal the dense oracle within the C9 SR-update tolerance for a tail-only,
  tall and wide (one- and two-block head) sample count and are bit-identical between two runs; frozen coordinates keep
  the contiguous route. Full and mixed are judged separately.
verdict_methods: [VM-IMPL-ROUTE-PARITY-001]
required_evidence:
- verdict_method: VM-IMPL-ROUTE-PARITY-001
  nodes:
  - pytest_node: tests/test_jqmc_kernel/test_optimizer_streaming_sr_contiguous.py::test_prepare_into_writes_the_per_block_centered_samples_in_place
    required_precision_modes: [full, mixed]
    required_parameter_cases: [{}]
  - pytest_node: tests/test_jqmc_kernel/test_optimizer_streaming_sr_contiguous.py::test_temporary_free_chunk_operators_match_direct_and_one_contiguous_piece
    required_precision_modes: [full, mixed]
    required_parameter_cases:
    - {complex_: true}
    - {complex_: false}
  - pytest_node: tests/test_jqmc_kernel/test_optimizer_streaming_sr_contiguous.py::test_streaming_device_sr_matches_dense_oracle_and_is_reproducible
    required_precision_modes: [full, mixed]
    required_parameter_cases:
    - {samples: 64}
    - {samples: 1100}
    - {samples: 1500}
    - {samples: 2600}
  - pytest_node: tests/test_jqmc_kernel/test_optimizer_streaming_sr_contiguous.py::test_streaming_device_sr_frozen_coordinates_keep_contiguous_route
    required_precision_modes: [full, mixed]
    required_parameter_cases: [{}]
