id: MATH-OPTK-SOLVER-GROUND-TRUTH-001
kind: mathematical
name: Ground-truth agreement of the SR and LM solvers
plain_language: 'The linear-method step matches a dense generalized eigenproblem, the production SR solvers match the
  dense solution of the real-coordinate system Re(X X^dagger) + epsilon I (the direct host and device routes to the exact
  solution of their fp64 inputs, every CG route to the dense solution within its stopping residual, and the wide CG to the
  direct solve for complex and real-valued complex samples), and the ASR scalars match their pinned references
  (mathematical).'
verdict_methods:
- VM-MATH-REFERENCE-001
required_evidence:
- verdict_method: VM-MATH-REFERENCE-001
  nodes:
  - pytest_node: tests/test_jqmc_kernel/test_complex_opt_gt_linear_method.py::TestT3LinearMethod::test_lm_step_matches_dense_generalized_eig
    executable_checks:
      d8-n-333:
        site: tests/test_jqmc_kernel/test_complex_opt_gt_linear_method.py::TestT3LinearMethod.test_lm_step_matches_dense_generalized_eig#comparison-3
        comparator: numpy.testing.assert_allclose
        actual:
          role: source-computed-value
          expression: _rayleigh_quotient(H_bar, S_bar, np.asarray(c_vec, dtype=np.complex128))
        reference:
