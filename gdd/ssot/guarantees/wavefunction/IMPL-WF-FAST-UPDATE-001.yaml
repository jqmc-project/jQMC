id: IMPL-WF-FAST-UPDATE-001
kind: implementation
name: Fast and streaming evaluation equivalence
plain_language: The fast kinetic update, the fast ln psi forward and backward paths, the streaming kinetic state (steps,
  drift accumulation, edge cases, DTN advance, Jastrow combinations, walker-axis vmap), and the streaming J3 dispatches
  all equal the full recomputation. The 150-hop adversarial near-node chain must actually enter the ill-conditioned regime
  while keeping the derived mesh elements finite and preventing the streaming state from amplifying an oracle hopping rate
  computed from the same carried inverse and determinant-ratio state. The chain runs the production per-hop refresh rule of
  the GFMC_t and GFMC_n projection bodies. After every Sherman-Morrison update the carried inverse is screened by
  the probe residual against the geminal of the post-hop caches and rebuilt from scratch when the residual exceeds
  SM_INVERSE_REFRESH_RESIDUAL_THRESHOLD; the chain refreshes at least once, and in full precision its streamed mesh elements
  equal the independent full recompute (no carried inverse, no carried state) on every hop the existing conditioning screen
  accepts, of which there is at least one.
verdict_methods:
- VM-IMPL-ROUTE-PARITY-001
required_evidence:
- verdict_method: VM-IMPL-ROUTE-PARITY-001
  nodes:
  - pytest_node: tests/test_jqmc_kernel/test_lrdmc_mesh_chain_consistency.py::test_streaming_mesh_elements_track_oracle_over_adversarial_chain
