        actual:
          role: existing-test-actual
          expression: K_elements_up_auto
        reference:
          role: existing-test-reference
          expression: K_elements_up_analytic
        precision:
          full:
            policy: CMP-ZONE-ALLCLOSE-STRICT-001
            zones:
            - ao_eval
            - jastrow_eval
            - jastrow_grad_lap
            - wf_kinetic
      comparison-2:
        site: tests/test_jqmc_kernel/test_wave_function.py::TestKineticEnergyConsistency.test_auto_and_analytic_kinetic_energy_all_elements#comparison-3
        comparator: numpy.testing.assert_allclose
        actual:
          role: existing-test-actual
          expression: K_elements_dn_auto
        reference:
