id: MATH-WF-KINETIC-DERIVATIVE-CONSISTENCY-001
kind: mathematical
name: Derivative consistency of the kinetic energy
plain_language: The analytical kinetic energy equals the autodiff oracle for the molecular and periodic evaluators, in scalar
  and all-elements form.
verdict_methods:
- VM-MATH-AD-ORACLE-001
required_evidence:
- verdict_method: VM-MATH-AD-ORACLE-001
  nodes:
  - pytest_node: tests/test_jqmc_kernel/test_wave_function.py::TestKineticEnergyConsistency::test_kinetic_energy_analytic_and_auto
    required_precision_modes: [full]
    required_parameter_cases:
    - trexio_file: water_ccecp_ccpvqz.h5
    - trexio_file: H2_ae_ccpvdz_cart.h5
    - trexio_file: N_ae_ccpvdz_cart.h5
    executable_checks:
      comparison-1:
        site: tests/test_jqmc_kernel/test_wave_function.py::TestKineticEnergyConsistency.test_kinetic_energy_analytic_and_auto#comparison-2
        comparator: numpy.testing.assert_allclose
        actual:
          role: existing-test-actual
          expression: K_analytic
        reference:
          role: existing-test-reference
          expression: K_auto
        precision:
          full:
            policy: CMP-ZONE-ALLCLOSE-STRICT-001
            zones:
            - ao_eval
            - jastrow_eval
            - jastrow_grad_lap
            - wf_kinetic
  - pytest_node: tests/test_jqmc_kernel/test_wave_function.py::TestKineticEnergyConsistency::test_auto_and_analytic_kinetic_energy_all_elements
    required_precision_modes: [full]
    required_parameter_cases:
