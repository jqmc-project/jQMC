id: IMPL-LRDMC-MESH-RNG-SEPARATION-001
kind: implementation
name: Independent kinetic and ECP random-mesh streams
plain_language: At finite lattice spacing, the kinetic lattice and the non-local ECP quadrature must not share one orientation.
  The kinetic stream uses the interval rotation key itself, the ECP stream is a deterministic independent Threefry child,
  and neither key is threaded back into the GFMC carry, so the move-key schedule does not depend on the split. Every conventional/load-balanced XLA call site is pinned to its designated
  rotation, including dormant full-recompute branches; Rust conventional/load-balanced intervals must equal the corresponding
  XLA reference on both tmove and dltmove, with a water ECP case that demonstrably changes when the two orientations are
  incorrectly coupled.
verdict_methods:
- VM-IMPL-REVIEWED-CONTRACT-001
- VM-IMPL-BACKEND-PARITY-001
required_evidence:
- verdict_method: VM-IMPL-REVIEWED-CONTRACT-001
  nodes:
  - pytest_node: tests/test_jqmc_kernel/test_lrdmc_mesh_semantics.py::test_kinetic_and_ecp_rotation_streams_are_distinct_and_deterministic
  - pytest_node: tests/test_jqmc_kernel/test_lrdmc_mesh_semantics.py::test_xla_lrdmc_production_wires_kinetic_and_ecp_rotations_separately
- verdict_method: VM-IMPL-BACKEND-PARITY-001
  nodes:
