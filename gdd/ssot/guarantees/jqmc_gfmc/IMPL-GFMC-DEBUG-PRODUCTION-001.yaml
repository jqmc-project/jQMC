id: IMPL-GFMC-DEBUG-PRODUCTION-001
kind: implementation
name: GFMC same-input algorithm and debug-twin guarantees
plain_language: The load-balanced GFMC_n driver agrees with full-recompute leaves at every actual hop and measurement
  input. Its categorical choices exactly invert its own numerically checked CDF; every key and population carry,
  measurement moment, historical weight product, energy-shift update and fixed-sample energy/variance/force estimate
  is checked. Observation must not change the real driver outputs. The original fixture cases, seed 3446, two
  walkers per rank, forty ten-hop intervals and full/mixed strict/medium policies are retained. Force leaves use
  the existing analytic derivative backend with fresh inverses, not an independent derivative formula. This is
  not equality of separately evolving trajectories or a statistical accuracy claim. GFMC_t (tau) and both drivers'
  dedicated stress evaluations retain their debug-twin guarantees. Mixed XLA GFMC_t additionally has an end-to-end
  trajectory witness on an explicitly screened well-conditioned 2x2 open-shell determinant with J1+J2+J3; final
  walkers, projection counters, weights, and local-energy observables are compared.
verdict_methods:
- VM-IMPL-ROUTE-PARITY-001
- VM-IMPL-GFMC-SAME-INPUT-001
required_evidence:
- verdict_method: VM-IMPL-ROUTE-PARITY-001
  nodes:
  - pytest_node: tests/test_jqmc_kernel/test_jqmc_gfmc.py::TestGFMCTau::test_jqmc_gfmc_t
