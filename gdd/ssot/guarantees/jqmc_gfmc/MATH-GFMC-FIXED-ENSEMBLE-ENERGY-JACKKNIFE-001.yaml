        actual: {role: gfmc-mpc-energy-mean, expression: mpc_energy_mean}
        reference: {role: independent-weighted-jackknife-mpc-energy-mean, expression: expected_mpc_energy}
        precision:
          full: {policy: CMP-ZONE-ALLCLOSE-STRICT-001, zones: [local_energy]}
          mixed: {policy: CMP-ZONE-ALLCLOSE-STRICT-001, zones: [local_energy]}
      mpc-energy-error:
        site: tests/test_jqmc_kernel/test_gfmc_estimator_reference.py::test_gfmc_energy_and_mpc_match_fixed_ensemble_weighted_jackknife#comparison-4
        comparator: numpy.testing.assert_allclose
        actual: {role: gfmc-mpc-energy-jackknife-error, expression: mpc_energy_error}
        reference: {role: independent-weighted-jackknife-mpc-energy-error, expression: expected_mpc_energy_error}
        precision:
