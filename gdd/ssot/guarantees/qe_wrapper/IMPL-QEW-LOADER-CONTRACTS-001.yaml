id: IMPL-QEW-LOADER-CONTRACTS-001
kind: implementation
name: QE loader contracts
plain_language: Cells, atoms, cutoffs, bands, wavefunctions, and reference bundles load as reviewed; LSDA saves are detected
  with per-spin band splits and truncation; antiferromagnetic tagged labels resolve through UPF files; missing species,
  missing UPF files, invalid spin selections, and spin on restricted saves are hard errors.
