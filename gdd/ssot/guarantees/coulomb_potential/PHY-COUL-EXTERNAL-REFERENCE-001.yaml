id: PHY-COUL-EXTERNAL-REFERENCE-001
kind: physical
name: External-reference agreement of the Ewald sums
plain_language: The Ewald ion-ion, electron-ion, and electron-electron sums agree with pymatgen on reviewed bulk, monoclinic,
  slab, and vacuum-electron systems, and the NaCl Madelung constant is reproduced; molecular input is rejected by the Ewald
  builder.
verdict_methods:
- VM-PHY-REFERENCE-001
- VM-ERROR-DISPOSITION-001
required_evidence:
- verdict_method: VM-PHY-REFERENCE-001
  nodes:
  - pytest_node: tests/test_jqmc_kernel/test_coulomb_potential.py::TestEwaldExternal::test_compute_ewald_potential_ii_vs_pymatgen_nacl_sc
    executable_checks:
      d8-n-102:
        site: tests/test_jqmc_kernel/test_coulomb_potential.py::TestEwaldExternal.test_compute_ewald_potential_ii_vs_pymatgen_nacl_sc#comparison-1
        comparator: numpy.testing.assert_allclose
        actual:
          role: source-computed-value
          expression: float(ewald_data.ii_energy)
        reference:
          role: source-reference-value
          expression: PYMATGEN_E_II_NACL_SC_HA
        precision:
          full:
            policy: CMP-SOURCE-CENTRAL-PAIR-001
            pair: TOL-D8-EWALD-VS-EXTERNAL-REFERENCE-R-EWALD-VS-EXTERNAL-REFERENCE-001
          mixed:
