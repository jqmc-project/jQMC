      comparison-1:
        site: tests/test_jqmc_kernel/test_jastrow_dtn.py::TestDTNPhaseB.test_compute_coulomb_potential_fast_with_dtn#comparison-1
        comparator: numpy.testing.assert_allclose
        actual:
          role: existing-test-actual
          expression: np.asarray(V_fast)
        reference:
          role: existing-test-reference
          expression: np.asarray(V_ref)
        precision:
          full:
            policy: CMP-ZONE-ALLCLOSE-STRICT-001
            zones:
            - coulomb
