id: IMPL-COUL-FAST-UPDATE-001
kind: implementation
name: Fast-update and dispatch equivalence of the Coulomb layer
plain_language: The fast and streaming Coulomb routes equal the reference recomputation (nearest-neighbor ECP fast update,
  streaming state vs the reference path, fast vs LU reference, fast vs fast debug), and the dispatcher selects the correct
  PBC/molecular branch.
verdict_methods:
- VM-IMPL-ROUTE-PARITY-001
required_evidence:
- verdict_method: VM-IMPL-ROUTE-PARITY-001
  nodes:
  - pytest_node: tests/test_jqmc_kernel/test_jastrow_dtn.py::TestDTNPhaseB::test_compute_coulomb_potential_fast_with_dtn
