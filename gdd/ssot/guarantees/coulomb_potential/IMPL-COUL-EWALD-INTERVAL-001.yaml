id: IMPL-COUL-EWALD-INTERVAL-001
kind: implementation
name: Per-hop Ewald electron interval-state equivalence
plain_language: >-
  The carried electron-electron Ewald state reproduces full Ewald recomputation
  initially and after all 50 prescribed moves, including lattice translations
  and exact no-ops, in cubic, tetragonal, orthorhombic and monoclinic cells
  with one, two and four electrons. No-op moves preserve every state component
  exactly. This component contract does not require a determinant or Jastrow,
  and does not claim an independent oracle for shared Ewald tables or geometry.
  Additional 127/128-electron cubic/monoclinic cases cover both batching arms.
  The orthogonal-cell shortcut must preserve general nearest-image values and
  cell Jacobians, including half-cell ties and a rotated orthogonal cell.
verdict_methods: [VM-IMPL-ROUTE-PARITY-001]
required_evidence:
- verdict_method: VM-IMPL-ROUTE-PARITY-001
  nodes:
  - pytest_node: tests/test_jqmc_kernel/test_ewald_interval_state.py::test_ewald_interval_matches_full_at_every_explicit_hop
    required_precision_modes: [full, mixed]
    required_parameter_cases:
    - {cell: [[8.0, 0.0, 0.0], [0.0, 8.0, 0.0], [0.0, 0.0, 8.0]], n_up: 1, n_dn: 0}
    - {cell: [[8.0, 0.0, 0.0], [0.0, 8.0, 0.0], [0.0, 0.0, 10.0]], n_up: 1, n_dn: 0}
    - {cell: [[8.0, 0.0, 0.0], [0.0, 9.0, 0.0], [0.0, 0.0, 10.0]], n_up: 1, n_dn: 0}
    - {cell: [[8.0, 0.0, 0.0], [0.0, 9.0, 0.0], [2.0, 0.0, 10.0]], n_up: 1, n_dn: 0}
    - {cell: [[8.0, 0.0, 0.0], [0.0, 8.0, 0.0], [0.0, 0.0, 8.0]], n_up: 1, n_dn: 1}
    - {cell: [[8.0, 0.0, 0.0], [0.0, 8.0, 0.0], [0.0, 0.0, 10.0]], n_up: 1, n_dn: 1}
    - {cell: [[8.0, 0.0, 0.0], [0.0, 9.0, 0.0], [0.0, 0.0, 10.0]], n_up: 1, n_dn: 1}
    - {cell: [[8.0, 0.0, 0.0], [0.0, 9.0, 0.0], [2.0, 0.0, 10.0]], n_up: 1, n_dn: 1}
