id: PHY-COUL-LATTICE-TRANSLATION-001
kind: physical
name: Lattice-translation invariance of the Ewald potentials
plain_language: The Ewald electron-electron and electron-ion potentials are invariant under lattice translations of the
  electron coordinates.
verdict_methods:
- VM-PHY-INVARIANT-001
required_evidence:
- verdict_method: VM-PHY-INVARIANT-001
  nodes:
  - pytest_node: tests/test_jqmc_kernel/test_coulomb_potential.py::TestEwaldPhysical::test_compute_ewald_potential_ee_pbc_lattice_translation_invariance
    executable_checks:
      comparison-1:
        site: tests/test_jqmc_kernel/test_coulomb_potential.py::TestEwaldPhysical.test_compute_ewald_potential_ee_pbc_lattice_translation_invariance#comparison-1
        comparator: numpy.testing.assert_allclose
        actual:
          role: existing-test-actual
          expression: E_shift
        reference:
          role: existing-test-reference
          expression: E_orig
        precision:
          full:
            policy: CMP-ZONE-ALLCLOSE-STRICT-001
            zones:
            - ewald
          mixed:
            policy: CMP-ZONE-ALLCLOSE-STRICT-001
            zones:
            - ewald
  - pytest_node: tests/test_jqmc_kernel/test_coulomb_potential.py::TestEwaldPhysical::test_compute_ewald_potential_ei_pbc_lattice_translation_invariance
    executable_checks:
      comparison-1:
        site: tests/test_jqmc_kernel/test_coulomb_potential.py::TestEwaldPhysical.test_compute_ewald_potential_ei_pbc_lattice_translation_invariance#comparison-1
        comparator: numpy.testing.assert_allclose
        actual:
          role: existing-test-actual
          expression: sum_shift
        reference:
          role: existing-test-reference
          expression: sum_orig
        precision:
          full:
            policy: CMP-ZONE-ALLCLOSE-STRICT-001
            zones:
            - ewald
          mixed:
            policy: CMP-ZONE-ALLCLOSE-STRICT-001
            zones:
            - ewald
