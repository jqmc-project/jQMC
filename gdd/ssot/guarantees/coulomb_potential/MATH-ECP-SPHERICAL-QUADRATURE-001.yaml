id: MATH-ECP-SPHERICAL-QUADRATURE-001
kind: mathematical
name: Degree-five exactness of the 18-point spherical rule
plain_language: >-
  The production 18-point spherical quadrature reproduces the normalized sphere integral of every
  Cartesian monomial of total degree at most five, using the exact double-factorial moment formula.
  This supplies the angular exactness condition for s/p/d projector products; it does not guarantee
  higher-degree integration. No wavefunction, electronic configuration, or sampling error bar is used.
verdict_methods: [VM-MATH-REFERENCE-001]
required_evidence:
- verdict_method: VM-MATH-REFERENCE-001
  nodes:
  - pytest_node: tests/test_jqmc_kernel/test_ecp_projector_reference.py::test_octahedral_rule_integrates_monomials_through_degree_five
