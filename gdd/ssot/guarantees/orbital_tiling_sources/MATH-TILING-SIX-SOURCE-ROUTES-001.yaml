id: MATH-TILING-SIX-SOURCE-ROUTES-001
kind: mathematical
name: Six real-source supercell routes agree in energy force and stress
plain_language: >-
  PW+pGTO composite blocks are also required, with both Cartesian and spherical
  GTO children where parameterized; independent supercell J3 remains separate.
  QE and PySCF TREXIO each support physical-supercell Gamma, one general k and
  a nonuniform weighted twist ensemble from complete primitive k cosets. For
  each sector and the weighted aggregate, tiled and ordinary explicit-supercell
  orbitals agree in kinetic, potential and total local energy, every physical
  atomic derivative and all nine raw strain derivatives. XLA autograd equals
  analytical and Rust analytical equals XLA analytical. Finite J1/J2 and
  independent supercell J3 with cross-cell M, and finite DTN as a separate
  family, participate. Restricted Li and independent-spin O are actual source
  fixtures; both precisions and every source backend are required.
verdict_methods: [VM-MATH-REFERENCE-001]
contract_authority: cutover
cutover_requirement: blocking
required_evidence:
- verdict_method: VM-MATH-REFERENCE-001
  nodes:
