id: MATH-PWP-PROJECTION-IDENTITIES-001
kind: mathematical
name: Projection algebra identities
plain_language: 'The projection algebra is exact: orthogonal PW design matrices, B-spline partition of unity, knot interpolation,
  exact PW-to-PW projection with declared truncation, Fourier-domain matrices equal to the real-space and FFT evaluations,
  block projection equal to the full eigensolve, Schur consistency, and batched design matrices equal to per-primitive assembly
  with preserved norms.'
verdict_methods:
- VM-MATH-REVIEWED-IDENTITY-001
required_evidence:
- verdict_method: VM-MATH-REVIEWED-IDENTITY-001
  nodes:
  - pytest_node: tests/test_jqmc_kernel/test_pw_pgto_projection.py::TestPWPGTOProjection::test_build_pw_design_matrix_orthogonal
    executable_checks:
      d8-n-443:
        site: tests/test_jqmc_kernel/test_pw_pgto_projection.py::TestPWPGTOProjection.test_build_pw_design_matrix_orthogonal#comparison-1
        comparator: numpy.testing.assert_allclose
        actual:
          role: source-computed-value
          expression: gram
        reference:
          role: source-reference-value
          expression: cell.volume * np.eye(len(millers))
        precision:
          full:
            policy: CMP-SOURCE-CENTRAL-PAIR-001
            pair: TOL-D8-PW-PROJECTION-FP64-LOOSE-R-PYTHON-FP64-LOOSE-001
          mixed:
            policy: CMP-SOURCE-CENTRAL-PAIR-001
            pair: TOL-D8-PW-PROJECTION-FP64-LOOSE-R-PYTHON-FP64-LOOSE-001
