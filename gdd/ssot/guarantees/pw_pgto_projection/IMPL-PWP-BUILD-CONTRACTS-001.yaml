id: IMPL-PWP-BUILD-CONTRACTS-001
kind: implementation
name: Primitive-build contracts
plain_language: pGTO primitive construction is uncontracted with the declared counts, ignores pswfc fit coefficients, evaluates
  periodically on the declared grid, and filters diffuse shells by alpha_min; mismatched lengths are hard errors.
verdict_methods:
- VM-IMPL-REVIEWED-CONTRACT-001
- VM-ERROR-DISPOSITION-001
required_evidence:
