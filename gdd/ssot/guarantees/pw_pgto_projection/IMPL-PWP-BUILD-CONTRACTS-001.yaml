  - pytest_node: tests/test_jqmc_kernel/test_pw_pgto_projection.py::TestPWPGTOProjection::test_build_pgto_primitives_is_uncontracted_and_ignores_pswfc_fit_coefficients
  - pytest_node: tests/test_jqmc_kernel/test_pw_pgto_projection.py::TestPWPGTOProjection::test_eval_primitive_periodicity
    executable_checks:
      d8-n-457:
