          role: source-reference-value
          expression: vals_shift
        precision:
          full:
            policy: CMP-SOURCE-CENTRAL-PAIR-001
            pair: TOL-D8-PW-PROJECTION-FP64-R-PYTHON-FP64-LOOSE-001
          mixed:
            policy: CMP-SOURCE-CENTRAL-PAIR-001
            pair: TOL-D8-PW-PROJECTION-FP64-R-PYTHON-FP64-LOOSE-001
  - pytest_node: tests/test_jqmc_kernel/test_pw_pgto_projection.py::TestPWPGTOProjection::test_grid_points_shape
  - pytest_node: tests/test_jqmc_kernel/test_pw_pgto_projection.py::TestPWPGTOProjection::test_filter_shells_by_alpha_min_drops_diffuse
- verdict_method: VM-ERROR-DISPOSITION-001
