id: MATH-PWP-RECIPROCAL-GAUGE-INVARIANCE-001
kind: mathematical
name: Reciprocal-gauge invariance of PW, pGTO, and mixed conversion
plain_language: The PW, pGTO, and mixed pGTO+PW converters preserve their physical output when k and every Miller row are
  transported together by an integer reciprocal shift so that G+k is unchanged, including the +pi/-pi boundary. Changing k
  without the Miller transport is required to remain different.
verdict_methods:
- VM-MATH-REVIEWED-IDENTITY-001
required_evidence:
- verdict_method: VM-MATH-REVIEWED-IDENTITY-001
  nodes:
  - pytest_node: tests/test_jqmc_kernel/test_pw_pgto_projection.py::TestPWPGTOProjection::test_pw_to_pgto_converters_are_reciprocal_gauge_invariant
