id: IMPL-QE-ORBITAL-TILING-001
kind: implementation
name: Primitive-cell B-spline bands unfold into a frozen-node supercell without quadratic spline storage
plain_language: For an integer tiling matrix S, jQMC constructs the physical cell S times the primitive row-lattice cell,
  enumerates exactly abs(det(S)) primitive translations, and accepts exactly that many distinct primitive k representatives
  satisfying S k = 0 modulo reciprocal-lattice integers. The tiled complex B-spline leaf keeps every occupied k block on the
  primitive grid, applies its own Bloch phase, and normalizes each block by abs(det(S))^-1/2. On a synthetic 2x1x1 case its
  values, gradients and Laplacian equal separately evaluated primitive-k leaves, it is periodic in the supercell, uses only
  linear-in-abs(det(S)) spline storage, shares the coefficient allocation with its time-reversal sibling, and stores the AO-to-occupied-MO
  map as an empty implicit identity. A general determinant-minus-two skew tiling reproduces the expected cell and atom cosets.
  The QE builder, HDF5 round trip and jqmc-tool command preserve the tiled leaf and implicit identity. A freshly built native
  extension reproduces XLA VGL and log-determinant results while reading that empty identity payload. These are synthetic
  setup and route-parity checks in each precision mode; they do not claim optimized spline nodes or twist averaging, both
  of which are outside this frozen-node representation.
