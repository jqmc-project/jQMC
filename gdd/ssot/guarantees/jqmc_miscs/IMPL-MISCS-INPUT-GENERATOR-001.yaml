id: IMPL-MISCS-INPUT-GENERATOR-001
kind: implementation
name: Parameter registry and TOML emission contracts
plain_language: Parameter resolution keeps explicit values, fills None from defaults, returns deep copies with the declared
  sections, and TOML emission writes atomically, round-trips, formats primitives and nested structures, and truncates long
  comments; unknown job types and missing required fields are hard errors that list the valid choices.
