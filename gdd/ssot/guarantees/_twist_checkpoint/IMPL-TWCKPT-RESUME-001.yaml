id: IMPL-TWCKPT-RESUME-001
kind: implementation
name: Resume equals the uninterrupted run
plain_language: 'Resuming reproduces the uninterrupted result (route parity): skipped completed twists reproduce
  the uninterrupted average, resume after a partial chunk matches the uninterrupted final state, a single chunk matches
  the unchunked call, shared state round-trips, and the no-checkpoint and overwrite behaviors follow the reviewed contract.'
verdict_methods:
- VM-IMPL-ROUTE-PARITY-001
- VM-IMPL-REVIEWED-CONTRACT-001
required_evidence:
- verdict_method: VM-IMPL-ROUTE-PARITY-001
  nodes:
  - pytest_node: tests/test_jqmc_kernel/test_twist_partial_resume_mpi.py::test_partial_twist_resume_matches_uninterrupted_values
    required_precision_modes: [full, mixed]
    required_parameter_cases: [{cached_index: 0}, {cached_index: 1}]
    executable_checks:
      per-twist-values:
        site: tests/test_jqmc_kernel/test_twist_partial_resume_mpi.py::test_partial_twist_resume_matches_uninterrupted_values#exact-comparison-1
        comparator: numpy.testing.assert_array_equal
        actual: {role: resumed-indexed-twist-values, expression: observed}
        reference: {role: uninterrupted-indexed-twist-values, expression: reference}
        iterations: {variable: name, required_values: [per_twist_E, per_twist_E_std]}
        precision:
          full: {policy: CMP-EXACT-VALUES-001}
          mixed: {policy: CMP-EXACT-VALUES-001}
      combined-values:
        site: tests/test_jqmc_kernel/test_twist_partial_resume_mpi.py::test_partial_twist_resume_matches_uninterrupted_values#exact-comparison-2
        comparator: numpy.testing.assert_array_equal
        actual: {role: resumed-energy-error-dispersion, expression: observed_aggregate}
        reference: {role: uninterrupted-energy-error-dispersion, expression: expected_aggregate}
        precision:
          full: {policy: CMP-EXACT-VALUES-001}
          mixed: {policy: CMP-EXACT-VALUES-001}
      normalized-weights:
        site: tests/test_jqmc_kernel/test_twist_partial_resume_mpi.py::test_partial_twist_resume_matches_uninterrupted_values#exact-comparison-3
        comparator: numpy.testing.assert_array_equal
        actual: {role: resumed-normalized-weights, expression: actual.energy.W}
        reference: {role: explicit-unequal-weights, expression: 'np.asarray([0.25, 0.75])'}
        precision:
          full: {policy: CMP-EXACT-VALUES-001}
          mixed: {policy: CMP-EXACT-VALUES-001}
      independent-weighted-mean:
        site: tests/test_jqmc_kernel/test_twist_partial_resume_mpi.py::test_partial_twist_resume_matches_uninterrupted_values#exact-comparison-4
        comparator: numpy.testing.assert_array_equal
        actual: {role: resumed-weighted-mean, expression: actual.energy.E_TA}
        reference: {role: explicit-weighted-sum, expression: '0.25 * expected.per_twist_E[0] + 0.75 * expected.per_twist_E[1]'}
        precision:
          full: {policy: CMP-EXACT-VALUES-001}
          mixed: {policy: CMP-EXACT-VALUES-001}
  - pytest_node: tests/test_jqmc_kernel/test_twist_partial_resume_mpi.py::test_twist_stopped_on_max_time_is_rerun_on_resume
    required_precision_modes: [full, mixed]
    required_parameter_cases: [{}]
    executable_checks:
      per-twist-values:
        site: tests/test_jqmc_kernel/test_twist_partial_resume_mpi.py::test_twist_stopped_on_max_time_is_rerun_on_resume.assert_same_values#exact-comparison-1
        comparator: numpy.testing.assert_array_equal
        actual: {role: resumed-after-max-time-twist-values, expression: observed}
        reference: {role: uninterrupted-indexed-twist-values, expression: reference}
        iterations: {variable: name, required_values: [per_twist_E, per_twist_E_std]}
        precision:
          full: {policy: CMP-EXACT-VALUES-001}
          mixed: {policy: CMP-EXACT-VALUES-001}
      combined-values:
        site: tests/test_jqmc_kernel/test_twist_partial_resume_mpi.py::test_twist_stopped_on_max_time_is_rerun_on_resume.assert_same_values#exact-comparison-2
        comparator: numpy.testing.assert_array_equal
        actual: {role: resumed-after-max-time-energy-error-dispersion, expression: observed_aggregate}
        reference: {role: uninterrupted-energy-error-dispersion, expression: expected_aggregate}
        precision:
          full: {policy: CMP-EXACT-VALUES-001}
          mixed: {policy: CMP-EXACT-VALUES-001}
