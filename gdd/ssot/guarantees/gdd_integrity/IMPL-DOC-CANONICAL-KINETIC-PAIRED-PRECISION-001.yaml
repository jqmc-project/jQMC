id: IMPL-DOC-CANONICAL-KINETIC-PAIRED-PRECISION-001
kind: implementation
name: Canonical kinetic oracle partitions retain paired full and mixed pattern closure
plain_language: The kinetic oracle split preserves the full mathematical strict allclose and mixed orbital_derivative
  block-norm fidelity obligations across every independently authored canonical pattern, including WF-PATTERN-017. Each partial kinetic registration must have a sibling
  with the identical pytest node and entire physical requirement, including seed, activation and configuration. Both the static
  canonical ledger gate and runtime module-contract loader reject missing precision or pattern coverage. Legacy both-mode
  allclose, physical both-mode execution, activation/electron policy and streaming distinct sites remain mandatory. Negative
  witnesses exercise missing siblings, missing and duplicate selectors, changed seed or scale, undeclared policy/quantity/comparator,
  physical precision deletion, changed activation or condition filtering, and other-operation exceptions. This is receipt-contract
  detection, separate from the scientific numerical outcomes. The ten-field canonical consumer map applies the identical paired
  closure and records each numerical registration precision separately from its unchanged both-mode physical execution.
verdict_methods:
- VM-IMPL-REVIEWED-CONTRACT-001
