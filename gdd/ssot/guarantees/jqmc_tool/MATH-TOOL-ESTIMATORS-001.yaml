id: MATH-TOOL-ESTIMATORS-001
kind: mathematical
name: Energy and force estimator correctness
plain_language: 'The jackknife energy and force estimators reproduce the exactly known statistics of synthetic random data
  (mathematical reference), including multi-rank aggregation and the LRDMC extrapolation; finite equal-weight,
  equal-sized bin inputs obey the exact identity jackknife-error == sd_sample(bin means)/sqrt(N_bin), independently evaluated
  through pairwise bin-mean differences. Fourfold repetition preserves the bin means and their standard error; halving deviations
  halves the standard error; zero-variance data have zero error. Each specified independent input is checked against its
  own finite-data reference, never against a sampling-error band or an unconditional 1/sqrt(raw sample count) rule; the
  a->0 extrapolation recovers a known linear intercept and REFUSES an underdetermined polynomial order instead of returning
  a minimum-norm garbage intercept; the MPC-corrected error bar is the covariance-aware combined jackknife, never
  the independent quadrature that under-reported by 25.5%; LRDMC compute-energy detects the correction of a genuine
  mpc=True run even when the merged checkpoint reduces every observable onto rank_0 only, so the placeholder empty ranks
  left over from that reduction never mask a real correction as "mpc=False"; twist-sharded MCMC and LRDMC checkpoints are
  reduced from independent per-twist estimators with embedded normalized BZ weights (including unequal weights), never pooled
  or silently assigned equal weights; pre-upgrade directories without embedded weight/count metadata are rejected; single-process
  post-processing reproduces the E/F/P summaries produced internally by the MPI twist driver; the constant-value force is
  exact, and force requests without derivatives are hard errors. Single-checkpoint mcmc and lrdmc compute-force at the
  smallest accepted windows (one measurement per bin, uneven bins, two ranks), and lrdmc compute-energy, compute-force
  (checkpoint file and twist directory) and extrapolate-energy at the documented minima -b 10 -w 25 -c 5, print the force
  table, energy and two-spacing linear continuum intercept of an independent delete-one-replica jackknife written from
  the estimator definition.'
verdict_methods:
- VM-MATH-REFERENCE-001
- VM-MATH-REVIEWED-IDENTITY-001
- VM-ERROR-DISPOSITION-001
- VM-MATH-FIXED-SAMPLE-001
