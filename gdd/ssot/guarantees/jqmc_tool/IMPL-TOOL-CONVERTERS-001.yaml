id: IMPL-TOOL-CONVERTERS-001
kind: implementation
name: Conversion command contracts
plain_language: 'TREXIO conversion preserves the AO universe (full equals uncontracted, PBC J3 loads round-trip), AO selection
  and QE conversion follow the reviewed contract including DTN and J3 Jastrow payloads (the converter tests
  living in the DTN battery register here), the periodic DTN cutoff ratios exposed by ``jqmc-tool qe`` and by the QE TOML
  fallback are the single shared default DTN_DEFAULT_CUTOFF_RATIO (0.95) with an explicit ratio winning over it, and DTN
  with the Pade family is rejected.'
