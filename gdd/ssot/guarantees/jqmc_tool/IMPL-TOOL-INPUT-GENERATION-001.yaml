id: IMPL-TOOL-INPUT-GENERATION-001
kind: implementation
name: Input-generation command contracts
plain_language: The generate-input commands create MCMC, LRDMC, and VMC input files exactly when requested, with and without
  comments, and never without the flag; and the generated file is still a valid CONTINUATION input, because the documented
  journey edits restart = true in that same file. A key that is both frozen-on-restart and evolves during the run (E_scf)
  must therefore not be emitted with a placeholder value, or the frozen-key guard refuses the restart the tool itself advertised.
verdict_methods:
- VM-IMPL-REVIEWED-CONTRACT-001
