    - {layout: twist-complex-phase-jump}
  - pytest_node: tests/test_jqmc_kernel/test_tool_vmc_average_wf.py::test_average_wf_warns_when_parameters_do_not_change_together
    required_precision_modes: [full, mixed]
    required_parameter_cases: [{}]
