id: MATH-TA-DRIVER-TWIST-WEIGHT-PAIRING-001
kind: mathematical
name: The twist-average driver pairs each twist's k point with its own weight on an exact folding identity
plain_language: >-
  On the free-electron band-folding system of MATH-HAM-FREE-ELECTRON-TWIST-SUPERCELL-001 (3 x 1 x 1, primitive
  twists 0 and 1/3 with unequal weights 1 and 2), the production driver run_twist_average_from_hamiltonians, run
  through the two-rank twist-root data flow with a deterministic per-twist MCMC stand-in that returns the exact
  production local energy of the Hamiltonian it was handed at a fixed configuration, returns E_TA equal to the
  supercell Gamma local energy per primitive cell at three seeded configurations, within the strict zone policy.
  Handing the driver its Hamiltonian list reversed against the weights must fail at every seed. Full and mixed are
  judged separately. The stochastic sampler itself is not claimed.
verdict_methods: [VM-MATH-REVIEWED-IDENTITY-001]
required_evidence:
- verdict_method: VM-MATH-REVIEWED-IDENTITY-001
  nodes:
  - pytest_node: tests/test_jqmc_kernel/test_twist_supercell_folding.py::test_twist_driver_pairs_each_k_point_with_its_weight_on_the_folding_identity
    required_precision_modes: [full, mixed]
    required_parameter_cases: [{}]
