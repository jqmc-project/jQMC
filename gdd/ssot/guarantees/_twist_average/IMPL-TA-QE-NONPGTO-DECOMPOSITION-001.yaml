id: IMPL-TA-QE-NONPGTO-DECOMPOSITION-001
kind: implementation
name: QE plane-wave, B-spline and composite twists decompose into per-twist chains plus the BZ weighted sum
plain_language: 'For each QE projection kind pw, bspline, pgto+pw and pgto+bspline, the committed Li_gamma and Li_k025 saves
  converted by convert_qe_to_twist_average_input and loaded by load_twist (twist 0 at Gamma, twist 1 at non-Gamma k with the complex plane-wave,
  B-spline or composite leaf at k025) run under a two-rank world through run_twist_average_from_hamiltonians with the
  non-uniform raw weights 0.75 and 0.25; the driver per-twist energies and error bars equal standalone MCMC chains with
  the same seeds on the same intra communicators, and E_TA, E_TA_std and s_twist equal the weighted arithmetic on those
  per-twist values. The two twist energies are asserted to separate the true combine from the reversed weight vector by
  more than the pin.'
verdict_methods:
- VM-IMPL-REVIEWED-CONTRACT-001
required_evidence:
- verdict_method: VM-IMPL-REVIEWED-CONTRACT-001
  nodes:
