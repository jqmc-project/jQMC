id: IMPL-TA-GFMC-TWO-TWIST-COMBINE-001
kind: implementation
name: GFMC two-twist driver output equals standalone chains and the hand BZ combine
plain_language: >-
  run_twist_average_gfmc on two physically distinct periodic Li twists (real Gamma and complex k = 0.25) with raw
  weights 1:3, one rank per twist emulated in one process through the production inter-comm SUM data flow, reports
  per-twist energy, error, force, stress and pressure that are byte identical to standalone GFMC_t and GFMC_n chains
  built with the documented per-twist seed and no twist weight. The reported BZ energy, error, twist dispersion,
  force, stress and pressure equal the documented weighted formulas applied to those per-twist values. A changed
  twist weight or a shifted per-twist energy must fail that combine check. Full and mixed are judged separately.
verdict_methods: [VM-IMPL-ROUTE-PARITY-001]
required_evidence:
- verdict_method: VM-IMPL-ROUTE-PARITY-001
  nodes:
  - pytest_node: tests/test_jqmc_kernel/test_integration_gfmc_twist_average.py::TestGFMCTwoTwistCombine::test_two_distinct_twists_combine_equals_hand_weighted_standalone_runs
    executable_checks:
      d8-h-003:
        site: tests/test_jqmc_kernel/test_integration_gfmc_twist_average.py::_assert_bz_hand_combine#comparison-1
        comparator: numpy.testing.assert_allclose
        actual:
          role: source-computed-value
          expression: result.energy.E_TA
        reference:
          role: source-reference-value
          expression: W[0] * E_k[0] + W[1] * E_k[1]
        precision:
          full:
            policy: CMP-SOURCE-CENTRAL-PAIR-001
            pair: TOL-D8-PYTHON-FP64-BZ-MEAN-R-PYTHON-FP64-ZERO-001
          mixed:
            policy: CMP-SOURCE-CENTRAL-PAIR-001
            pair: TOL-D8-PYTHON-FP64-BZ-MEAN-R-PYTHON-FP64-ZERO-001
      d8-h-004:
        site: tests/test_jqmc_kernel/test_integration_gfmc_twist_average.py::_assert_bz_hand_combine#comparison-2
        comparator: numpy.testing.assert_allclose
        actual:
          role: source-computed-value
          expression: result.energy.E_TA_std
        reference:
          role: source-reference-value
          expression: np.sqrt(W[0] ** 2 * s_k[0] ** 2 + W[1] ** 2 * s_k[1] ** 2)
        precision:
          full:
            policy: CMP-SOURCE-CENTRAL-PAIR-001
            pair: TOL-D8-PYTHON-FP64-BZ-MEAN-R-PYTHON-FP64-ZERO-001
          mixed:
            policy: CMP-SOURCE-CENTRAL-PAIR-001
            pair: TOL-D8-PYTHON-FP64-BZ-MEAN-R-PYTHON-FP64-ZERO-001
      d8-h-005:
        site: tests/test_jqmc_kernel/test_integration_gfmc_twist_average.py::_assert_bz_hand_combine#comparison-3
        comparator: numpy.testing.assert_allclose
        actual:
          role: source-computed-value
          expression: result.energy.s_twist
        reference:
          role: source-reference-value
          expression: np.sqrt(W[0] * (E_k[0] - result.energy.E_TA) ** 2 + W[1] * (E_k[1] - result.energy.E_TA) ** 2)
        precision:
          full:
            policy: CMP-SOURCE-CENTRAL-PAIR-001
            pair: TOL-D8-PYTHON-FP64-BZ-MEAN-R-PYTHON-FP64-ZERO-001
          mixed:
            policy: CMP-SOURCE-CENTRAL-PAIR-001
            pair: TOL-D8-PYTHON-FP64-BZ-MEAN-R-PYTHON-FP64-ZERO-001
      d8-h-006:
        site: tests/test_jqmc_kernel/test_integration_gfmc_twist_average.py::_assert_bz_hand_combine#comparison-4
        comparator: numpy.testing.assert_allclose
        actual:
          role: source-computed-value
          expression: agg.F_TA
        reference:
          role: source-reference-value
          expression: W[0] * per[0] + W[1] * per[1]
        precision:
          full:
            policy: CMP-SOURCE-CENTRAL-PAIR-001
            pair: TOL-D8-PYTHON-FP64-BZ-MEAN-R-PYTHON-FP64-ZERO-001
          mixed:
            policy: CMP-SOURCE-CENTRAL-PAIR-001
            pair: TOL-D8-PYTHON-FP64-BZ-MEAN-R-PYTHON-FP64-ZERO-001
        iterations:
          variable: label
          required_values: [F_TA, T_TA, P_TA]
      d8-h-002:
        site: tests/test_jqmc_kernel/test_integration_gfmc_twist_average.py::_assert_bz_hand_combine#comparison-5
        comparator: numpy.testing.assert_allclose
        actual:
          role: source-computed-value
          expression: agg.F_TA_std
        reference:
          role: source-reference-value
          expression: np.sqrt(W[0] ** 2 * per_std[0] ** 2 + W[1] ** 2 * per_std[1] ** 2)
        precision:
          full:
            policy: CMP-SOURCE-CENTRAL-PAIR-001
            pair: TOL-D8-PYTHON-FP64-BZ-MEAN-R-PYTHON-FP64-ZERO-001
          mixed:
            policy: CMP-SOURCE-CENTRAL-PAIR-001
            pair: TOL-D8-PYTHON-FP64-BZ-MEAN-R-PYTHON-FP64-ZERO-001
        iterations:
          variable: label
          required_values: [F_TA, T_TA, P_TA]
  - pytest_node: tests/test_jqmc_kernel/test_integration_gfmc_twist_average.py::TestGFMCTwoTwistCombine::test_two_twist_combine_oracle_rejects_perturbed_weight_and_twist_value
  - pytest_node: tests/test_jqmc_kernel/test_integration_gfmc_twist_average.py::TestGFMCTwoTwistCombine::test_per_twist_stress_reference_is_root_value_on_every_rank
