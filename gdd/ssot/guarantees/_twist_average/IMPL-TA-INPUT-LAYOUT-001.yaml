id: IMPL-TA-INPUT-LAYOUT-001
kind: implementation
name: Twist-average input layout
plain_language: The twist-average input round-trips through writer and reader preserving independent complex SD spin channels,
  per-twist Hamiltonians load, the single/combined layout is selected without version metadata, the incremental writer equals the batch entry point, and every
  malformed payload (non-canonical SD, inconsistent time reversal, lambda payloads, extra MO rows, missing required content, incomplete
  or duplicate twists) is rejected.
verdict_methods:
- VM-IMPL-ROUTE-PARITY-001
- VM-IMPL-REVIEWED-CONTRACT-001
- VM-ERROR-DISPOSITION-001
required_evidence:
- verdict_method: VM-IMPL-ROUTE-PARITY-001
  nodes:
  - pytest_node: tests/test_jqmc_kernel/test_twist_average.py::TestTwistAverageInputLayout::test_twist_average_input_writer_reader_roundtrip
  - pytest_node: tests/test_jqmc_kernel/test_twist_average.py::TestTwistAverageInputLayout::test_twist_roundtrip_preserves_independent_complex_sd_spin_channels
  - pytest_node: tests/test_jqmc_kernel/test_twist_average.py::TestTwistAverageInputLayout::test_multi_twist_roundtrip_preserves_independent_complex_sd_spin_channels
  - pytest_node: tests/test_jqmc_kernel/test_twist_average.py::TestTwistAverageInputLayout::test_load_twist_returns_per_twist_hamiltonian
  - pytest_node: tests/test_jqmc_kernel/test_twist_average.py::TestTwistAverageWriterStreaming::test_incremental_writer_matches_batch_entry_point
- verdict_method: VM-IMPL-REVIEWED-CONTRACT-001
  nodes:
  - pytest_node: tests/test_jqmc_kernel/test_twist_average.py::TestTwistAverageInputLayout::test_is_twist_average_input_distinguishes_combined_and_single
