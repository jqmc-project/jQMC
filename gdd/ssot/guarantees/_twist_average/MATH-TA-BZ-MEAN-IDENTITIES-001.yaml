id: MATH-TA-BZ-MEAN-IDENTITIES-001
kind: mathematical
name: BZ-mean estimator identities
plain_language: 'The BZ-mean estimators satisfy their exact algebra (mathematical): identical-twist replication
  leaves energy and force unchanged, constant shifts translate only the average, weights are scale invariant, single-twist
  means equal their input, the estimator quartet is consistent at one twist, and dual-path and weighted sums match hand
  references.'
verdict_methods:
- VM-MATH-REVIEWED-IDENTITY-001
- VM-MATH-REFERENCE-001
required_evidence:
- verdict_method: VM-MATH-REVIEWED-IDENTITY-001
  nodes:
