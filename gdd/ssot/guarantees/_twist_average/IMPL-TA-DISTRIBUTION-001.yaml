id: IMPL-TA-DISTRIBUTION-001
kind: implementation
name: Twist distribution and reduction contracts
plain_language: Weight normalization, world splitting, two-communicator column classification and plan-B routing, deterministic
  twist-scoped RNG namespaces, per-twist chain decomposition for MCMC and GFMC, root aggregation with broadcast, complete
  per-twist k-point metadata on every rank, and derivative-cache defaults follow the reviewed contract; invalid weights,
  non-divisor splits, and cache-disable requests are hard errors.
verdict_methods:
- VM-IMPL-REVIEWED-CONTRACT-001
- VM-ERROR-DISPOSITION-001
required_evidence:
- verdict_method: VM-IMPL-REVIEWED-CONTRACT-001
