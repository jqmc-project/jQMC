id: MATH-TA-MPC-BZ-AGGREGATION-001
kind: mathematical
name: MPC BZ aggregation preserves joint uncertainty
plain_language: The twist-averaged MPC correction and corrected total use normalized BZ weights for their means and independent-chain
  quadrature for their per-twist errors, every corrected-total input error comes from the covariance-aware same-walker joint
  estimator rather than rebuilding a quadrature from Ewald and correction bars, and deterministic twist-scoped RNG namespaces
  make the independent-chain premise true without changing the single-twist stream.
verdict_methods:
- VM-MATH-REFERENCE-001
required_evidence:
- verdict_method: VM-MATH-REFERENCE-001
  nodes:
  - pytest_node: tests/test_jqmc_kernel/test_twist_average_mpc.py::test_mpc_bz_aggregate_uses_unequal_weights_and_joint_per_twist_errors
  - pytest_node: tests/test_jqmc_kernel/test_twist_decomposition_mpi.py::test_mpc_bz_aggregate_uses_real_twist_root_mpi_collectives
    executable_checks:
