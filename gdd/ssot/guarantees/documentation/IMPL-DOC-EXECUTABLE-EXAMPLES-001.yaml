id: IMPL-DOC-EXECUTABLE-EXAMPLES-001
kind: implementation
name: Published examples use the supported interfaces and staging conventions
plain_language: >-
  The published analysis and workflow snippets use valid dump selection,
  checkpoint handoff, minimum analysis populations, and QE input staging.
  The weighted-statistics example executes. Model-based staging tests cover
  both restricted and LSDA wavefunction filenames; they do not certify a
  physical energy or a complete external QE calculation.
