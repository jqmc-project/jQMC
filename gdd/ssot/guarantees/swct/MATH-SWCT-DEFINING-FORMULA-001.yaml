id: MATH-SWCT-DEFINING-FORMULA-001
kind: mathematical
name: SWCT weights equal the defining formula on the right displacements
plain_language: Under PBC the production and debug omega, domega and omega-dot equal an independent brute-force minimum-image
  evaluation of kappa = 1/d^4; for molecules the weights are the raw r - R formula bit for bit.
