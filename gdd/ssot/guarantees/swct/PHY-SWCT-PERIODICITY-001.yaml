id: PHY-SWCT-PERIODICITY-001
kind: physical
name: Lattice periodicity of the SWCT weights and force correction
plain_language: Under PBC the SWCT weights, their electron-gradient sum and the SWCT force correction (omega-contracted field
  plus half the domega term) are unchanged when electrons (kept unwrapped by the drivers) or nuclei are moved by lattice
  vectors, on orthorhombic and oblique cells with nuclei near the cell faces.
verdict_methods:
- VM-PHY-INVARIANT-001
required_evidence:
- verdict_method: VM-PHY-INVARIANT-001
