id: IMPL-SETTING-ECP-QUADRATURE-DEFAULT-001
kind: implementation
name: Twelve-point default ECP quadrature
plain_language: Every production route that leaves Nv unspecified uses the global 12-point icosahedral non-local ECP quadrature.
  Direct kernels bind Nv_default; derivative wrappers with Nv=None must reach the one central resolver; production call
  sites may not hide literal Nv values. The selected mesh is checked as an equal-weight unit-sphere icosahedron. Rust parity,
  invariant, dispatch, and driver suites that mirror an implicit production route must also use Nv=12. Lower-order meshes
  remain available only through explicit arguments and a reviewed test-suite allowlist; the pinned TurboRVB ECP
  references remain explicit Nv=6 comparisons.
verdict_methods:
- VM-IMPL-REVIEWED-CONTRACT-001
required_evidence:
- verdict_method: VM-IMPL-REVIEWED-CONTRACT-001
  nodes:
