schema_format: 1
schema_id: gdd.schema.verdicts.v1
match:
  path: gdd/ssot/verdicts.yaml
document_schema_version: 1
required_top_level:
  - schema_version
  - document
  - enforcement_map
  - classes
  - verdict_methods
  - evidence_ordering_rules
  - check_contract
  - precision_dispositions
  - comparator_semantics
  - tolerance_source_contract
  - tolerance_registry
  - comparison_policies
  - observation_policies
  - runtime_receipt
  - enforcement
optional_top_level: []
document_block:
  required_fields: [id, version, lifecycle, title, purpose]
enforcement_map_required: true
prose_keys_extra:
  - question
  - proves
  - not_proved
  - status
  - meaning
  - limits
