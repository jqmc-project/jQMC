evidence_required_from_each_subscribing_feature:
  registration_fields:
    - guarantee-id
    - canonical-suite-id
    - canonical-pattern-id
    - pytest-node-id
    - input-binding-kind
    - input-binding-id
    - electron-configuration-binding
    - required-precision
    - executable-check-ids
    - comparison-policy-ids-by-precision
  realized_case_receipt:
    operation: wavefunction_fixtures.observe_case.v2
    comparison: exact-requested-versus-observed-signature
    failures:
      - extra-active-component
      - missing-active-component
      - signature-mismatch
      - unavailable-input
      - skip
      - xfail
      - zero-collection
  activation_rule: >-
    A component counts as active only when the production evaluation route consumes
    it on nontrivial input. Merely storing it in a container is insufficient.

enforcement:
  static:
    command: python scripts/check_gdd_wavefunction_fixtures_contract.py
    pre_commit_hook: gdd-contracts
  runtime:
    state: explicit-fixture-checks-and-pytest-outcomes
    adapter: gdd.engine.execution_records
    notes: >-
      Fixture signatures and activation conditions are checked by the subscribing
      tests and explicit fixture helpers. Ordinary-module completion checks
      required collected cases and their pytest outcomes; it does not reconstruct
      fixture facts or scientific assertions from traced Python frames.
    required_before_cutover: true
