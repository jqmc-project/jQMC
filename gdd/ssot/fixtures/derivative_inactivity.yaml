schema_version: 1
document:
  id: jqmc.fixtures.derivative-inactivity
  version: 1
  lifecycle: cutover
  authority: reviewed-contract
  title: Derivative non-vacuity declarations
  purpose: >-
    Declare exact compared derivative blocks that are non-live in the original
    fixtures, without removing any analytical-versus-autodiff comparison.
enforcement_map:
  reasons: scripts/check_gdd_derivatives_contract.py
  declarations: scripts/check_gdd_derivatives_contract.py
reasons:
- id: agpn_lambda_diag
  description: "explicit common-rank AGPn built from the SD: each lambda_diag entry scales one paired column of G, so it rescales det(G) and cancels in HPsi/Psi (d ln Psi is live, d e_L is 0)"
- id: cell_anchored_no_jastrow
  description: "no Jastrow and a cell-anchored plane-wave / B-spline basis: no function depends on a nucleus (dlnPsi/dR = 0) and the orbitals are functions of fractional coordinates, so ln Psi is invariant under the joint strain of cell and electrons (dlnPsi/deps = 0)"
- id: dtn_gamma_zero
  description: "The original eight-atom QE periodic/twist DTN configurations place no electron pair inside the same nucleus's compact-support f-term cutoff, so j3_poly_gamma is inactive. This describes those fixed configurations, not a structural zero of DTN. Separate active configurations exercise this derivative."
- id: bspline_mo_e_l
  description: "The original B-spline fixtures span only the occupied orbital subspace. In these square occupied-space MO rotations, the determinant changes by a coordinate-independent factor that cancels in HPsi/Psi, although ln Psi remains sensitive. The retained zero-unexplained disposition is the original classification; the occupied-subspace mechanism has since been diagnosed. Separate fixtures with unoccupied bands exercise the energy derivative."
- id: composite_j3_child_basis
  description: "composite pGTO+PW twist J3 child-0 radial basis block: nonzero and above the comparison tolerance (a zeroed analytic block fails), but 3e-5..7e-5 of the cell scale, which is dominated by the J3 coupling matrix"
