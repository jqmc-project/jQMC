schema_version: 1

document:
  id: jqmc.fixtures.sources
  version: 1
  lifecycle: cutover
  title: Committed fixture source registry
  purpose: >-
    Assign stable IDs to committed artifacts that a guarantee case may select
    through a committed-artifact input binding.

# Who enforces each top-level section (see gdd/ssot/README.md for the legend).
enforcement_map:
  roots: scripts/check_gdd_wavefunction_fixtures_contract.py
  sources: scripts/check_gdd_wavefunction_fixtures_contract.py
  rules: per-rule

roots:
  TREXIO-EXAMPLES:
    path: tests/trexio_example_files
    provenance: committed-input
  QE-EXAMPLES:
    path: tests/qe_example_files
    provenance: committed-input
  JQMC-HAMILTONIAN-EXAMPLES:
    path: tests/jqmc_hamiltonian_data
    provenance: committed-input

  GDD-SSOT:
    path: gdd/ssot
    provenance: committed-input

